<!-- MOTOR 3D LOCAL -->
<script src="./three.min.js"></script>

<script>

let THREE=window.THREE;


/* =========================================================
   ARRANQUE
========================================================= */

function start(){

 const loadText=
  document.getElementById("loadText");

 try{

  loadText.innerText=
   "Cargando motor 3D...";

  if(!window.THREE){

   throw new Error(
    "Three.js no cargó desde ./three.min.js"
   );

  }

  THREE=window.THREE;

  loadText.innerText=
   "Creando mundo...";

  setTimeout(
   initGame,
   100
  );

 }catch(e){

  loadText.innerText=
   "No se pudo iniciar el motor 3D.";

  console.error(e);

 }

}


/* =========================================================
   JUEGO
========================================================= */

function initGame(){

   250,
   2500

   70,

   .1,
   3000
  );


 const renderer=
  new THREE.WebGLRenderer({
   antialias:true,
   powerPreference:"high-performance"
  });

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.setPixelRatio(
  Math.min(
   devicePixelRatio,
   1.5
  )
 );

 document.body.appendChild(
  renderer.domElement
 );


 /* =====================================================
    LUCES
 ===================================================== */

 const hemi=
  new THREE.HemisphereLight(
   0xffffff,
   0x43502f,
   1.7
  );

 scene.add(
  hemi
 );


 const sun=
  new THREE.DirectionalLight(
   0xffffff,
   1.4
  );

 sun.position.set(
  300,
  600,
  200
 );

 scene.add(
  sun
 );


 /* =====================================================
    MATERIALES
 ===================================================== */

 const grass=
  new THREE.MeshLambertMaterial({
   color:0x557f3b
  });

 const roadMat=
  new THREE.MeshLambertMaterial({
   color:0x383838
  });

 const wallMat=
  new THREE.MeshLambertMaterial({

  });

 const roofMat=

  });

  new THREE.MeshLambertMaterial({

  });

 const darkWood=

   color:0x432919
  });

 const trunkMat=
  new THREE.MeshLambertMaterial({
   color:0x624126
  });

 const leafMat=
  new THREE.MeshLambertMaterial({
   color:0x315d2d
  });

 const stoneMat=
  new THREE.MeshLambertMaterial({
   color:0x707070
  });

 const metalMat=
  new THREE.MeshLambertMaterial({
   color:0x4f5558
  });

 const foodMat=
  new THREE.MeshLambertMaterial({
   color:0xa52e25
  });

 const waterMat=
  new THREE.MeshLambertMaterial({
   color:0x237da0
  });


 /* =====================================================
    TERRENO
 ===================================================== */

 const terrain=
  new THREE.Mesh(
   new THREE.PlaneGeometry(
    6000,
    6000
   ),
   grass
  );

 terrain.rotation.x=
  -Math.PI/2;

 scene.add(
  terrain
 );


 /* =====================================================
    CARRETERA
 ===================================================== */

 const road=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    35,
    .1,
    5000
   ),
   roadMat
  );

 road.position.y=
  .03;

 scene.add(
  road
 );


 /* =====================================================
    PLAYER
 ===================================================== */

 const player={
  x:0,
  y:0,
  z:0,
  health:100,
  hunger:100,
  thirst:100
 };


 /* =====================================================
    INVENTARIO
 ===================================================== */

 let inventory={
  wood:0,
  stone:0,
  metal:0,
  food:2,
  water:2,
  cloth:0,
  medkit:0,
  axe:0,
  pickaxe:0
 };


 try{

  const saved=
   JSON.parse(
    localStorage.getItem(
     "survival126"
    )
   );

  if(saved){
   inventory=saved;
  }

 }catch(e){}


 function save(){

  localStorage.setItem(
   "survival126",
   JSON.stringify(
    inventory
   )
  );

 }


 /* =====================================================
    COLLIDERS
 ===================================================== */

 const colliders=[];


 function collider(
  x,
  z,
  w,
  d
 ){

  colliders.push({
   x:x,
   z:z,
   w:w,
   d:d
  });

 }


 function blocked(
  x,
  z
 ){

  const r=.35;

  for(
   const c of colliders
  ){

   if(
    x+r>
     c.x-c.w/2 &&
    x-r<
     c.x+c.w/2 &&
    z+r>
     c.z-c.d/2 &&
    z-r<
     c.z+c.d/2
   ){

    return true;

   }

  }

  return false;

 }


 /* =====================================================
    CUBO
 ===================================================== */

 function cube(
  w,
  h,
  d,
  material,
  x,
  y,
  z
 ){

  const m=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     w,
     h,
     d
    ),
    material
   );

  m.position.set(
   x,
   y,
   z
  );

  return m;

 }


 /* =====================================================
    ÁRBOLES
 ===================================================== */

 function tree(
  x,
  z,
  scale=1
 ){

  const g=
   new THREE.Group();


  const trunk=
   cube(
    .5*scale,
    3*scale,
    .5*scale,
    trunkMat,
    0,
    1.5*scale,
    0
   );


  const leaves=
   new THREE.Mesh(
    new THREE.ConeGeometry(
     1.7*scale,
     4*scale,
     7
    ),
    leafMat
   );

  leaves.position.y=
   4*scale;


  g.add(
   trunk,
   leaves
  );


  g.position.set(
   x,
   0,
   z
  );


  scene.add(
   g
  );


  collider(
   x,
   z,
   .8*scale,
   .8*scale
  );

 }


 /* =====================================================
    BOSQUE
 ===================================================== */

 for(
  let i=0;
  i<130;
  i++
 ){

  let x=
   (Math.random()-.5)*
   5000;

  let z=
   (Math.random()-.5)*
   5000;


  if(
   Math.abs(x)<250 &&
   Math.abs(z)<250
  ){

   continue;

  }


  tree(
   x,
   z,
   .7+
   Math.random()*.7
  );

 }


 /* =====================================================
    CASAS
 ===================================================== */

 const doors=[];


 function createHouse(
  x,
  z,
  w,
  d,
  floors
 ){

  /* piso */

  for(
   let f=0;
   f<floors;
   f++
  ){

   const floor=
    cube(
     w,
     .15,
     d,
     woodMat,
     x,
     f*3,
     z
    );

   scene.add(
    floor
   );

  }


  /* pared trasera */

  const back=
   cube(
    w,
    3,
    .3,
    wallMat,
    x,
    1.5,
    z+d/2
   );

  scene.add(
   back
  );


  collider(
   x,
   z+d/2,
   w,
   .3
  );


  /* lateral izquierdo */

  const left=
   cube(
    .3,
    3,
    d,
    wallMat,
    x-w/2,
    1.5,
    z
   );

  scene.add(
   left
  );


  collider(
   x-w/2,
   z,
   .3,
   d
  );


  /* lateral derecho */

  const right=
   cube(
    .3,
    3,
    d,
    wallMat,
    x+w/2,
    1.5,
    z
   );

  scene.add(
   right
  );


  collider(
   x+w/2,
   z,
   .3,
   d
  );


  /* frente dividido */

  const side=
   (w-3)/2;


  const frontL=
   cube(
    side,
    3,
    .3,
    wallMat,
    x-(side+3)/2,
    1.5,
    z-d/2
   );


  const frontR=
   cube(
    side,
    3,
    .3,
    wallMat,
    x+(side+3)/2,
    1.5,
    z-d/2
   );


  scene.add(
   frontL,
   frontR
  );


  collider(
   x-(side+3)/2,
   z-d/2,
   side,
   .3
  );


  collider(
   x+(side+3)/2,
   z-d/2,
   side,
   .3
  );


  /* puerta */

  const door=
   cube(
    2.8,
    2.7,
    .18,
    darkWood,
    x,
    1.35,
    z-d/2-.08
   );


  scene.add(
   door
  );


  const doorData={
   mesh:door,
   x:x,
   z:z-d/2,
   open:false
  };


  doors.push(
   doorData
  );


  /* ventanas */

  const window1=
   cube(
    2.2,
    1.5,
    .08,
    waterMat,
    x-w/2-.04,
    1.8,
    z
   );


  const window2=
   cube(
    2.2,
    1.5,
    .08,
    waterMat,
    x+w/2+.04,
    1.8,
    z
   );


  scene.add(
   window1,
   window2
  );


  /* marco */

  const bar1=
   cube(
    .1,
    1.6,
    .12,
    darkWood,
    x-w/2-.1,
    1.8,
    z
   );


  const bar2=
   cube(
    .1,
    1.6,
    .12,
    darkWood,
    x+w/2+.1,
    1.8,
    z
   );


  scene.add(
   bar1,
   bar2
  );


  /* segundo y tercer piso */

  for(
   let f=1;
   f<floors;
   f++
  ){

   const y=
    f*3+1.5;


   const a=
    cube(
     w,
     3,
     .3,
     wallMat,
     x,
     y,
     z-d/2
    );


   const b=
    cube(
     w,
     3,
     .3,
     wallMat,
     x,
     y,
     z+d/2
    );


   const c=
    cube(
     .3,
     3,
     d,
     wallMat,
     x-w/2,
     y,
     z
    );


   const e=
    cube(
     .3,
     3,
     d,
     wallMat,
     x+w/2,
     y,
     z
    );


   scene.add(
    a,
    b,
    c,
    e
   );

  }


  /* techo */

  const roof=
   cube(
    w+.5,
    .35,
    d+.5,
    roofMat,
    x,
    floors*3,
    z
   );


  scene.add(
   roof
  );

 }


 createHouse(
  300,
  -300,
  32,
  25,
  1
 );


 createHouse(
  -450,
  -650,
  40,
  30,
  2
 );


 createHouse(
  700,
  -550,
  48,
  34,
  2
 );


 createHouse(
  -900,
  500,
  55,
  38,
  3
 );


 createHouse(
  1000,
  700,
  65,
  45,
  3
 );


 createHouse(
  -1400,
  -900,
  70,
  48,
  3
 );


 /* =====================================================
    PICKUPS
 ===================================================== */

 const pickups=[];


 function pickup(
  type,
  x,
  z
 ){

  let mat=
   woodMat;


  if(type==="stone")
   mat=stoneMat;


  if(type==="metal")
   mat=metalMat;


  if(type==="food")
   mat=foodMat;


  if(type==="water")
   mat=waterMat;


  const o=
   cube(
    .5,
    .5,
    .5,
    mat,
    x,
    .3,
    z
   );


  o.userData.type=
   type;


  scene.add(
   o
  );


  pickups.push(
   o
  );

 }


 const types=[
  "wood",
  "wood",
  "stone",
  "metal",
  "food",
  "water"
 ];


 for(
  let i=0;
  i<45;
  i++
 ){

  pickup(
   types[
    Math.floor(
     Math.random()*
     types.length
    )
   ],
   (Math.random()-.5)*
    3000,
   (Math.random()-.5)*
    3000
  );

 }


 /* =====================================================
    JOYSTICK
 ===================================================== */

 const joy=
  document.getElementById(
   "joy"
  );


 const knob=
  document.getElementById(
   "knob"
  );


 let joyX=0;
 let joyY=0;
 let joyOn=false;


 function moveJoy(e){

  const r=
   joy.getBoundingClientRect();


  const cx=
   r.left+
   r.width/2;


  const cy=
   r.top+
   r.height/2;


  let dx=
   e.clientX-cx;


  let dy=
   e.clientY-cy;


  const max=47;


  const len=
   Math.hypot(
    dx,
    dy
   );


  if(len>max){

   dx=
    dx/len*max;

   dy=
    dy/len*max;

  }


  joyX=
   dx/max;


  joyY=
   dy/max;


  knob.style.transform=
   `translate(${dx}px,${dy}px)`;

 }


 joy.addEventListener(
  "pointerdown",
  e=>{

   joyOn=true;


   joy.setPointerCapture(
    e.pointerId
   );


   moveJoy(e);

  }
 );


 joy.addEventListener(
  "pointermove",
  e=>{

   if(joyOn)
    moveJoy(e);

  }
 );


 function releaseJoy(){

  joyOn=false;


  joyX=0;
  joyY=0;


  knob.style.transform=
   "translate(0,0)";

 }


 joy.addEventListener(
  "pointerup",
  releaseJoy
 );


 joy.addEventListener(
  "pointercancel",
  releaseJoy
 );


 /* =====================================================
    CÁMARA
 ===================================================== */

 let yaw=0;
 let pitch=-.08;


 let targetYaw=0;
 let targetPitch=-.08;


 let looking=false;
 let lastX=0;
 let lastY=0;


 renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

   if(
    e.clientX<180 ||
    e.clientY>
     innerHeight-180
   ){

    return;

   }


   looking=true;


   lastX=
    e.clientX;


   lastY=
    e.clientY;


   renderer.domElement.setPointerCapture(
    e.pointerId
   );

  }
 );


 renderer.domElement.addEventListener(
  "pointermove",
  e=>{

   if(!looking)
    return;


   const dx=
    e.clientX-lastX;


   const dy=
    e.clientY-lastY;


   lastX=
    e.clientX;


   lastY=
    e.clientY;


   targetYaw-=
    dx*.004;


   targetPitch-=
    dy*.003;


   targetPitch=
    Math.max(
     -1.1,
     Math.min(
      1.0,
      targetPitch
     )
    );

  }
 );


 renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
   looking=false;
  }
 );


 renderer.domElement.addEventListener(
  "pointercancel",
  ()=>{
   looking=false;
  }
 );

    CORRER
 ===================================================== */

 let running=false;


 const runBtn=
  document.getElementById(
   "run"

 runBtn.addEventListener(

  ()=>{
   running=true;
   runBtn.innerText=
    "🏃 CORRIENDO";
  }
 );


 runBtn.addEventListener(
  "pointerup",
  ()=>{
   running=false;
   runBtn.innerText=

  }
 );


 runBtn.addEventListener(
  "pointercancel",
  ()=>{

   runBtn.innerText=
    "🏃 CORRER";
  }
 );


 runBtn.addEventListener(
  "pointerleave",
  ()=>{
   running=false;
   runBtn.innerText=

  }
 );


 /* =====================================================
    ACCIONES
 ===================================================== */

 const action=
  document.getElementById(
   "action"
  );


 let nearDoor=null;
 let nearPickup=null;


 action.addEventListener(
  "click",
  ()=>{

   if(nearDoor){

    nearDoor.open=
     !nearDoor.open;


    if(nearDoor.open){

     nearDoor.mesh.rotation.y=
      -Math.PI/2;


     nearDoor.mesh.position.x=
      nearDoor.x-1.35;


     action.innerText=
      "CERRAR";


    }else{

     nearDoor.mesh.rotation.y=0;


     nearDoor.mesh.position.x=
      nearDoor.x;


     action.innerText=
      "ABRIR";

    }

   }

   else if(nearPickup){

    const type=
     nearPickup.userData.type;


    inventory[type]++;


    scene.remove(
     nearPickup
    );


    const index=
     pickups.indexOf(
      nearPickup
     );


    if(index>=0)
     pickups.splice(
      index,
      1
     );


    nearPickup=null;


    action.style.display=
     "none";


    save();
    updateHUD();

   }

  }
 );

    INVENTARIO
 ===================================================== */

 const panel=
  document.getElementById(
   "panel"
  );


 const content=
  document.getElementById(
   "panelContent"
  );


 function openInventory(){

  const labels={
   wood:"🪵 Madera",
   stone:"🪨 Piedra",
   metal:"🔩 Metal",
   food:"🍖 Comida",
   water:"💧 Agua",
   cloth:"🧵 Tela",
   medkit:"🩹 Botiquín",
   axe:"🪓 Hacha",
   pickaxe:"⛏️ Pico"
  };


  let html=
   '<div class="grid">';


  for(
   const key in inventory
  ){

   html+=`
    <div class="item">
     ${labels[key]}<br>
     <b>${inventory[key]}</b>
    </div>
   `;

  }


  html+="</div>";


  html+=`
   <br>

   <button class="btn" id="eat">
    🍖 COMER
   </button>

   <button class="btn" id="drink">
    💧 BEBER
   </button>

   <h3>CREAR</h3>

   <div class="item">
    🪓 Hacha<br>
    5 madera + 2 piedra<br><br>
    <button class="btn" id="axe">
     CREAR
    </button>
   </div>

   <div class="item">
    ⛏️ Pico<br>
    4 madera + 5 piedra<br><br>
    <button class="btn" id="pick">
     CREAR
    </button>
   </div>

   <div class="item">
    🩹 Botiquín<br>
    3 tela + 1 metal<br><br>
    <button class="btn" id="med">
     CREAR
    </button>
   </div>
  `;


  content.innerHTML=
   html;


  panel.style.display=
   "flex";


  document.getElementById(
   "eat"
  ).onclick=()=>{

   if(inventory.food>0){

    inventory.food--;


    player.hunger=
     Math.min(
      100,
      player.hunger+30
     );


    save();
    updateHUD();
    openInventory();

   }

  };


  document.getElementById(
   "drink"
  ).onclick=()=>{

   if(inventory.water>0){

    inventory.water--;


    player.thirst=
     Math.min(
      100,
      player.thirst+35
     );


    save();
    updateHUD();
    openInventory();

   }

  };


  document.getElementById(
   "axe"
  ).onclick=()=>{

   if(
    inventory.wood>=5 &&
    inventory.stone>=2
   ){

    inventory.wood-=5;
    inventory.stone-=2;
    inventory.axe++;


    save();
    updateHUD();
    openInventory();

   }

  };


  document.getElementById(
   "pick"
  ).onclick=()=>{

   if(
    inventory.wood>=4 &&
    inventory.stone>=5
   ){

    inventory.wood-=4;
    inventory.stone-=5;
    inventory.pickaxe++;


    save();
    updateHUD();
    openInventory();

   }

  };


  document.getElementById(
   "med"
  ).onclick=()=>{

   if(
    inventory.cloth>=3 &&
    inventory.metal>=1
   ){

    inventory.cloth-=3;
    inventory.metal--;


    inventory.medkit++;


    save();
    updateHUD();
    openInventory();

   }

  };

 }


 document.getElementById(
  "invBtn"
 ).onclick=
  openInventory;


 document.getElementById(
  "closePanel"
 ).onclick=
  ()=>{

   panel.style.display=
    "none";

  };


 /* =====================================================
    HUD
 ===================================================== */

 function updateHUD(){

  document.getElementById(
   "hpText"
  ).innerText=
   Math.round(
    player.health
   );


  document.getElementById(
   "foodText"
  ).innerText=
   Math.round(
    player.hunger
   );


  document.getElementById(
   "waterText"
  ).innerText=
   Math.round(
    player.thirst
   );


  document.getElementById(
   "hp"
  ).style.width=
   player.health+"%";


  document.getElementById(
   "food"
  ).style.width=
   player.hunger+"%";


  document.getElementById(
   "water"
  ).style.width=
   player.thirst+"%";


  document.getElementById(
   "invText"
  ).innerText=
   Object.values(
    inventory
   ).reduce(
    (a,b)=>a+b,
    0
   );

 }


 /* =====================================================
    MOVIMIENTO
 ===================================================== */

 let previous=
  performance.now();


 let survivalTime=0;


 function update(){

  const now=
   performance.now();


  const dt=
   Math.min(
    .05,
    (now-previous)/1000
   );


  previous=
   now;


  /* cámara suave */

  yaw+=
   (targetYaw-yaw)*
   Math.min(
    1,
    dt*12
   );


  pitch+=
   (targetPitch-pitch)*
   Math.min(
    1,
    dt*12
   );


  /* movimiento */

  const forward=
   -joyY;


  const right=
   joyX;


  const amount=
   Math.min(
    1,
    Math.hypot(
     joyX,
     joyY
    )
   );


  let dx=
   Math.sin(yaw)*
   forward+
   Math.cos(yaw)*
   right;


  let dz=
   -Math.cos(yaw)*
   forward+
   Math.sin(yaw)*
   right;


  const speed=
   running
   ? 7
   : 4;


  dx*=
   speed*
   dt*
   amount;


  dz*=
   speed*
   dt*
   amount;


  const nx=
   player.x+
   dx;


  const nz=
   player.z+
   dz;


  if(
   !blocked(
    nx,
    player.z
   )
  ){

   player.x=
    nx;

  }


  if(
   !blocked(
    player.x,
    nz
   )
  ){

   player.z=
    nz;

  }


  /* cámara */

  camera.position.set(
   player.x,
   2.25,
   player.z
  );


  camera.rotation.order=
   "YXZ";


  camera.rotation.y=
   yaw;


  camera.rotation.x=
   pitch;


  /* interacción */

  nearDoor=null;
  nearPickup=null;


  let doorDistance=
   999;


  for(
   const d of doors
  ){

   const dist=
    Math.hypot(
     player.x-d.x,
     player.z-d.z
    );


   if(
    dist<3 &&
    dist<doorDistance
   ){

    doorDistance=
     dist;

    nearDoor=
     d;

   }

  }


  if(nearDoor){

   action.style.display=
    "block";


   action.innerText=
    nearDoor.open
    ? "CERRAR"
    : "ABRIR";


  }else{

   let pickDistance=
    999;


   for(
    const p of pickups
   ){

    const dist=
     Math.hypot(
      player.x-
       p.position.x,
      player.z-
       p.position.z
     );


    if(
     dist<2.5 &&
     dist<pickDistance
    ){

     pickDistance=
      dist;

     nearPickup=
      p;

    }

   }


   if(nearPickup){

    action.style.display=
     "block";


    action.innerText=
     "RECOGER";


   }else{

    action.style.display=
     "none";

   }

  }


  /* supervivencia */

  survivalTime+=
   dt;


  if(
   survivalTime>5
  ){

   survivalTime=0;


   player.hunger=
    Math.max(
     0,
     player.hunger-.7
    );


   player.thirst=
    Math.max(
     0,
     player.thirst-1
    );


   if(
    player.hunger<=0 ||
    player.thirst<=0
   ){

    player.health=
     Math.max(
      0,
      player.health-2
     );

   }


   if(
    player.health<=0
   ){

    player.health=100;
    player.hunger=100;
    player.thirst=100;


    player.x=0;
    player.z=0;

   }


   updateHUD();

  }


  /* objetos flotando */

  for(
   const p of pickups
  ){

   p.rotation.y+=
    dt;


   p.position.y=
    .3+
    Math.sin(
     now*.003+
     p.position.x
    )*.08;

  }


  renderer.render(
   scene,
   camera
  );


  requestAnimationFrame(
   update
  );

 }


 updateHUD();


 /* =====================================================
    ARRANQUE
 ===================================================== */

 document.getElementById(
  "loading"
 ).style.display=
  "none";


 update();

}


/* =========================================================
   ARRANCAR
========================================================= */

start();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
 "resize",
 ()=>{
  if(!window.THREE)
   return;

  const canvas=
   document.querySelector(
    "canvas"
   );

  if(!canvas)
   return;

  /*
   El renderer y cámara están
   dentro del cierre de initGame.
  */
 }
);

</script>
