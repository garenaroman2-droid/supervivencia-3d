<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Supervivencia 3D V11.1</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101814;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.48);
  padding:9px 12px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}

#version{
  font-weight:bold;
  color:#9cff9c;
}

#cameraBtn,
#mapBtn{
  position:fixed;
  right:12px;
  z-index:30;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.65);
  color:white;
  padding:12px 15px;
  font-weight:bold;
}

#cameraBtn{
  top:12px;
}

#mapBtn{
  top:60px;
}

#jump{
  position:fixed;
  right:25px;
  bottom:105px;
  width:70px;
  height:70px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.45);

  font-weight:bold;
  z-index:30;
}

#run{

}

#joystick{

  left:25px;
  bottom:30px;

  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.25);
  z-index:30;
}

#stick{
  position:absolute;
  left:35px;
  top:35px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(255,255,255,.30);
  border:2px solid rgba(255,255,255,.45);
}

#map{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(5,10,7,.96);
}

#mapCanvas{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(90vw,420px);
  height:min(90vw,420px);
  border:2px solid #aaa;
  background:#29472c;
}

#closeMap{
  position:absolute;
  top:15px;
  right:15px;
  z-index:5;
  padding:12px 16px;
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
  font-weight:bold;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
  z-index:10;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.75);
}

#crosshair:before{
  width:18px;
  height:2px;
  left:0;
  top:8px;
}

#crosshair:after{
  width:2px;
  height:18px;
  left:8px;
  top:0;
}
</style>

let firstPerson=true;

let velocityY=0;

let grounded=true;

let running=false;

let water=100;

let yaw=0;
let pitch=-.12;

let joystickX=0;
let joystickY=0;


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(){

  if(firstPerson){

    player.visible=false;

    camera.position.set(
      player.position.x,
      player.position.y+1.62,
      player.position.z
    );

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;

    camera.rotation.x=pitch;

  }else{

    player.visible=true;

    const distance=5.2;

    const cx=
      player.position.x-
      Math.sin(yaw)*distance;

    const cz=
      player.position.z-
      Math.cos(yaw)*distance;

    camera.position.lerp(
      new THREE.Vector3(
        cx,
        player.position.y+2.8,
        cz
      ),
      .18
    );

    camera.lookAt(
      player.position.x,
      player.position.y+1.0,
      player.position.z
    );
  }
}


/* =========================================================
   JOYSTICK
========================================================= */

const joy =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joyActive=false;

joy.addEventListener(
  "pointerdown",
  e=>{
    joyActive=true;
    joy.setPointerCapture(e.pointerId);
    moveJoy(e);
  }
);

joy.addEventListener(
  "pointermove",
  e=>{
    if(joyActive) moveJoy(e);
  }
);

joy.addEventListener(
  "pointerup",
  ()=>{
    joyActive=false;
    joystickX=0;
    joystickY=0;

    stick.style.left="35px";
    stick.style.top="35px";
  }
);

function moveJoy(e){

  const r=
    joy.getBoundingClientRect();

  let dx=
    e.clientX-
    (r.left+r.width/2);

  let dy=
    e.clientY-
    (r.top+r.height/2);

  const max=42;

  const dist=
    Math.sqrt(
      dx*dx+dy*dy
    );

  if(dist>max){

    dx=dx/dist*max;
    dy=dy/dist*max;
  }

  joystickX=dx/max;
  joystickY=dy/max;

  stick.style.left=
    (35+dx)+"px";

  stick.style.top=
    (35+dy)+"px";
}

/* =========================================================
   CÁMARA TÁCTIL
========================================================= */

let dragging=false;

let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{
    if(
      e.clientX<170 &&
      e.clientY>innerHeight-180
    ) return;

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!dragging) return;

    const dx=
      e.clientX-lastX;

    const dy=
      e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    yaw-=dx*.006;

    pitch-=dy*.004;

    pitch=
      Math.max(
        -1.2,
        Math.min(
          .9,
          pitch
        )
      );
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
    dragging=false;
  }
);

========================================================= */

document
.getElementById("cameraBtn")
.addEventListener(
  "click",
  ()=>{
    firstPerson=!firstPerson;

    document
      .getElementById("cameraBtn")
      .textContent=
      firstPerson
      ?"3ª PERSONA"
      :"1ª PERSONA";
  }
);


/* =========================================================
   MAPA
========================================================= */

const map=
  document.getElementById("map");

const mapCanvas=
  document.getElementById("mapCanvas");

const ctx=
  mapCanvas.getContext("2d");

document
.getElementById("mapBtn")
.addEventListener(
  "click",
  ()=>{
    map.style.display="block";
    drawMap();
  }
);

document
.getElementById("closeMap")
.addEventListener(
  "click",
  ()=>{
    map.style.display="none";
  }
);

function drawMap(){

  ctx.clearRect(
    0,
    0,
    600,
    600
  );

  ctx.fillStyle="#355b36";

  ctx.fillRect(
    0,
    0,
    600,
    600
  );


  /* agua */

  ctx.fillStyle="#4f9ab0";

  ctx.fillRect(
    340,
    170,
    90,
    65
  );

  ctx.fillRect(
    80,
    380,
    75,
    55
  );


  /* caminos */

  ctx.strokeStyle="#8c826f";

  ctx.lineWidth=10;

  ctx.beginPath();

  ctx.moveTo(
    300,
    0
  );

  ctx.lineTo(
    300,
    600
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    0,
    300
  );

  ctx.lineTo(
    600,
    300
  );

  ctx.stroke();


  /* casas */

  ctx.fillStyle="#b49c78";

  for(const p of housePositions){

    const mx=
      300+p[0]/5;

    const mz=
      300+p[1]/5;

    ctx.fillRect(
      mx-4,
      mz-4,
      8,
      8
    );
  }


  /* base */

  ctx.fillStyle="red";

  ctx.beginPath();

  ctx.arc(
    300,
    300+12/5,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* jugador */

  ctx.fillStyle="white";

  const px=
    300+player.position.x/5;

  const pz=
    300+player.position.z/5;

  ctx.beginPath();

  ctx.arc(
    px,
    pz,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   DISTANCIA / LUGAR
========================================================= */

function updatePlace(){

  const dist=
    Math.sqrt(
      player.position.x*
      player.position.x+
      player.position.z*
      player.position.z
    );

  let name="Explorando";

  if(dist<25){

    name="Base";
  }

  if(
    Math.abs(player.position.x-210)<45 &&
    Math.abs(player.position.z+120)<45
  ){
    name="Casa abandonada";
  }

  if(
    player.position.x<-400 &&
    player.position.z>400
  ){
    name="Zona rural";
  }

  document
    .getElementById("place")
    .textContent=
    name+
    " · "+
    Math.round(dist)+" m";
}


/* =========================================================
   MOVIMIENTO
========================================================= */

const clock=
  new THREE.Clock();

function update(){

  const dt=
    Math.min(
      clock.getDelta(),
      .035
    );

  let speed=
    running
    ?7.5
    :4.2;

  let forward=
    -joystickY;

  let side=
    joystickX;

  const move=
    new THREE.Vector3();

  move.z +=
    Math.cos(yaw)*
    forward;

  move.x +=
    Math.sin(yaw)*
    forward;

  move.x +=
    Math.cos(yaw)*
    side;

  move.z +=
    -Math.sin(yaw)*
    side;


  if(move.lengthSq()>0){

    move.normalize();

    player.position.x +=
      move.x*speed*dt;

    player.position.z +=
      move.z*speed*dt;


    if(!firstPerson){

      player.rotation.y=
        Math.atan2(
          move.x,
          move.z
        );
    }


    /* animación */

    const t=
      performance.now()*.012;

    legL.rotation.x=
      Math.sin(t)*.5;

    legR.rotation.x=
      -Math.sin(t)*.5;

    armL.rotation.x=
      -Math.sin(t)*.35;

    armR.rotation.x=
      Math.sin(t)*.35;

  }else{

    legL.rotation.x*=.8;
    legR.rotation.x*=.8;

    armL.rotation.x*=.8;
    armR.rotation.x*=.8;
  }


  /* gravedad */

  velocityY-=15*dt;

  player.position.y+=
    velocityY*dt;

  if(player.position.y<=0){

    player.position.y=0;

    velocityY=0;

    grounded=true;
  }


  /* límites */

  const limit=
    WORLD/2-20;

  player.position.x=
    Math.max(
      -limit,
      Math.min(
        limit,
        player.position.x
      )
    );

  player.position.z=
    Math.max(
      -limit,
      Math.min(
        limit,
        player.position.z
      )
    );


  /* supervivencia */

  food-=dt*.025;
  water-=dt*.035;

  if(food<0) food=0;
  if(water<0) water=0;

  if(food===0 || water===0){

    hp-=dt*.8;

    if(hp<0) hp=0;
  }


  document
    .getElementById("hp")
    .textContent=
    Math.round(hp);

  document
    .getElementById("food")
    .textContent=
    Math.round(food);

  document
    .getElementById("water")
    .textContent=
    Math.round(water);


  updatePlace();

  updateCamera();
}


/* =========================================================
   DÍA / NOCHE SIMPLE
========================================================= */

let dayTime=0;

function dayNight(){

  dayTime+=.0007;

  const sunValue=
    Math.sin(dayTime)*.5+.5;

  const sky=
    new THREE.Color();

  sky.setHSL(
    .55,
    .25,
    .35+
    sunValue*.22
  );

  scene.background=
    sky;

  scene.fog.color=
    sky;

  hemi.intensity=
    .65+
    sunValue*.75;

  sun.intensity=
    .45+
    sunValue*.75;
}


/* =========================================================
   LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  update();

  dayNight();

  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


animate();

</script>
