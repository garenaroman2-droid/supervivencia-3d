<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D V12.9</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#loading{position:fixed;inset:0;z-index:999;background:#101820;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:20px;text-align:center}
#loading small{margin-top:12px;color:#aaa;font-size:13px}
#hud{position:fixed;top:10px;left:10px;z-index:20;color:#fff;background:#000c;padding:10px;border-radius:13px;font-weight:bold;font-size:13px;width:175px}
.stat{margin:2px 0 6px}.bar{height:7px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%}
#hp{background:#e53935}#food{background:#ffb300}#water{background:#29b6f6}#stam{background:#66bb6a}
#cross{position:fixed;z-index:15;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:22px;pointer-events:none}
#joy{position:fixed;z-index:30;left:22px;bottom:25px;width:135px;height:135px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff35}
#knob{position:absolute;width:58px;height:58px;left:38px;top:38px;border-radius:50%;background:#ffffff55;border:2px solid #ffffff70}
#buttons{position:fixed;right:12px;bottom:18px;z-index:30;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.btn{color:#fff;background:#202020dd;border:1px solid #ffffff44;border-radius:13px;padding:11px 14px;font-weight:bold;font-size:13px}
#action{display:none;background:#8e24aa}#run{background:#1565c0}#invBtn{background:#37474f}#mapBtn{background:#455a64}
#place{position:fixed;z-index:15;bottom:7px;left:50%;transform:translateX(-50%);color:#fff;background:#0009;padding:6px 11px;border-radius:10px;font-size:12px}
#message{position:fixed;z-index:100;top:17%;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 17px;border-radius:12px;display:none}
#panel{display:none;position:fixed;inset:0;z-index:200;background:#000c;align-items:center;justify-content:center;padding:15px}
.box{width:min(520px,94vw);max-height:88vh;overflow:auto;background:#171717;color:#fff;border-radius:18px;padding:18px;border:1px solid #555}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#292929;padding:10px;border-radius:10px}.close{width:100%;margin-top:12px;background:#b71c1c}
#mapCanvas{width:100%;height:auto;background:#20251d;border:2px solid #555;border-radius:12px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-top:10px}.legend div{background:#292929;padding:7px;border-radius:7px}
</style>
</head>
<body>

<div id="loading">CARGANDO SUPERVIVENCIA 3D...<small id="loadText">Iniciando motor 3D</small></div>

<div id="hud">
<div class="stat">❤️ <span id="hpText">100</span><div class="bar"><div id="hp" class="fill"></div></div></div>
<div class="stat">🍗 <span id="foodText">100</span><div class="bar"><div id="food" class="fill"></div></div></div>
<div class="stat">💧 <span id="waterText">100</span><div class="bar"><div id="water" class="fill"></div></div></div>
<div class="stat">⚡ <span id="stamText">100</span><div class="bar"><div id="stam" class="fill"></div></div></div>
🎒 <span id="invText">0</span> objetos
</div>

<div id="cross">+</div>
<div id="joy"><div id="knob"></div></div>

<div id="buttons">
<button class="btn" id="action">ABRIR</button>
<button class="btn" id="run">🏃 CORRER</button>
<button class="btn" id="invBtn">🎒 INVENTARIO</button>
<button class="btn" id="mapBtn">🗺️ MAPA</button>
</div>

<div id="place">V12.9</div>
<div id="message"></div>

<div id="panel">
<div class="box">
<h2 id="panelTitle">🎒 Inventario</h2>
<div id="panelContent"></div>
<button class="btn close" id="closePanel">CERRAR</button>
</div>
</div>

<script src="./three.min.js"></script>
<script>
let THREE=window.THREE;

function start(){
 const t=document.getElementById("loadText");
 try{
  t.innerText="Cargando motor 3D...";
  if(!window.THREE)throw Error("Three.js no cargó");
  THREE=window.THREE;
  t.innerText="Creando mundo...";
  setTimeout(initGame,100);
 }catch(e){t.innerText="No se pudo iniciar el motor 3D.";console.error(e)}
}

function initGame(){

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x78a7c4);
scene.fog=new THREE.Fog(0x78a7c4,300,3000);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,4000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x43502f,1.7));
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(300,700,200);
scene.add(sun);

const M={
 grass:new THREE.MeshLambertMaterial({color:0x557f3b}),
 road:new THREE.MeshLambertMaterial({color:0x383838}),
 road2:new THREE.MeshLambertMaterial({color:0x242424}),
 dirt:new THREE.MeshLambertMaterial({color:0x795548}),
 mud:new THREE.MeshLambertMaterial({color:0x49372b}),
 wall:new THREE.MeshLambertMaterial({color:0x93877a}),
 roof:new THREE.MeshLambertMaterial({color:0x493d36}),
 wood:new THREE.MeshLambertMaterial({color:0x754b28}),
 darkWood:new THREE.MeshLambertMaterial({color:0x432919}),
 trunk:new THREE.MeshLambertMaterial({color:0x624126}),
 leaf:new THREE.MeshLambertMaterial({color:0x315d2d}),
 stone:new THREE.MeshLambertMaterial({color:0x707070}),
 metal:new THREE.MeshLambertMaterial({color:0x4f5558}),
 food:new THREE.MeshLambertMaterial({color:0xa52e25}),
 water:new THREE.MeshLambertMaterial({color:0x237da0}),
 glass:new THREE.MeshLambertMaterial({color:0x4c9fc0}),
 mountain:new THREE.MeshLambertMaterial({color:0x566052}),
 white:new THREE.MeshLambertMaterial({color:0xd8d0bd}),
 yellow:new THREE.MeshLambertMaterial({color:0xb99b32})
};

const terrain=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),M.grass);
terrain.rotation.x=-Math.PI/2;
scene.add(terrain);

const player={x:0,y:0,z:0,health:100,hunger:100,thirst:100,stamina:100};

let inventory={
 wood:0,stone:0,metal:0,food:2,water:2,cloth:0,medkit:0,axe:0,pickaxe:0
};

try{
 const s=JSON.parse(localStorage.getItem("survival129"));
 if(s&&s.inventory)inventory=s.inventory;
}catch(e){}

function save(){localStorage.setItem("survival129",JSON.stringify({inventory}));}

const colliders=[];
function collider(x,z,w,d){colliders.push({x,z,w,d})}
function blocked(x,z){
 const r=.38;
 for(const c of colliders)
  if(x+r>c.x-c.w/2&&x-r<c.x+c.w/2&&z+r>c.z-c.d/2&&z-r<c.z+c.d/2)return true;
 return false;
}
function cube(w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);return m;
}
function flat(w,d,mat,x,z,y=.04){
 const m=cube(w,.08,d,mat,x,y,z);scene.add(m);return m;
}

/* CARRETERAS */
flat(42,5400,M.road,0,0,.03);
flat(36,5400,M.road,-900,0,.04);
flat(5400,38,M.road,0,500,.05);
flat(5400,30,M.dirt,0,-700,.055);
flat(2600,24,M.dirt,0,1300,.06);
flat(1800,20,M.mud,700,-700,.065);

/* calles rotas / pozos */
for(let i=0;i<28;i++){
 let x=(Math.random()-.5)*2600,z=500+(Math.random()-.5)*1000;
 const p=flat(2+Math.random()*4,4+Math.random()*7,M.road2,x,z,.09);
 p.rotation.y=Math.random()*3;
}

/* barro */
for(let i=0;i<35;i++){
 const x=(Math.random()-.5)*2600,z=-700+(Math.random()-.5)*500;
 const p=flat(5+Math.random()*12,3+Math.random()*8,M.mud,x,z,.09);
 p.rotation.y=Math.random()*3.14;
}

/* MONTAÑAS */
for(let i=0;i<30;i++){
 const a=Math.random()*Math.PI*2;
 const r=2200+Math.random()*600;
 const h=80+Math.random()*180;
 const s=80+Math.random()*150;
 const m=new THREE.Mesh(new THREE.ConeGeometry(s,h,8),M.mountain);
 m.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);
 scene.add(m);
}

/* ÁRBOLES */
function tree(x,z,s=1){
 const g=new THREE.Group();
 g.add(cube(.5*s,3*s,.5*s,M.trunk,0,1.5*s,0));
 const l=new THREE.Mesh(new THREE.ConeGeometry(1.8*s,4*s,7),M.leaf);
 l.position.y=4*s;g.add(l);g.position.set(x,0,z);scene.add(g);
 collider(x,z,.8*s,.8*s);
}
for(let i=0;i<250;i++){
 let x=(Math.random()-.5)*5000,z=(Math.random()-.5)*5000;
 if(Math.abs(x)<500&&Math.abs(z)<500)continue;
 tree(x,z,.65+Math.random()*.8);
}

/* EDIFICIOS */
const doors=[];

function building(x,z,w,d,floors=1,type="house"){
 const h=3*floors;
 const mat=type==="hospital"?M.white:type==="factory"?M.metal:M.wall;

 for(let f=0;f<floors;f++){
  scene.add(cube(w,.15,d,M.wood,x,f*3,z));
 }

 scene.add(cube(w,h,.35,mat,x,h/2,z+d/2));
 scene.add(cube(.35,h,d,mat,x-w/2,h/2,z));
 scene.add(cube(.35,h,d,mat,x+w/2,h/2,z));

 const side=(w-4)/2;
 scene.add(cube(side,h,.35,mat,x-(side+4)/2,h/2,z-d/2));
 scene.add(cube(side,h,.35,mat,x+(side+4)/2,h/2,z-d/2));

 collider(x,z+d/2,w,.35);
 collider(x-w/2,z,.35,d);
 collider(x+w/2,z,.35,d);
 collider(x-(side+4)/2,z-d/2,side,.35);
 collider(x+(side+4)/2,z-d/2,side,.35);

 const door=cube(3,2.8,.2,M.darkWood,x,1.4,z-d/2-.1);
 scene.add(door);
 doors.push({mesh:door,x,z:z-d/2,open:false});

 for(let f=0;f<floors;f++){
  const y=f*3+1.6;
  const a=cube(2,1.4,.08,M.glass,x-w/2-.05,y,z);
  const b=cube(2,1.4,.08,M.glass,x+w/2+.05,y,z);
  scene.add(a,b);
  scene.add(cube(.12,1.5,.12,M.darkWood,x-w/2-.1,y,z));
  scene.add(cube(.12,1.5,.12,M.darkWood,x+w/2+.1,y,z));
 }
 scene.add(cube(w+.5,.4,d+.5,M.roof,x,floors*3,z));
}

/* CASAS GRANDES */
building(300,-300,40,30,1);
building(-450,-650,48,36,2);
building(700,-550,55,40,2);
building(-900,500,62,44,3);
building(1000,700,72,50,3);
building(-1400,-900,80,55,3);
building(1500,1100,90,60,3);
building(-1750,850,65,45,2);
building(1250,-1200,75,50,2);

/* MANSIONES */
building(1900,-300,120,80,3);
building(-2100,-500,130,90,3);

/* edificios públicos */
building(-650,700,100,70,2,"hospital");
building(500,950,80,60,2,"police");
building(-1200,1300,110,75,2,"factory");
building(1400,450,95,65,2,"factory");
building(-300,-1450,100,65,1,"hospital");

/* ESTACIÓN DE SERVICIO */
const gas=flat(85,65,M.road2,750,1250,.08);
scene.add(cube(75,8,35,M.white,750,4,1250));
scene.add(cube(15,3,55,M.yellow,720,8,1250));
scene.add(cube(15,3,55,M.yellow,780,8,1250));
collider(750,1250,75,35);

/* GRANJA */
for(let i=0;i<10;i++)flat(25,2,M.dirt,-1800+i*28,1450,.08);
building(-1750,1650,70,45,1);

/* CAMPAMENTO */
for(let i=0;i<8;i++){
 const a=i*Math.PI/4;
 const f=cube(8,3,8,M.wood,-900+Math.cos(a)*60,-.0+0,1450+Math.sin(a)*60);
 f.position.y=1.5;scene.add(f);
}

/* LAGO */
const lake=new THREE.Mesh(
 new THREE.CircleGeometry(170,40),
 new THREE.MeshLambertMaterial({color:0x2b83a5})
);
lake.rotation.x=-Math.PI/2;
lake.position.set(1600,.09,1650);
scene.add(lake);

/* PICKUPS */
const pickups=[];
function pickup(type,x,z){
 let mat=M.wood;
 if(type==="stone")mat=M.stone;
 if(type==="metal")mat=M.metal;
 if(type==="food")mat=M.food;
 if(type==="water")mat=M.water;
 if(type==="cloth")mat=M.white;
 const o=cube(.5,.5,.5,mat,x,.3,z);
 o.userData.type=type;scene.add(o);pickups.push(o);
}
const types=["wood","wood","stone","metal","food","water","cloth"];
for(let i=0;i<75;i++)
 pickup(types[Math.floor(Math.random()*types.length)],(Math.random()-.5)*3800,(Math.random()-.5)*3800);

/* UBICACIONES */
const locations=[
 ["BASE",0,0],["PUEBLO",300,-300],["HOSPITAL",-650,700],
 ["POLICÍA",500,950],["SUPERMERCADO",-900,500],
 ["FÁBRICA",-1200,1300],["ESTACIÓN",750,1250],
 ["GRANJA",-1750,1650],["CAMPAMENTO",-900,1450],
 ["LAGO",1600,1650],["MANSIÓN",1900,-300]
];

function nearestLocation(){
 let best=["CAMPO",99999];
 for(const l of locations){
  const d=Math.hypot(player.x-l[1],player.z-l[2]);
  if(d<best[1])best=[l[0],d];
 }
 return best[1]<250?best[0]:"CAMPO";
}

/* JOYSTICK */
const joy=document.getElementById("joy"),knob=document.getElementById("knob");
let joyX=0,joyY=0,joyOn=false;

function moveJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=47,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joyX=dx/max;
 joyY=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener("pointerdown",e=>{
 joyOn=true;joy.setPointerCapture(e.pointerId);moveJoy(e);
});
joy.addEventListener("pointermove",e=>{if(joyOn)moveJoy(e)});
function releaseJoy(){joyOn=false;joyX=0;joyY=0;knob.style.transform="translate(0,0)"}
joy.addEventListener("pointerup",releaseJoy);
joy.addEventListener("pointercancel",releaseJoy);

/* CÁMARA: CONSERVADA */
let yaw=0,pitch=-.08,targetYaw=0,targetPitch=-.08;
let looking=false,lastX=0,lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX<180||e.clientY>innerHeight-180)return;
 looking=true;lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(!looking)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 lastX=e.clientX;lastY=e.clientY;
 targetYaw-=dx*.004;
 targetPitch-=dy*.003;
 targetPitch=Math.max(-1.1,Math.min(1,targetPitch));
});
renderer.domElement.addEventListener("pointerup",()=>looking=false);
renderer.domElement.addEventListener("pointercancel",()=>looking=false);

/* CORRER */
let running=false;
const runBtn=document.getElementById("run");
runBtn.addEventListener("pointerdown",()=>{running=true;runBtn.innerText="🏃 CORRIENDO"});
["pointerup","pointercancel","pointerleave"].forEach(x=>runBtn.addEventListener(x,()=>{running=false;runBtn.innerText="🏃 CORRER"}));

/* ACCIONES */
const action=document.getElementById("action");
let nearDoor=null,nearPickup=null;

action.onclick=()=>{
 if(nearDoor){
  nearDoor.open=!nearDoor.open;
  if(nearDoor.open){
   nearDoor.mesh.rotation.y=-Math.PI/2;
   nearDoor.mesh.position.x=nearDoor.x-1.35;
  }else{
   nearDoor.mesh.rotation.y=0;
   nearDoor.mesh.position.x=nearDoor.x;
  }
 }else if(nearPickup){
  const type=nearPickup.userData.type;
  inventory[type]=(inventory[type]||0)+1;
  scene.remove(nearPickup);
  const i=pickups.indexOf(nearPickup);
  if(i>=0)pickups.splice(i,1);
  nearPickup=null;save();updateHUD();
 }
};

/* INVENTARIO */
const panel=document.getElementById("panel"),content=document.getElementById("panelContent");

function openInventory(){
 const labels={wood:"🪵 Madera",stone:"🪨 Piedra",metal:"🔩 Metal",food:"🍖 Comida",water:"💧 Agua",cloth:"🧵 Tela",medkit:"🩹 Botiquín",axe:"🪓 Hacha",pickaxe:"⛏️ Pico"};
 let h='<div class="grid">';
 for(const k in inventory)h+=`<div class="item">${labels[k]}<br><b>${inventory[k]}</b></div>`;
 h+=`</div><br>
 <button class="btn" id="eat">🍖 COMER</button>
 <button class="btn" id="drink">💧 BEBER</button>
 <h3>CREAR</h3>
 <div class="item">🪓 Hacha<br>5 madera + 2 piedra<br><button class="btn" id="axe">CREAR</button></div><br>
 <div class="item">⛏️ Pico<br>4 madera + 5 piedra<br><button class="btn" id="pick">CREAR</button></div><br>
 <div class="item">🩹 Botiquín<br>3 tela + 1 metal<br><button class="btn" id="med">CREAR</button></div>`;
 content.innerHTML=h;panel.style.display="flex";

document.getElementById("eat").onclick=()=>{
 if(inventory.food>0){inventory.food--;player.hunger=Math.min(100,player.hunger+30);save();updateHUD();openInventory()}
};
document.getElementById("drink").onclick=()=>{
 if(inventory.water>0){inventory.water--;player.thirst=Math.min(100,player.thirst+35);save();updateHUD();openInventory()}
};
document.getElementById("axe").onclick=()=>{
 if(inventory.wood>=5&&inventory.stone>=2){inventory.wood-=5;inventory.stone-=2;inventory.axe++;save();updateHUD();openInventory()}
};
document.getElementById("pick").onclick=()=>{
 if(inventory.wood>=4&&inventory.stone>=5){inventory.wood-=4;inventory.stone-=5;inventory.pickaxe++;save();updateHUD();openInventory()}
};
document.getElementById("med").onclick=()=>{
 if(inventory.cloth>=3&&inventory.metal>=1){inventory.cloth-=3;inventory.metal--;inventory.medkit++;save();updateHUD();openInventory()}
};
}

document.getElementById("invBtn").onclick=openInventory;
document.getElementById("closePanel").onclick=()=>panel.style.display="none";

/* MAPA */
function openMap(){
 document.getElementById("panelTitle").innerText="🗺️ MAPA DEL MUNDO";
 content.innerHTML=`<canvas id="mapCanvas" width="700" height="700"></canvas>
 <div class="legend">
 <div>🔵 Tu posición</div><div>🏠 Casas</div><div>🏥 Hospital</div><div>🚓 Policía</div>
 <div>🏭 Fábrica</div><div>⛽ Estación</div><div>🌾 Granja</div><div>🏕️ Campamento</div>
 </div>`;
 panel.style.display="flex";
 drawMap();
}
document.getElementById("mapBtn").onclick=openMap;

function drawMap(){
 const c=document.getElementById("mapCanvas");if(!c)return;
 const x=c.getContext("2d"),W=c.width;
 x.fillStyle="#526844";x.fillRect(0,0,W,W);
 const scale=.105,center=350;
 function pos(wx,wz){return [center+wx*scale,center+wz*scale]}
 x.strokeStyle="#444";x.lineWidth=9;
 x.beginPath();let a=pos(0,-3000),b=pos(0,3000);x.moveTo(...a);x.lineTo(...b);x.stroke();
 x.strokeStyle="#795548";x.lineWidth=6;
 a=pos(-2700,-700);b=pos(2700,-700);x.moveTo(...a);x.lineTo(...b);x.stroke();
 x.strokeStyle="#333";x.lineWidth=5;
 a=pos(-3000,500);b=pos(3000,500);x.moveTo(...a);x.lineTo(...b);x.stroke();

 for(const l of locations){
  const p=pos(l[1],l[2]);
  x.fillStyle=l[0]==="HOSPITAL"?"#eee":l[0]==="LAGO"?"#2385a5":"#b98b55";
  x.beginPath();x.arc(p[0],p[1],7,0,Math.PI*2);x.fill();
  x.fillStyle="#fff";x.font="13px Arial";x.fillText(l[0],p[0]+9,p[1]+4);
 }
 const p=pos(player.x,player.z);
 x.fillStyle="#29b6f6";x.beginPath();x.arc(p[0],p[1],10,0,Math.PI*2);x.fill();
 x.strokeStyle="#fff";x.stroke();
}

/* HUD */
function updateHUD(){
 document.getElementById("hpText").innerText=Math.round(player.health);
 document.getElementById("foodText").innerText=Math.round(player.hunger);
 document.getElementById("waterText").innerText=Math.round(player.thirst);
 document.getElementById("stamText").innerText=Math.round(player.stamina);
 document.getElementById("hp").style.width=player.health+"%";
 document.getElementById("food").style.width=player.hunger+"%";
 document.getElementById("water").style.width=player.thirst+"%";
 document.getElementById("stam").style.width=player.stamina+"%";
 document.getElementById("invText").innerText=Object.values(inventory).reduce((a,b)=>a+b,0);
 document.getElementById("place").innerText=nearestLocation()+" • V12.9";
}

/* MOVIMIENTO */
let previous=performance.now(),survivalTime=0;

function update(){
 const now=performance.now(),dt=Math.min(.05,(now-previous)/1000);
 previous=now;

 yaw+=(targetYaw-yaw)*Math.min(1,dt*12);
 pitch+=(targetPitch-pitch)*Math.min(1,dt*12);

 /*
  CORRECCIÓN:
  arriba = adelante de cámara
  abajo = atrás
  izquierda = izquierda
  derecha = derecha
 */
 const forward=-joyY;
 const right=joyX;
 const amount=Math.min(1,Math.hypot(joyX,joyY));

 let dx=Math.sin(yaw)*forward+Math.cos(yaw)*right;
 let dz=-Math.cos(yaw)*forward+Math.sin(yaw)*right;

 let speed=running&&player.stamina>1?7:4;
 if(running&&amount>0)player.stamina=Math.max(0,player.stamina-dt*18);
 else player.stamina=Math.min(100,player.stamina+dt*12);

 dx*=speed*dt*amount;
 dz*=speed*dt*amount;

 const nx=player.x+dx,nz=player.z+dz;
 if(!blocked(nx,player.z))player.x=nx;
 if(!blocked(player.x,nz))player.z=nz;

 camera.position.set(player.x,2.25,player.z);
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 nearDoor=null;nearPickup=null;
 let dd=999;

 for(const d of doors){
  const dist=Math.hypot(player.x-d.x,player.z-d.z);
  if(dist<3&&dist<dd){dd=dist;nearDoor=d}
 }

 if(nearDoor){
  action.style.display="block";
  action.innerText=nearDoor.open?"CERRAR":"ABRIR";
 }else{
  let pd=999;
  for(const p of pickups){
   const dist=Math.hypot(player.x-p.position.x,player.z-p.position.z);
   if(dist<2.5&&dist<pd){pd=dist;nearPickup=p}
  }
  if(nearPickup){
   action.style.display="block";
   action.innerText="RECOGER";
  }else action.style.display="none";
 }

 survivalTime+=dt;
 if(survivalTime>5){
  survivalTime=0;
  player.hunger=Math.max(0,player.hunger-.7);
  player.thirst=Math.max(0,player.thirst-1);
  if(player.hunger<=0||player.thirst<=0)player.health=Math.max(0,player.health-2);
  if(player.health<=0){
   player.health=100;player.hunger=100;player.thirst=100;
   player.x=0;player.z=0;
   showMessage("Te quedaste sin fuerzas. Volviste a la base.");
  }
  updateHUD();
 }

 for(const p of pickups){
  p.rotation.y+=dt;
  p.position.y=.3+Math.sin(now*.003+p.position.x)*.08;
 }

 if(document.getElementById("mapCanvas"))drawMap();
 renderer.render(scene,camera);
 requestAnimationFrame(update);
}

function showMessage(t){
 const m=document.getElementById("message");
 m.innerText=t;m.style.display="block";
 setTimeout(()=>m.style.display="none",1800);
}

updateHUD();
document.getElementById("loading").style.display="none";
update();
}

start();

window.addEventListener("resize",()=>{
 const c=document.querySelector("canvas");
 if(c&&window.THREE){
  c.width=innerWidth;
  c.height=innerHeight;
 }
});
</script>
</body>
</html>
