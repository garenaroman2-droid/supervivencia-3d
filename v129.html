<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D V12.9</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#111;font-family:Arial,sans-serif;
 touch-action:none;
}
canvas{display:block}

#loading{
 position:fixed;inset:0;z-index:999;
 background:#101820;color:white;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;font-size:20px;text-align:center;
}
#loading small{margin-top:12px;color:#aaa;font-size:13px}

#hud{
 position:fixed;top:10px;left:10px;z-index:20;
 color:white;background:#000c;padding:9px 12px;
 border-radius:12px;font-weight:bold;font-size:13px;
 min-width:175px;
}
.bar{
 height:7px;background:#333;border-radius:6px;
 overflow:hidden;margin:3px 0 5px;
}
.fill{height:100%;width:100%}
#hp{background:#e53935}
#food{background:#ffb300}
#water{background:#29b6f6}
#stamina{background:#76ff03}
#temp{background:#42a5f5}
#sleep{background:#ab47bc}

#worldInfo{
 position:fixed;right:10px;top:10px;z-index:20;
 color:white;background:#000b;padding:8px 10px;
 border-radius:12px;text-align:right;font-size:12px;
 min-width:120px;
}

#cross{
 position:fixed;z-index:15;left:50%;top:50%;
 transform:translate(-50%,-50%);
 color:white;font-size:22px;pointer-events:none;
}

#joy{
 position:fixed;z-index:30;left:22px;bottom:25px;
 width:135px;height:135px;border-radius:50%;
 background:#ffffff18;border:2px solid #ffffff35;
}
#knob{
 position:absolute;width:58px;height:58px;
 left:38px;top:38px;border-radius:50%;
 background:#ffffff55;border:2px solid #ffffff70;
}

#buttons{
 position:fixed;right:12px;bottom:18px;z-index:30;
 display:flex;flex-direction:column;gap:7px;
 align-items:flex-end;
}
.btn{
 color:white;background:#202020dd;
 border:1px solid #ffffff44;border-radius:13px;
 padding:11px 14px;font-weight:bold;font-size:13px;
}
#action{display:none;background:#8e24aa}
#run{background:#1565c0}
#invBtn{background:#37474f}
#mapBtn{background:#455a64}
#lightBtn{background:#5d4037}

#panel{
 display:none;position:fixed;inset:0;z-index:200;
 background:#000d;align-items:center;justify-content:center;
 padding:15px;
}
.box{
 width:min(560px,94vw);max-height:88vh;overflow:auto;
 background:#171717;color:white;border-radius:18px;
 padding:18px;border:1px solid #555;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#292929;padding:10px;border-radius:10px}
.close{width:100%;margin-top:12px;background:#b71c1c}

#mapCanvas{
 width:100%;
 max-width:500px;
 display:block;
 margin:auto;
 background:#273127;
 border:2px solid #555;
 border-radius:12px;
}

#message{
 position:fixed;z-index:100;top:17%;left:50%;
 transform:translateX(-50%);background:#000d;color:white;
 padding:10px 17px;border-radius:12px;display:none;
 white-space:nowrap;
}

#place{
 position:fixed;z-index:15;bottom:7px;left:50%;
 transform:translateX(-50%);color:white;background:#0009;
 padding:6px 11px;border-radius:10px;font-size:12px;
}

#danger{
 position:fixed;z-index:16;left:50%;top:58%;
 transform:translateX(-50%);
 color:#ff5252;font-weight:bold;
 font-size:14px;display:none;
 text-shadow:0 1px 3px #000;
}
</style>
</head>

<body>

<div id="loading">
 CARGANDO SUPERVIVENCIA 3D V12.9...
 <small id="loadText">Construyendo ciudad abandonada...</small>
</div>

<div id="hud">

 🌡️ <span id="tempText">22</span>°C

 <div id="knob"></div>

<div id="buttons">

 <button class="btn" id="run">🏃 CORRER</button>
 <button class="btn" id="lightBtn">🔦 LINTERNA</button>
 <button class="btn" id="mapBtn">🗺️ MAPA</button>
 <button class="btn" id="invBtn">🎒 INVENTARIO</button>
</div>

<div id="place">V12.9</div>
<div id="message"></div>

<div id="panel">
 <div class="box">
  <h2 id="panelTitle">🎒 Supervivencia</h2>

<script src="./three.min.js"></script>

<script>

let THREE=window.THREE;

function start(){

 const text=document.getElementById("loadText");

 try{

  if(!window.THREE)
   throw new Error("Three.js no cargó");

  text.innerText="Construyendo ciudad...";
  setTimeout(initGame,100);

 }catch(e){

  text.innerText="Error al iniciar el motor 3D.";
  console.error(e);

 }

}

function initGame(){

 /* =====================================================
    ESCENA Y CÁMARA
 ===================================================== */

 const scene=new THREE.Scene();

 scene.background=new THREE.Color(0x71899a);

 scene.fog=new THREE.Fog(
  0x71899a,
  260,
  3000
 );

 const camera=new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .1,
  4000
 );

 const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setSize(innerWidth,innerHeight);

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
 );

 document.body.appendChild(renderer.domElement);


 /* =====================================================
    LUCES
 ===================================================== */

 const hemi=new THREE.HemisphereLight(
  0xffffff,
  0x27301f,
  1.5
 );

 scene.add(hemi);

 const sun=new THREE.DirectionalLight(
  0xffffff,
  1.4
 );

 sun.position.set(400,700,250);
 scene.add(sun);


 /* =====================================================
    MATERIALES
 ===================================================== */

 const grass=new THREE.MeshLambertMaterial({
  color:0x4d713b
 });

 const grass2=new THREE.MeshLambertMaterial({
  color:0x638245
 });

 const roadMat=new THREE.MeshLambertMaterial({
  color:0x303030
 });

 const brokenRoadMat=new THREE.MeshLambertMaterial({
  color:0x252525
 });

 const dirtMat=new THREE.MeshLambertMaterial({
  color:0x765b3b
 });

 const mudMat=new THREE.MeshLambertMaterial({
  color:0x443126
 });

 const roadLine=new THREE.MeshLambertMaterial({
  color:0xb5a24d
 });

 const wallMat=new THREE.MeshLambertMaterial({
  color:0x81786f
 });

 const wallLight=new THREE.MeshLambertMaterial({
  color:0xa79d91
 });

 const roofMat=new THREE.MeshLambertMaterial({
  color:0x413934
 });

 const roofRed=new THREE.MeshLambertMaterial({
  color:0x65342c
 });

 const woodMat=new THREE.MeshLambertMaterial({
  color:0x754b28
 });

 const darkWood=new THREE.MeshLambertMaterial({
  color:0x432919
 });

 const trunkMat=new THREE.MeshLambertMaterial({
  color:0x624126
 });

 const leafMat=new THREE.MeshLambertMaterial({
  color:0x315d2d
 });

 const leaf2=new THREE.MeshLambertMaterial({
  color:0x427437
 });

 const stoneMat=new THREE.MeshLambertMaterial({
  color:0x707070
 });

 const metalMat=new THREE.MeshLambertMaterial({
  color:0x4f5558
 });

 const foodMat=new THREE.MeshLambertMaterial({
  color:0xa52e25
 });

 const waterMat=new THREE.MeshLambertMaterial({
  color:0x237da0,
  transparent:true,
  opacity:.72
 });

 const glassMat=new THREE.MeshLambertMaterial({
  color:0x63b7d0,
  transparent:true,
  opacity:.38
 });

 const sandMat=new THREE.MeshLambertMaterial({
  color:0xb7a16a
 });

 const concreteMat=new THREE.MeshLambertMaterial({
  color:0x777777
 });

 const whiteMat=new THREE.MeshLambertMaterial({
  color:0xd8d8d8
 });

 const blackMat=new THREE.MeshLambertMaterial({
  color:0x181818
 });

 const redMat=new THREE.MeshLambertMaterial({
  color:0x9b2424
 });

 const yellowMat=new THREE.MeshLambertMaterial({
  color:0xd5a921
 });

 const blueMat=new THREE.MeshLambertMaterial({
  color:0x285d91
 });

 const bloodMat=new THREE.MeshLambertMaterial({
  color:0x651515
 });


 /* =====================================================
    TERRENO
 ===================================================== */

 const terrain=new THREE.Mesh(
  new THREE.PlaneGeometry(6000,6000),
  grass
 );

 terrain.rotation.x=-Math.PI/2;
 scene.add(terrain);


 /* =====================================================
    DATOS DEL MUNDO
 ===================================================== */

 const colliders=[];
 const doors=[];
 const pickups=[];
 const places=[];
 const zombies=[];
 const buildings=[];
 const vehicles=[];
 const brokenAreas=[];

 function collider(x,z,w,d){
  colliders.push({x,z,w,d});
 }

 function blocked(x,z){

  const r=.38;

  for(const c of colliders){

   if(
    x+r>c.x-c.w/2 &&
    x-r<c.x+c.w/2 &&
    z+r>c.z-c.d/2 &&
    z-r<c.z+c.d/2
   ){
    return true;
   }

  }

  return false;
 }

 function cube(w,h,d,mat,x,y,z){

  const m=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   mat
  );

  m.position.set(x,y,z);

  return m;
 }

 function label(text,x,z){

  places.push({
   name:text,
   x,
   z
  });

 }


 /* =====================================================
    CAMINOS
 ===================================================== */

 function road(x,z,w,d,broken=false){

  const r=cube(
   w,.12,d,
   broken?brokenRoadMat:roadMat,
   x,.04,z
  );

  scene.add(r);

  if(w>d){

   for(
    let p=-w/2+10;
    p<w/2-10;
    p+=22
   ){

    const line=cube(
     8,.04,.35,
     roadLine,
     x+p,.11,z
    );

    scene.add(line);

   }

  }else{

   for(
    let p=-d/2+10;
    p<d/2-10;
    p+=22
   ){

    const line=cube(
     .35,.04,8,
     roadLine,
     x,.11,z+p
    );

    scene.add(line);

   }

  }

 }

 /* ciudad principal */

 road(0,0,38,5200);
 road(0,-850,2200,25);
 road(0,850,2200,25);
 road(-1000,0,25,1700);
 road(1000,0,25,1700);
 road(0,-1600,1200,22);
 road(-1700,0,22,1000);

 /* calles nuevas */

 road(-450,-400,900,20,true);
 road(450,400,900,20,true);
 road(450,-400,20,800,true);
 road(-450,400,20,800,true);

 /* caminos rurales */

 const dirtRoads=[
  [0,1450,1200,26],
  [1350,1000,26,900],
  [-1400,-1000,26,900],
  [-1450,850,900,26],
  [1550,-900,1000,28]
 ];

 for(const r of dirtRoads){

  const dr=cube(
   r[2],.09,r[3],
   dirtMat,
   r[0],.045,r[1]
  );

  scene.add(dr);

 }


 /* =====================================================
    POZOS Y CALLES ROTAS
 ===================================================== */

 function pothole(x,z,s=1){

  const p=new THREE.Mesh(
   new THREE.CylinderGeometry(
    2*s,
    2.5*s,
    .08,
    12
   ),
   blackMat
  );

  p.position.set(x,.1,z);
  scene.add(p);

  brokenAreas.push({
   x,z,r:2.5*s
  });

 }

 for(let i=0;i<45;i++){

  pothole(
   (Math.random()-.5)*1900,
   (Math.random()-.5)*1900,
   .5+Math.random()*1.3
  );

 }


 /* =====================================================
    BARRO
 ===================================================== */

 function mud(x,z,w,d){

  const m=cube(
   w,.05,d,
   mudMat,
   x,.035,z
  );

  scene.add(m);

 }

 for(let i=0;i<35;i++){

  mud(
   (Math.random()-.5)*3000,
   (Math.random()-.5)*3000,
   8+Math.random()*25,
   4+Math.random()*12
  );

 }


 /* =====================================================
    PUENTE
 ===================================================== */

 function bridge(x,z,w,d){

  const b=cube(
   w,.45,d,
   concreteMat,
   x,.22,z
  );

  scene.add(b);

  const rail1=cube(
   w,.8,.18,
   metalMat,
   x,.75,z-d/2
  );

  const rail2=cube(
   w,.8,.18,
   metalMat,
   x,.75,z+d/2
  );

  scene.add(rail1,rail2);

 }

 bridge(0,-1500,150,35);


 /* =====================================================
    ÁRBOLES
 ===================================================== */

 function tree(x,z,scale=1){

  const g=new THREE.Group();

  const trunk=cube(
   .5*scale,
   3*scale,
   .5*scale,
   trunkMat,
   0,
   1.5*scale,
   0
  );

  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(
    1.8*scale,
    4.2*scale,
    7
   ),
   Math.random()>.5?leafMat:leaf2
  );

  leaves.position.y=4*scale;

  g.add(trunk,leaves);

  g.position.set(x,0,z);

  scene.add(g);

  collider(
   x,
   z,
   .8*scale,
   .8*scale
  );

 }

 for(let i=0;i<230;i++){

  const x=(Math.random()-.5)*5000;
  const z=(Math.random()-.5)*5000;

  if(
   Math.abs(x)<300 ||
   Math.abs(z)<260
  ) continue;

  tree(
   x,
   z,
   .65+Math.random()*.8
  );

 }


 /* =====================================================
    MONTAÑAS
 ===================================================== */

 function mountain(x,z,r,h){

  const m=new THREE.Mesh(
   new THREE.ConeGeometry(
    r,
    h,
    8
   ),
   stoneMat
  );

  m.position.set(
   x,
   h/2,
   z
  );

  scene.add(m);

 }

 mountain(-2700,-2300,500,500);
 mountain(-2200,-2700,400,420);
 mountain(2300,-2300,600,600);
 mountain(2700,2200,500,500);
 mountain(-2600,2200,650,650);
 mountain(2500,1000,350,350);


 /* =====================================================
    COLINAS
 ===================================================== */

 function hill(x,z,s){

  const h=new THREE.Mesh(
   new THREE.SphereGeometry(
    s,
    16,
    10
   ),
   grass2
  );

  h.scale.y=.35;
  h.position.set(
   x,
   s*.15,
   z
  );

  scene.add(h);

 }

 for(let i=0;i<20;i++){

  hill(
   (Math.random()-.5)*5000,
   (Math.random()-.5)*5000,
   80+Math.random()*180
  );

 }


 /* =====================================================
    CASAS
 ===================================================== */

 function createHouse(
  x,z,w,d,floors,
  roof=roofMat,
  name="Casa"
 ){

  label(name,x,z);

  for(let f=0;f<floors;f++){

   const floor=cube(
    w,.15,d,
    woodMat,
    x,f*3,z
   );

   scene.add(floor);

  }

  const back=cube(
   w,3,.3,
   wallMat,
   x,1.5,z+d/2
  );

  const left=cube(
   .3,3,d,
   wallMat,
   x-w/2,1.5,z
  );

  const right=cube(
   .3,3,d,
   wallMat,
   x+w/2,1.5,z
  );

  scene.add(back,left,right);

  collider(x,z+d/2,w,.3);
  collider(x-w/2,z,.3,d);
  collider(x+w/2,z,.3,d);

  const side=(w-3)/2;

  const frontL=cube(
   side,3,.3,
   wallMat,
   x-(side+3)/2,
   1.5,
   z-d/2
  );

  const frontR=cube(
   side,3,.3,
   wallMat,
   x+(side+3)/2,
   1.5,
   z-d/2
  );

  scene.add(frontL,frontR);

  collider(
   x-(side+3)/2,
   z-d/2,
   side,.3
  );

  collider(
   x+(side+3)/2,
   z-d/2,
   side,.3
  );

  const door=cube(
   2.8,2.7,.18,
   darkWood,
   x,1.35,z-d/2-.08
  );

  scene.add(door);

  doors.push({
   mesh:door,
   x:x,
   z:z-d/2,
   open:false
  });

  const win1=cube(
   2.2,1.5,.08,
   glassMat,
   x-w/2-.04,1.8,z
  );

  const win2=cube(
   2.2,1.5,.08,
   glassMat,
   x+w/2+.04,1.8,z
  );

  scene.add(win1,win2);

  for(const sideX of [
   x-w/2-.09,
   x+w/2+.09
  ]){

   scene.add(
    cube(.1,1.6,.12,darkWood,sideX,1.8,z),
    cube(2.2,.1,.12,darkWood,sideX,1.8,z)
   );

  }

  for(let f=1;f<floors;f++){

   const y=f*3+1.5;

   const a=cube(
    w,3,.3,
    wallMat,
    x,y,z-d/2
   );

   const b=cube(
    w,3,.3,
    wallMat,
    x,y,z+d/2
   );

   const c=cube(
    .3,3,d,
    wallMat,
    x-w/2,y,z
   );

   const e=cube(
    .3,3,d,
    wallMat,
    x+w/2,y,z
   );

   scene.add(a,b,c,e);

  }

  const roofMesh=cube(
   w+.5,.35,d+.5,
   roof,
   x,floors*3,z
  );

  scene.add(roofMesh);

 }

 createHouse(
  300,-300,
  32,25,1,
  roofMat,
  "Casa del bosque"
 );

 createHouse(
  -450,-650,
  40,30,2,
  roofRed,
  "Casa grande"
 );

 createHouse(
  700,-550,
  48,34,2,
  roofMat,
  "Casa familiar"
 );

 createHouse(
  -900,500,
  55,38,3,
  roofRed,
  "Edificio residencial"
 );

 createHouse(
  1000,700,
  65,45,3,
  roofMat,
  "Mansión"
 );

 createHouse(
  -1400,-900,
  70,48,3,
  roofRed,
  "Mansión abandonada"
 );

 createHouse(
  1500,-450,
  38,28,1,
  roofMat,
  "Casa rural"
 );

 createHouse(
  -1500,700,
  45,32,2,
  roofMat,
  "Casa del campo"
 );

 /* más casas urbanas */

 for(let x=-900;x<=900;x+=220){

  createHouse(
   x,
   -250,
   55,
   38,
   2,
   Math.random()>.5?roofMat:roofRed,
   "Casa urbana"
  );

 }


 /* =====================================================
    EDIFICIOS
 ===================================================== */

 function building(
  x,z,w,d,h,name,
  mat=wallLight
 ){

  label(name,x,z);

  const body=cube(
   w,h,d,
   mat,
   x,h/2,z
  );

  scene.add(body);

  collider(x,z,w,d);

  buildings.push({
   x,z,w,d,name
  });

  const roof=cube(
   w+2,.5,d+2,
   roofMat,
   x,h+.25,z
  );

  scene.add(roof);

  for(
   let px=x-w/2+5;
   px<x+w/2-4;
   px+=8
  ){

   for(
    let py=3;
    py<h-1;
    py+=5
   ){

    const win=cube(
     2.2,2.2,.08,
     glassMat,
     px,py,z-d/2-.05
    );

    scene.add(win);

   }

  }

 }


 /* HOSPITAL */

 building(
  -500,1100,
  120,80,30,
  "HOSPITAL"
 );

 /* FÁBRICA */

 building(
  700,1200,
  170,110,22,
  "FÁBRICA"
 );

 /* ESCUELA */

 building(
  100,-1050,
  100,65,15,
  "ESCUELA"
 );

 /* COMISARÍA */

 building(
  -700,-1050,
  75,55,12,
  "COMISARÍA",
  concreteMat
 );

 /* SUPERMERCADO */

 building(
  650,-950,
  110,70,10,
  "SUPERMERCADO"
 );

 /* ESTACIÓN */

 building(
  -1000,-300,
  90,55,9,
  "ESTACIÓN"
 );

 /* nuevo centro comercial */

 building(
  400,0,
  180,120,18,
  "CENTRO COMERCIAL"
 );

 /* depósito */

 building(
  1300,400,
  150,90,16,
  "DEPÓSITO"
 );

 /* base militar */

 building(
  -1600,-500,
  200,130,20,
  "BASE MILITAR",
  metalMat
 );


 /* =====================================================
    CRUZ HOSPITAL
 ===================================================== */

 function crossBuilding(x,y,z){

  const a=cube(
   12,.3,3,
   whiteMat,
   x,y,z
  );

  const b=cube(
   3,.3,12,
   whiteMat,
   x,y,z
  );

  scene.add(a,b);

 }

 crossBuilding(
  -500,
  31,
  1059

 /* =====================================================
    JOYSTICK
 ===================================================== */

 const joy=
  document.getElementById("joy");

 const knob=
  document.getElementById("knob");

 let joyX=0;
 let joyY=0;
 let joyOn=false;

 function moveJoy(e){

  const r=
   joy.getBoundingClientRect();

  const cx=
   r.left+r.width/2;

  const cy=
   r.top+r.height/2;

  let dx=
   e.clientX-cx;

  let dy=
   e.clientY-cy;

  const max=47;

  const len=
   Math.hypot(dx,dy);

  if(len>max){

   dx=dx/len*max;
   dy=dy/len*max;

  }

  joyX=dx/max;
  joyY=dy/max;

  knob.style.transform=
   `translate(${dx}px,${dy}px)`;

 }

 joy.addEventListener(
  "pointerdown",
  e=>{

   joyOn=true;

   joy.setPointerCapture(
    e.pointerId
   );

   moveJoy(e);

  }
 );

 joy.addEventListener(
  "pointermove",
  e=>{

   if(joyOn)
    moveJoy(e);

  }
 );

 function releaseJoy(){

  joyOn=false;

  joyX=0;
  joyY=0;

  knob.style.transform=
   "translate(0,0)";

 }

 joy.addEventListener(
  "pointerup",
  releaseJoy
 );

 joy.addEventListener(
  "pointercancel",
  releaseJoy
 );


 /* =====================================================
    CÁMARA
    NO SE CAMBIA EL SISTEMA DE V128
 ===================================================== */

 let yaw=0;
 let pitch=-.08;

 let targetYaw=0;
 let targetPitch=-.08;

 let looking=false;
 let lastX=0;
 let lastY=0;

 renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

   if(
    e.clientX<180 ||
    e.clientY>innerHeight-180
   ){
    return;
   }

   looking=true;

   lastX=e.clientX;
   lastY=e.clientY;

   renderer.domElement.setPointerCapture(
    e.pointerId
   );

  }
 );

 renderer.domElement.addEventListener(
  "pointermove",
  e=>{

   if(!looking)return;

   const dx=
    e.clientX-lastX;

   const dy=
    e.clientY-lastY;

   lastX=e.clientX;
   lastY=e.clientY;

   targetYaw-=dx*.004;
   targetPitch-=dy*.003;

   targetPitch=Math.max(
    -1.1,
    Math.min(
     1.0,
     targetPitch
    )
   );

  }
 );

 renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
   looking=false;
  }
 );

 renderer.domElement.addEventListener(
  "pointercancel",
  ()=>{
   looking=false;
  }
 );

 const zombieMaterials={

 function zombie(type,x,z){

  const g=
   new THREE.Group();

  let scale=1;
  let speed=1;

  if(type==="runner"){
   scale=.9;
   speed=2.2;
  }

  if(type==="bloater"){
   scale=1.45;
   speed=.55;
  }

  if(type==="screamer"){
   scale=1.1;
   speed=.8;
  }

  if(type==="mutant"){
   scale=1.7;
   speed=.65;
  }

  const body=cube(
   .75*scale,
   1.4*scale,
   .45*scale,
   zombieMaterials[type],
   0,
   .95*scale,
   0
  );

  const head=new THREE.Mesh(
   new THREE.SphereGeometry(
    .38*scale,
    8,
    8
   ),
   zombieMaterials[type]
  );

  head.position.y=
   1.95*scale;

  g.add(body,head);

  if(
   type==="bloater" ||
   type==="mutant"
  ){

   const arm1=cube(
    .4*scale,
    1.5*scale,
    .4*scale,
    zombieMaterials[type],
    -.6*scale,
    1*scale,
    0
   );

   const arm2=cube(
    .4*scale,
    1.5*scale,
    .4*scale,
    zombieMaterials[type],
    .6*scale,
    1*scale,
    0
   );

   g.add(
    arm1,
    arm2
   );

  }

  g.position.set(
   x,
   0,
   z
  );

  scene.add(g);

  zombies.push({
   mesh:g,
   type,
   speed,
   hp:
    type==="mutant"?250:
    type==="bloater"?100:
    40,
   attack:0,
   wander:Math.random()*10,
   dead:false
  });

 }

   "hpText"
  ).innerText=
   Math.round(
    player.health
   );

  document.getElementById(
   "foodText"
  ).innerText=
   Math.round(
    player.hunger
   );

  document.getElementById(
   "waterText"
  ).innerText=
   Math.round(
    player.thirst
   );

  document.getElementById(
   "staminaText"
  ).innerText=
   Math.round(
    player.stamina
   );

  document.getElementById(
   "tempText"
  ).innerText=
   Math.round(
    player.temperature
   );

  document.getElementById(
   "sleepText"
  ).innerText=
   Math.round(
    player.sleep
   );

  document.getElementById(
   "hp"
  ).style.width=
   Math.max(
    0,
    player.health
   )+"%";

  document.getElementById(
   "food"
  ).style.width=
   Math.max(
    0,
    player.hunger
   )+"%";

  document.getElementById(
   "water"
  ).style.width=
   Math.max(
    0,
    player.thirst
   )+"%";

  document.getElementById(
   "stamina"
  ).style.width=
   Math.max(
    0,
    player.stamina
   )+"%";

  document.getElementById(
   "temp"
  ).style.width=
   Math.min(
    100,
    Math.max(
     0,
     player.temperature*3
    )
   )+"%";

  document.getElementById(
   "sleep"
  ).style.width=
   Math.max(
    0,
    player.sleep
   )+"%";

  document.getElementById(
   "invText"
  ).innerText=
   Object.values(
    inventory
   ).reduce(
    (a,b)=>a+b,
    0
   );

 }


 /* =====================================================
    MAPA
 ===================================================== */

 function drawMap(){

  const ctx=
   mapCanvas.getContext("2d");

  const size=
   mapCanvas.width;

  ctx.fillStyle="#394934";
  ctx.fillRect(
   0,0,size,size
  );

  const scale=
   size/6000;

  function mx(x){
   return size/2+x*scale;
  }

  function mz(z){
   return size/2+z*scale;
  }

  /* caminos */

  ctx.strokeStyle="#454545";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(mx(0),0);
  ctx.lineTo(mx(0),size);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,mz(-850));
  ctx.lineTo(size,mz(-850));
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,mz(850));
  ctx.lineTo(size,mz(850));
  ctx.stroke();

  /* zonas */

  ctx.fillStyle="#525252";

  ctx.fillRect(
   mx(-900),
   mz(-600),
   180*scale,
   160*scale
  );

  ctx.fillRect(
   mx(200),
   mz(-100),
   220*scale,
   150*scale
  );

  /* lugares */

  ctx.font="bold 15px Arial";
  ctx.textAlign="center";

  for(const p of places){

   if(
    Math.abs(p.x)>3000 ||
    Math.abs(p.z)>3000
   )continue;

   ctx.fillStyle="#e8d48a";

   ctx.beginPath();

   ctx.arc(
    mx(p.x),
    mz(p.z),
    5,
    0,
    Math.PI*2
   );

   ctx.fill();

   ctx.fillStyle="#fff";

   ctx.fillText(
    p.name,
    mx(p.x),
    mz(p.z)-8
   );

  }

  /* jugador */

  ctx.fillStyle="#29b6f6";

  ctx.beginPath();

  ctx.arc(
   mx(player.x),
   mz(player.z),
   8,
   0,
   Math.PI*2
  );

  ctx.fill();

  /* zombies */

  ctx.fillStyle="#e53935";

  for(const z of zombies){

   if(z.dead)continue;

   const dx=
    z.mesh.position.x-player.x;

   const dz=
    z.mesh.position.z-player.z;

   if(
    Math.abs(dx)>3000 ||
    Math.abs(dz)>3000
   )continue;

   ctx.beginPath();

   ctx.arc(
    mx(z.mesh.position.x),
    mz(z.mesh.position.z),
    3,
    0,
    Math.PI*2
   );

   ctx.fill();

  }

 }


 /* =====================================================
    MOVIMIENTO
 ===================================================== */

 let previous=
  performance.now();

 let survivalTime=0;
 let worldTime=8*60;
 let day=1;
 let zombieSpawnTimer=0;

 function update(){

  const now=
   performance.now();

  const dt=
   Math.min(
    .05,
    (now-previous)/1000
   );

  previous=now;


  /* ===================================================
     CÁMARA
  =================================================== */

  yaw+=
   (targetYaw-yaw)*
   Math.min(
    1,
    dt*12
   );

  pitch+=
   (targetPitch-pitch)*
   Math.min(
    1,
    dt*12
   );


  /* ===================================================
     JOYSTICK CORREGIDO
  =================================================== */

  const forward=
   -joyY;

  const right=
   joyX;

  const amount=
   Math.min(
    1,
    Math.hypot(
     joyX,
     joyY
    )
   );

  /*
   Cámara Three.js:
   forward = (-sin(yaw), -cos(yaw))
   right   = ( cos(yaw), -sin(yaw))
  */

  const forwardX=
   -Math.sin(yaw);

  const forwardZ=
   -Math.cos(yaw);

  const rightX=
   Math.cos(yaw);

  const rightZ=
   -Math.sin(yaw);

  let dx=
   forwardX*forward+
   rightX*right;

  let dz=
   forwardZ*forward+
   rightZ*right;


  /* ===================================================
     STAMINA
  =================================================== */

  if(
   running &&
   amount>.1 &&
   player.stamina>0
  ){

   player.stamina=
    Math.max(
     0,
     player.stamina-
     dt*20
    );

  }else{

   player.stamina=
    Math.min(
     100,
     player.stamina+
     dt*13
    );

  }

  if(
   player.stamina<=0
  ){

   running=false;

   runBtn.innerText=
    "🏃 CORRER";

  }


  const speed=
   running?7:4;

  dx*=
   speed*dt*amount;

  dz*=
   speed*dt*amount;

  const nx=
   player.x+dx;

  const nz=
   player.z+dz;

  if(
   !blocked(
    nx,
    player.z
   )
  )
   player.x=nx;

  if(
   !blocked(
    player.x,
    nz
   )
  )
   player.z=nz;


  /* ===================================================
     CÁMARA
  =================================================== */

  camera.position.set(
   player.x,
   2.25,
   player.z
  );

  camera.rotation.order=
   "YXZ";

  camera.rotation.y=
   yaw;

  camera.rotation.x=
   pitch;


  /* linterna */

  flashlight.position.copy(
   camera.position
  );

  flashlight.target.position.set(
   player.x+
    Math.sin(yaw)*10,
   1.5,
   player.z-
    Math.cos(yaw)*10
  );

  flashlight.intensity=
   flashlightOn?4:0;


  /* ===================================================
     DÍA Y NOCHE
  =================================================== */

  worldTime+=dt*1.2;

  if(worldTime>=1440){

   worldTime=0;
   day++;

   showMessage(
    "Día "+day
   );

  }

  const hour=
   Math.floor(
    worldTime/60
   );

  const minute=
   Math.floor(
    worldTime%60
   );

  const isNight=
   hour>=21 ||
   hour<6;

  let sunFactor=1;

  if(isNight)
   sunFactor=.18;

  else if(hour<8)
   sunFactor=.55;

  else if(hour>18)
   sunFactor=.5;

  sun.intensity=
   1.4*sunFactor;

  hemi.intensity=
   1.5*sunFactor;

  scene.background.set(
   isNight?
    0x111827:
    0x71899a
  );

  scene.fog.color.set(
   isNight?
    0x111827:
    0x71899a
  );

  document.getElementById(
   "timeText"
  ).innerText=
   (isNight?"🌙":"☀️")+
   " DÍA "+day+
   " - "+
   String(hour).padStart(2,"0")+
   ":"+
   String(minute).padStart(2,"0");


  /* ===================================================
     TEMPERATURA
  =================================================== */

  let targetTemp=22;

  if(isNight)
   targetTemp=10;

  if(
   player.z<-1400
  )
   targetTemp-=5;

  player.temperature+=
   (targetTemp-
    player.temperature)*
   dt*.2;


  /* ===================================================
     SUEÑO
  =================================================== */

  player.sleep=
   Math.max(
    0,
    player.sleep-
    dt*.008
   );

  if(
   player.sleep<20
  ){

   player.stamina=
    Math.max(
     0,
     player.stamina-
     dt*3
    );

  }


  /* ===================================================
     UBICACIÓN
  =================================================== */

  let closest=null;
  let closestDist=Infinity;

  for(const p of places){

   const d=
    Math.hypot(
     player.x-p.x,
     player.z-p.z
    );

   if(
    d<closestDist
   ){

    closestDist=d;
    closest=p;

   }

  }

  if(
   closest &&
   closestDist<100
  ){

   document.getElementById(
    "place"
   ).innerText=
    "📍 "+closest.name;

   document.getElementById(
    "zoneText"
   ).innerText=
    closest.name;

  }else{

   document.getElementById(
    "place"
   ).innerText=
    "V12.9";

   document.getElementById(
    "zoneText"
   ).innerText=
    "Afueras";

  }


  /* ===================================================
     PUERTAS
  =================================================== */

  nearDoor=null;

  let doorDistance=999;

  for(const d of doors){

   const dist=
    Math.hypot(
     player.x-d.x,
     player.z-d.z
    );

   if(
    dist<3 &&
    dist<doorDistance
   ){

    doorDistance=dist;
    nearDoor=d;

   }

  }


  nearPickup=null;

  let pickDistance=999;

  for(const p of pickups){

   const dist=
    Math.hypot(
     player.x-p.position.x,
     player.z-p.position.z
    );

   if(
    dist<2.5 &&
    dist<pickDistance
   ){

    pickDistance=dist;
    nearPickup=p;

   }

  }


  nearVehicle=null;

  let vehicleDistance=999;

  for(const v of vehicles){

   const dist=
    Math.hypot(
     player.x-v.x,
     player.z-v.z
    );

   if(
    dist<5 &&
    dist<vehicleDistance
   ){

    vehicleDistance=dist;
    nearVehicle=v;

   }

  }


  if(nearDoor){

   action.style.display=
    "block";

   action.innerText=
    nearDoor.open?
    "CERRAR":
    "ABRIR";

  }
  else if(nearPickup){

   action.style.display=
    "block";

   action.innerText=
    "RECOGER";

  }
  else if(
   nearVehicle &&
   !nearVehicle.repaired
  ){

   action.style.display=
    "block";

   action.innerText=
    "REPARAR";

  }
  else{

   action.style.display=
    "none";

  }


  /* ===================================================
     ZOMBIES
  =================================================== */

  let nearbyZombies=0;

  for(const z of zombies){

   if(z.dead)
    continue;

   const zx=
    z.mesh.position.x;

   const zz=
    z.mesh.position.z;

   const dist=
    Math.hypot(
     player.x-zx,
     player.z-zz
    );

   if(dist<30)
    nearbyZombies++;

   let detect=
    dist<35;

   if(
    flashlightOn &&
    dist<75
   )
    detect=true;

   if(
    running &&
    dist<65
   )
    detect=true;

   if(detect){

    const ax=
     player.x-zx;

    const az=
     player.z-zz;

    const len=
     Math.hypot(
      ax,
      az
     )||1;

    const zs=
     z.speed*dt;

    const nx=
     zx+
     ax/len*zs;

    const nz=
     zz+
     az/len*zs;

    if(
     !blocked(
      nx,
      zz
     )
    )
     z.mesh.position.x=nx;

    if(
     !blocked(
      z.mesh.position.x,
      nz
     )
    )
     z.mesh.position.z=nz;

    z.mesh.lookAt(
     player.x,
     1,
     player.z
    );

   }else{

    z.wander+=dt;

    if(
     Math.sin(z.wander)>.85
    ){

     z.mesh.position.x+=
      Math.sin(
       z.wander
      )*
      z.speed*
      dt*.2;

    }

   }

   if(
    dist<1.8
   ){

    z.attack+=dt;

    if(
     z.attack>1
    ){

     z.attack=0;

     let damage=5;

     if(z.type==="runner")
      damage=8;

     if(z.type==="bloater")
      damage=12;

     if(z.type==="mutant")
      damage=18;

     player.health=
      Math.max(
       0,
       player.health-damage
      );

     showMessage(
      "¡Te atacó un zombie!"
     );

    }

   }

  }

  document.getElementById(
   "zombieText"
  ).innerText=
   nearbyZombies;

  document.getElementById(
   "danger"
  ).style.display=
   nearbyZombies>0?
   "block":
   "none";


  /* ===================================================
     ZOMBIES MÁS ACTIVOS DE NOCHE
  =================================================== */

  zombieSpawnTimer+=dt;

  if(
   isNight &&
   zombieSpawnTimer>25 &&
   zombies.length<100
  ){

   zombieSpawnTimer=0;

   const angle=
    Math.random()*
    Math.PI*2;

   const dist=
    90+
    Math.random()*100;

   const zx=
    player.x+
    Math.cos(angle)*dist;

   const zz=
    player.z+
    Math.sin(angle)*dist;

   const type=
    Math.random()<.7?
    "walker":
    "runner";

   zombie(
    type,
    zx,
    zz
   );

  }


  /* ===================================================
     SUPERVIVENCIA
  =================================================== */

  survivalTime+=dt;

  if(
   survivalTime>5
  ){

   survivalTime=0;

   player.hunger=
    Math.max(
     0,
     player.hunger-.7
    );

   player.thirst=
    Math.max(
     0,
     player.thirst-1
    );

   if(
    player.hunger<=0 ||
    player.thirst<=0
   ){

    player.health=
     Math.max(
      0,
      player.health-2
     );

   }

   if(
    player.temperature<0 ||
    player.temperature>38
   ){

    player.health=
     Math.max(
      0,
      player.health-1
     );

   }

   if(
    player.sleep<=0
   ){

    player.health=
     Math.max(
      0,
      player.health-1
     );

   }

   if(
    player.health<=0
   ){

    showMessage(
     "Moriste. Perdiste tus objetos."
    );

    for(const key in inventory)
     inventory[key]=0;

    inventory.food=1;
    inventory.water=1;

    player.health=100;
    player.hunger=100;
    player.thirst=100;
    player.stamina=100;
    player.sleep=100;

    player.x=0;
    player.z=0;

    save();

   }

   updateHUD();

  }


  /* ===================================================
     XP Y PROGRESIÓN
  =================================================== */

  if(
   nearbyZombies>0
  ){

   player.xp+=dt*.05;

  }

  if(
   player.xp>=100
  ){

   player.xp-=100;

   player.level++;

   showMessage(
    "¡SUBISTE AL NIVEL "+
    player.level+"!"
   );

  }


  /* ===================================================
     PICKUPS ANIMADOS
  =================================================== */

  for(const p of pickups){

   p.rotation.y+=dt;

   p.position.y=
    .3+
    Math.sin(
     now*.003+
     p.position.x
    )*.08;

  }


  /* ===================================================
     MAPA
  =================================================== */

  if(
   panel.style.display==="flex" &&
   document.getElementById(
    "panelTitle"
   ).innerText==="🗺️ MAPA"
  ){

   drawMap();

  }


  renderer.render(
   scene,
   camera
  );

  requestAnimationFrame(
   update
  );

 }


 /* =====================================================
    INICIO
 ===================================================== */

 updateHUD();

 document.getElementById(
  "loading"
 ).style.display=
  "none";

 update();


 /* =====================================================
    RESIZE
 ===================================================== */

 window.addEventListener(
  "resize",
  ()=>{

   camera.aspect=
    innerWidth/innerHeight;

   camera.updateProjectionMatrix();

   renderer.setSize(
    innerWidth,
    innerHeight
   );

  }
 );

}

start();

</script>
</body>
</html>
