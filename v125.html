*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}

#hud{

<script>
/* =========================================================
   SUPERVIVENCIA 3D V12.5
   ========================================================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87a9bd);
scene.fog=new THREE.Fog(0x87a9bd,300,2600);

const camera=new THREE.PerspectiveCamera(
 72,innerWidth/innerHeight,.05,4000
);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

/* LUZ */
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x46502f,1.6));

const sun=new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(500,900,300);
scene.add(sun);

/* MATERIALS */
const M={
 grass:new THREE.MeshLambertMaterial({color:0x527a3b}),
 road:new THREE.MeshLambertMaterial({color:0x3c3c3c}),
 wall:new THREE.MeshLambertMaterial({color:0x8c8275}),
 wall2:new THREE.MeshLambertMaterial({color:0x655c52}),
 roof:new THREE.MeshLambertMaterial({color:0x443b36}),
 wood:new THREE.MeshLambertMaterial({color:0x76502e}),
 woodDark:new THREE.MeshLambertMaterial({color:0x49301d}),
 glass:new THREE.MeshLambertMaterial({color:0x70a6b8}),
 stone:new THREE.MeshLambertMaterial({color:0x777777}),
 metal:new THREE.MeshLambertMaterial({color:0x55585b}),
 white:new THREE.MeshLambertMaterial({color:0xd8d8d8}),
 red:new THREE.MeshLambertMaterial({color:0xa63228}),
 green:new THREE.MeshLambertMaterial({color:0x3d7d39}),
 water:new THREE.MeshLambertMaterial({color:0x287ea0})
};

/* TERRENO */
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(10000,10000),
 M.grass
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* PLAYER */
const player={
 x:0,y:0,z:0,
 yaw:0,
 health:100,
 hunger:100,
 thirst:100,
 moving:false
};

const body=new THREE.Group();
scene.add(body);

function cube(w,h,d,mat,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);
 return o;
}

/* cuerpo interno */
const torso=cube(.7,1.15,.4,M.white,0,1.45,0);
const head=cube(.48,.48,.48,M.white,0,2.25,0);
const armL=cube(.18,.9,.18,M.white,-.5,1.45,0);
const armR=cube(.18,.9,.18,M.white,.5,1.45,0);
const legL=cube(.22,.9,.22,M.metal,-.2,.45,0);
const legR=cube(.22,.9,.22,M.metal,.2,.45,0);

body.add(torso,head,armL,armR,legL,legR);

/* brazos primera persona */
const fp=new THREE.Group();
const handL=cube(.17,.7,.18,M.white,-.34,-.38,-.65);
const handR=cube(.17,.7,.18,M.white,.34,-.38,-.65);
fp.add(handL,handR);
camera.add(fp);
scene.add(camera);

/* INVENTARIO */
let inventory=JSON.parse(localStorage.getItem("surv125inv")||"null")||{
 wood:0,
 stone:0,
 metal:0,
 cloth:0,
 food:2,
 water:2,
 medkit:0,
 axe:0,
 pickaxe:0
};

function saveInv(){
 localStorage.setItem("surv125inv",JSON.stringify(inventory));
}

function totalItems(){
 return Object.values(inventory).reduce((a,b)=>a+b,0);
}

/* COLISIONES */
const colliders=[];
const doors=[];
const stairs=[];

function addCollider(x,z,w,d,minY=-100,maxY=100){
 colliders.push({x,z,w,d,minY,maxY});
}

function blocked(x,z){
 const r=.42;
 for(const c of colliders){
  if(x+r>c.x-c.w/2 &&
     x-r<c.x+c.w/2 &&
     z+r>c.z-c.d/2 &&
     z-r<c.z+c.d/2){
    if(player.y>=c.minY-.2 && player.y<=c.maxY+.2)return true;
  }
 }
 return false;
}

/* ÁRBOLES */
function tree(x,z,s=1){
 const g=new THREE.Group();
 const trunk=cube(.45*s,3*s,.45*s,M.wood,0,1.5*s,0);
 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.8*s,4*s,7),
  M.green
 );
 leaves.position.y=4*s;
 g.add(trunk,leaves);
 g.position.set(x,0,z);
 scene.add(g);
 addCollider(x,z,.8*s,.8*s);
}

for(let i=0;i<180;i++){
 const x=(Math.random()-.5)*7000;
 const z=(Math.random()-.5)*7000;
 if(Math.abs(x)<250&&Math.abs(z)<250)continue;
 tree(x,z,.7+Math.random()*.8);
}

/* =========================================================
   CASA GRANDE
   ========================================================= */

function makeWindow(wallGroup,x,y,z,rot=0){
 const frame=new THREE.Group();
 const vertical=cube(.12,1.8,.12,M.woodDark,0,0,0);
 const horizontal=cube(1.8,.12,.12,M.woodDark,0,0,0);
 frame.add(vertical,horizontal);
 frame.position.set(x,y,z);
 frame.rotation.y=rot;
 wallGroup.add(frame);
}

/*
  Pared con hueco central:
  deja una abertura visual.
*/
function wallWithWindow(x,z,w,d,y=1.5){
 const g=new THREE.Group();

 const seg=w>.d? w/2 : d/2;
 let a,b;

 if(w>d){
  const gap=2.4;
  const side=(w-gap)/2;
  a=cube(side,3,d,M.wall,-(w-side)/2,1.5,0);
  b=cube(side,3,d,M.wall,(w-side)/2,1.5,0);
  g.add(a,b);

  makeWindow(g,0,1.8,0,0);
  addCollider(x-(w-side)/2,z,side,d);
  addCollider(x+(w-side)/2,z,side,d);
 }else{
  const gap=2.4;
  const side=(d-gap)/2;
  a=cube(w,3,side,M.wall,0,1.5,-(d-side)/2);
  b=cube(w,3,side,M.wall,0,1.5,(d-side)/2);
  g.add(a,b);

  makeWindow(g,0,1.8,0,Math.PI/2);
  addCollider(x,z-(d-side)/2,w,side);
  addCollider(x,z+(d-side)/2,w,side);
 }

 g.position.set(x, y-1.5, z);
 scene.add(g);
 return g;
}

function doorWall(x,z,w,d,side,doorObj){
 const gap=2.6;
 if(w>d){
  const sideW=(w-gap)/2;
  const left=cube(sideW,3,d,M.wall,-(sideW+gap)/2,1.5,0);
  const right=cube(sideW,3,d,M.wall,(sideW+gap)/2,1.5,0);
  const g=new THREE.Group();
  g.add(left,right);
  g.position.set(x,0,z);
  scene.add(g);

  addCollider(x-(sideW+gap)/2,z,sideW,d);
  addCollider(x+(sideW+gap)/2,z,sideW,d);

  doorObj.position.set(x,1.45,z);
  doorObj.horizontal=true;
 }else{
  const sideD=(d-gap)/2;
  const a=cube(w,3,sideD,M.wall,0,1.5,-(sideD+gap)/2);
  const b=cube(w,3,sideD,M.wall,0,1.5,(sideD+gap)/2);
  const g=new THREE.Group();
  g.add(a,b);
  g.position.set(x,0,z);
  scene.add(g);

  addCollider(x,z-(sideD+gap)/2,w,sideD);
  addCollider(x,z+(sideD+gap)/2,w,sideD);

  doorObj.position.set(x,1.45,z);
  doorObj.horizontal=false;
 }
}

/* PUERTA REAL */
function createDoor(x,z,rot=0){
 const pivot=new THREE.Group();

 const slab=cube(2.55,2.7,.16,M.woodDark,1.275,0,0);
 pivot.add(slab);

 pivot.position.set(x-1.275*Math.cos(rot),1.35,z-1.275*Math.sin(rot));
 pivot.rotation.y=rot;

 scene.add(pivot);

 const door={
  pivot,
  slab,
  x,z,
  open:false,
  rot,
  collider:null
 };

 doors.push(door);

 // collider de puerta cerrada
 door.collider={
  x,z,w:2.5,d:.45,
  minY:0,maxY:3,
  active:true
 };

 colliders.push(door.collider);

 return door;
}

/* CASA */
function house(x,z,w,d,floors=1,mansion=false){
 const h=3;

 // suelo
 for(let f=0;f<floors;f++){
  const floor=cube(w,.18,d,M.wood2||M.wood,x,f*3, z);
  floor.position.y=f*3+.05;
  scene.add(floor);
 }

 // paredes exteriores
 const frontDoor=createDoor(x,z-d/2-.08,0);

 // pared frontal
 const front=new THREE.Group();
 const sideW=(w-2.6)/2;
 front.add(
  cube(sideW,h,.3,M.wall,-(sideW+2.6)/2,1.5,0),
  cube(sideW,h,.3,M.wall,(sideW+2.6)/2,1.5,0)
 );
 front.position.set(x,0,z-d/2);
 scene.add(front);

 addCollider(x-(sideW+2.6)/2,z-d/2,sideW,.3);
 addCollider(x+(sideW+2.6)/2,z-d/2,sideW,.3);

 // puerta visual
 frontDoor.pivot.position.y=1.35;

 // atrás
 const back=cube(w,h,.3,M.wall,x,1.5,z+d/2);
 scene.add(back);
 addCollider(x,z+d/2,w,.3);

 // laterales con ventanas
 const left=wallWithWindow(x-w/2,z,.3,d);
 const right=wallWithWindow(x+w/2,z,.3,d);

 // segundo y tercer piso
 for(let f=1;f<floors;f++){
  const yy=f*3;

  const a=cube(w,h,.3,M.wall,x,yy+1.5,z-d/2);
  const b=cube(w,h,.3,M.wall,x,yy+1.5,z+d/2);
  const c=cube(.3,h,d,M.wall,x-w/2,yy+1.5,z);
  const e=cube(.3,h,d,M.wall,x+w/2,yy+1.5,z);

  scene.add(a,b,c,e);

  addCollider(x,z-d/2,w,.3,yy,yy+3);
  addCollider(x,z+d/2,w,.3,yy,yy+3);
  addCollider(x-w/2,z,.3,d,yy,yy+3);
  addCollider(x+w/2,z,.3,d,yy,yy+3);
 }

 // techo
 const roof=cube(w+.7,.35,d+.7,M.roof,x,floors*3+.15,z);
 scene.add(roof);

 // paredes interiores para habitaciones
 if(w>28){
  const room=cube(.25,3,d-.4,M.wall2,x,1.5,z);
  scene.add(room);
  addCollider(x,z,.25,d-1);
 }

 // muebles
 furniture(x-5,z+2);
 furniture(x+5,z-3);

 // escaleras
 for(let f=0;f<floors-1;f++){
  staircase(x+7,z,f*3,3,10,3);
 }

 return {x,z,w,d,floors,door:frontDoor};
}

function furniture(x,z){
 const table=cube(2,.9,1.2,M.wood,x,.45,z);
 scene.add(table);
 addCollider(x,z,2,1.2,0,1);

 const box=cube(1,1,1,M.woodDark,x+2,.5,z+1);
 scene.add(box);
 addCollider(x+2,z+1,1,1,0,1);
}

/* =========================================================
   ESCALERAS FÍSICAS
   ========================================================= */

function staircase(x,z,baseY,width,length,height){
 const steps=12;
 const stepLen=length/steps;

 for(let i=0;i<steps;i++){
  const hh=height*(i+1)/steps;
  const s=cube(width,hh,stepLen,M.wood,
    x,
    baseY+hh/2,
    z+(i+.5)*stepLen
  );
  scene.add(s);
 }

 stairs.push({
  x,z,width,length,height,baseY
 });

 // laterales
 const side1=cube(.25,height,length,M.wall2,
  x-width/2-.15,baseY+height/2,z+length/2);
 const side2=cube(.25,height,length,M.wall2,
  x+width/2+.15,baseY+height/2,z+length/2);
 scene.add(side1,side2);

 return true;
}

function stairHeight(px,pz){
 for(const s of stairs){
  if(
   px>s.x-s.width/2 &&
   px<s.x+s.width/2 &&
   pz>s.z &&
   pz<s.z+s.length
  ){
   const t=(pz-s.z)/s.length;
   return s.baseY+Math.max(0,Math.min(1,t))*s.height;
  }
 }
 return 0;
}

house(300,-350,32,25,2);

/* =========================================================
   PICKUPS
   ========================================================= */

const pickups=[];

function pickup(type,x,z){
 let mat=M.wood;
 if(type==="stone")mat=M.stone;
 if(type==="metal")mat=M.metal;
 if(type==="food")mat=M.red;
 if(type==="water")mat=M.water;
 if(type==="cloth")mat=M.white;

 const o=cube(.5,.5,.5,mat,x,.3,z);
 o.userData.type=type;
 scene.add(o);
 pickups.push(o);
}

for(let i=0;i<45;i++){
 const types=["wood","wood","stone","metal","food","water","cloth"];
 pickup(types[Math.floor(Math.random()*types.length)],
   (Math.random()-.5)*3500,
   (Math.random()-.5)*3500
 );
}

/* =========================================================
   JOYSTICK
   ========================================================= */

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

let joyX=0,joyY=0;
let joyActive=false;

function joyMove(e){
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const max=48;
 const len=Math.hypot(dx,dy);
 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }
 joyX=dx/max;
 joyY=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}

joy.addEventListener("pointerdown",e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 joyMove(e);
});
joy.addEventListener("pointermove",e=>{
 if(joyActive)joyMove(e);
});
joy.addEventListener("pointerup",()=>{
 joyActive=false;
 joyX=joyY=0;
 knob.style.transform="translate(0,0)";
});

/* =========================================================
   CÁMARA
   ========================================================= */

let camYaw=0;
let camPitch=-.05;
let targetYaw=0;
let targetPitch=-.05;
let lookPointer=null;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX<190)return;
 if(e.clientY>innerHeight-190)return;
 lookPointer={x:e.clientX,y:e.clientY,id:e.pointerId};
 renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(!lookPointer)return;

 const dx=e.clientX-lookPointer.x;
 const dy=e.clientY-lookPointer.y;

 targetYaw-=dx*.0042;
 targetPitch-=dy*.0032;

 targetPitch=Math.max(-1.15,Math.min(1.0,targetPitch));

 lookPointer.x=e.clientX;
 lookPointer.y=e.clientY;
});

renderer.domElement.addEventListener("pointerup",()=>{
 lookPointer=null;
});

   CORRER
   ========================================================= */

let running=false;
const runBtn=document.getElementById("run");

runBtn.addEventListener("pointerdown",()=>{
 running=true;
 runBtn.innerText="🏃 CORRIENDO";
});
runBtn.addEventListener("pointerup",()=>{

/* =========================================================
   PUERTAS / ACCIONES
   ========================================================= */

const action=document.getElementById("action");
let nearDoor=null;
let nearPickup=null;

function distance(a,b){
 return Math.hypot(a.x-b.x,a.z-b.z);
}

function toggleDoor(d){
 d.open=!d.open;

 if(d.open){
  d.pivot.rotation.y=d.rot+Math.PI/2;
  d.collider.active=false;
 }else{
  d.pivot.rotation.y=d.rot;
  d.collider.active=true;
 }
}

action.addEventListener("click",()=>{
 if(nearDoor){
  toggleDoor(nearDoor);
  action.innerText=nearDoor.open?"CERRAR":"ABRIR";
 }
 else if(nearPickup){
  const type=nearPickup.userData.type;
  inventory[type]++;
  scene.remove(nearPickup);
  pickups.splice(pickups.indexOf(nearPickup),1);
  nearPickup=null;
  action.style.display="none";
  saveInv();
  updateHUD();
 }
});

/* modificar blocked para puertas activas */
const originalBlocked=blocked;
function isBlocked(x,z){
 const r=.42;

 for(const c of colliders){
  if(c.active===false)continue;

  if(x+r>c.x-c.w/2 &&
     x-r<c.x+c.w/2 &&
     z+r>c.z-c.d/2 &&
     z-r<c.z+c.d/2){

   if(player.y>=c.minY-.2&&player.y<=c.maxY+.2)
    return true;
  }
 }
 return false;
}

/* =========================================================
   INVENTARIO
   ========================================================= */

const names={
 wood:"🪵 Madera",
 stone:"🪨 Piedra",
 metal:"🔩 Metal",
 cloth:"🧵 Tela",
 food:"🍖 Comida",
 water:"💧 Agua",
 medkit:"🩹 Botiquín",
 axe:"🪓 Hacha",
 pickaxe:"⛏️ Pico"
};

function openInventory(){
 const p=document.getElementById("panel");
 const c=document.getElementById("panelContent");

 document.getElementById("panelTitle").innerText="🎒 Inventario";

 let html='<div class="grid">';

 for(const k in inventory){
  html+=`<div class="item"><b>${names[k]}</b><br>${inventory[k]}</div>`;
 }

 html+="</div>";
 html+=`
 <h2>Consumir</h2>
 <button class="btn" onclick="eatFood()">🍖 COMER</button>
 <button class="btn" onclick="drink()">💧 TOMAR AGUA</button>
 <h2>Crear</h2>
 `;

 html+=recipe("🪓 Hacha","5 madera + 2 piedra","axe",()=>inventory.wood>=5&&inventory.stone>=2);
 html+=recipe("⛏️ Pico","4 madera + 5 piedra","pickaxe",()=>inventory.wood>=4&&inventory.stone>=5);
 html+=recipe("🩹 Botiquín","3 tela + 1 metal","medkit",()=>inventory.cloth>=3&&inventory.metal>=1);

 c.innerHTML=html;
 p.style.display="flex";
}

function recipe(title,cost,item,can){
 return `
 <div class="recipe">
 <b>${title}</b><br>
 <small>${cost}</small>
 <button class="btn" onclick="craft('${item}')">CREAR</button>
 </div>`;
}

function craft(item){
 if(item==="axe"){
  if(inventory.wood>=5&&inventory.stone>=2){
   inventory.wood-=5;
   inventory.stone-=2;
   inventory.axe++;
   notify("Hacha creada");
  }else notify("Faltan materiales");
 }

 if(item==="pickaxe"){
  if(inventory.wood>=4&&inventory.stone>=5){
   inventory.wood-=4;
   inventory.stone-=5;
   inventory.pickaxe++;
   notify("Pico creado");
  }else notify("Faltan materiales");
 }

 if(item==="medkit"){
  if(inventory.cloth>=3&&inventory.metal>=1){
   inventory.cloth-=3;
   inventory.metal--;
   inventory.medkit++;
   notify("Botiquín creado");
  }else notify("Faltan materiales");
 }

 saveInv();
 openInventory();
 updateHUD();
}

function eatFood(){
 if(inventory.food>0&&player.hunger<100){
  inventory.food--;
  player.hunger=Math.min(100,player.hunger+30);
  saveInv();
  updateHUD();
  openInventory();
 }
}

function drink(){
 if(inventory.water>0&&player.thirst<100){
  inventory.water--;
  player.thirst=Math.min(100,player.thirst+35);
  saveInv();
  updateHUD();
  openInventory();
 }
}

function closePanel(){
 document.getElementById("panel").style.display="none";
}

document.getElementById("invBtn").onclick=openInventory;

function notify(t){
 const m=document.getElementById("message");
 m.innerText=t;
 m.style.display="block";
 setTimeout(()=>m.style.display="none",1300);
}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){
 document.getElementById("hpText").innerText=Math.round(player.health);
 document.getElementById("foodText").innerText=Math.round(player.hunger);
 document.getElementById("waterText").innerText=Math.round(player.thirst);

 document.getElementById("hp").style.width=player.health+"%";
 document.getElementById("food").style.width=player.hunger+"%";
 document.getElementById("water").style.width=player.thirst+"%";

 document.getElementById("invText").innerText=totalItems();
}

/* =========================================================
   MAPA
   ========================================================= */

document.getElementById("mapBtn").onclick=()=>{
 const p=document.getElementById("panel");
 const c=document.getElementById("panelContent");

 document.getElementById("panelTitle").innerText="🗺️ MAPA";

 c.innerHTML=`
 <div style="
 height:350px;
 background:
 radial-gradient(circle,#777 1px,transparent 1px);
 background-size:18px 18px;
 background-color:#31502c;
 border-radius:15px;
 position:relative;
 overflow:hidden">
 <div style="
 position:absolute;left:50%;top:50%;
 width:14px;height:14px;background:red;border-radius:50%;
 transform:translate(-50%,-50%)"></div>
 <div style="position:absolute;left:48%;top:43%;color:white">🏠 BASE</div>
 </div>
 <p>Posición: X ${Math.round(player.x)} / Z ${Math.round(player.z)}</p>
 `;

 p.style.display="flex";
};

/* =========================================================
   MOVIMIENTO
   ========================================================= */

let last=performance.now();
let survivalTimer=0;

function updatePlayer(dt){

 const forward=-joyY;
 const right=joyX;
 const mag=Math.min(1,Math.hypot(joyX,joyY));

 player.moving=mag>.08;

 // movimiento relativo a cámara
 const dx=
   Math.sin(camYaw)*forward+
   Math.cos(camYaw)*right;

 const dz=
   -Math.cos(camYaw)*forward+
   Math.sin(camYaw)*right;

 let speed=running?7.5:4.2;
 speed*=Math.min(1,mag);

 let nx=player.x+dx*speed*dt;
 let nz=player.z+dz*speed*dt;

 if(!isBlocked(nx,player.z))player.x=nx;
 if(!isBlocked(player.x,nz))player.z=nz;

 // altura de escaleras
 const sy=stairHeight(player.x,player.z);

 if(sy>0){
  player.y=sy;
 }else{
  player.y=0;
 }

 if(mag>.1){
  player.yaw=Math.atan2(dx,dz);
 }

 // posición del modelo
 body.position.set(player.x,player.y,player.z);
 body.rotation.y=player.yaw;

 // cámara
 camYaw+=(targetYaw-camYaw)*Math.min(1,dt*12);
 camPitch+=(targetPitch-camPitch)*Math.min(1,dt*12);

 const bob=
   player.moving
   ? Math.sin(performance.now()*.012*(running?1.5:1))*0.025
   : 0;

 camera.position.set(
   player.x,
   player.y+2.25+bob,
   player.z
 );

 camera.rotation.order="YXZ";
 camera.rotation.y=camYaw;
 camera.rotation.x=camPitch;

 // ocultar cuerpo completo desde primera persona
 body.visible=false;

 // brazos
 fp.position.set(0,-.05,-.05);
 fp.rotation.x=Math.sin(performance.now()*.01)*.02;
}

/* =========================================================
   INTERACCIONES
   ========================================================= */

function updateInteraction(){

 nearDoor=null;
 nearPickup=null;

 let closestDoor=999;
 for(const d of doors){
  const dist=Math.hypot(player.x-d.x,player.z-d.z);
  if(dist<closestDoor&&dist<3.2){
   closestDoor=dist;
   nearDoor=d;
  }
 }

 if(nearDoor){
  action.style.display="block";
  action.innerText=nearDoor.open?"CERRAR":"ABRIR";
  return;
 }

 let closest=999;
 for(const p of pickups){
  const dist=Math.hypot(player.x-p.position.x,player.z-p.position.z);
  if(dist<closest&&dist<2.5){
   closest=dist;
   nearPickup=p;
  }
 }

 if(nearPickup){
  action.style.display="block";
  action.innerText="RECOGER";
 }else{
  action.style.display="none";
 }
}

/* =========================================================
   SUPERVIVENCIA
   ========================================================= */

function survival(dt){
 survivalTimer+=dt;

 if(survivalTimer>5){
  survivalTimer=0;

  player.hunger=Math.max(0,player.hunger-.8);
  player.thirst=Math.max(0,player.thirst-1.2);

  if(player.hunger<=0||player.thirst<=0){
   player.health=Math.max(0,player.health-2);
  }

  if(player.health<=0){
   notify("Has muerto. Volviendo a la base...");
   player.health=100;
   player.hunger=100;
   player.thirst=100;
   player.x=0;
   player.z=0;
  }

  updateHUD();
 }
}

/* =========================================================
   ANIMACIÓN
   ========================================================= */

function animate(){
 requestAnimationFrame(animate);

 const now=performance.now();
 const dt=Math.min(.05,(now-last)/1000);
 last=now;

 updatePlayer(dt);
 updateInteraction();
 survival(dt);

 // pickups flotando
 for(const p of pickups){
  p.rotation.y+=dt;
  p.position.y=.35+Math.sin(now*.003+p.position.x)*.08;
 }

 renderer.render(scene,camera);
}

updateHUD();
animate();

/* =========================================================
   RESIZE
   ========================================================= */

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
