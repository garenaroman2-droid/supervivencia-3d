<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D V12.1</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}
canvas{display:block}

#hud{
  position:fixed;
  top:8px;
  left:8px;
  z-index:20;
  color:white;
  font-size:13px;
  text-shadow:2px 2px 3px #000;
  pointer-events:none;
}

#topButtons{
  position:fixed;
  top:8px;
  right:8px;
  z-index:30;
  display:flex;
  flex-direction:column;
  gap:6px;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  color:white;
  background:#222d;
  font-weight:bold;
  box-shadow:0 2px 6px #0008;
}

#joy{
  position:fixed;
  left:25px;
  bottom:28px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:#ffffff18;
  border:2px solid #ffffff55;
  z-index:30;
}

#stick{
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  background:#ffffff55;
  border:2px solid #ffffff88;
  left:41px;
  top:41px;
}

#actions{
  position:fixed;
  right:18px;
  bottom:25px;
  z-index:30;
  display:grid;
  grid-template-columns:80px 80px;
  gap:9px;
}

.action{
  height:52px;
  background:#151515bb;
}

#mapBox{
  display:none;
  position:fixed;
  z-index:100;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(92vw,820px);
  background:#111e;
  border:2px solid #ffffff55;
  border-radius:15px;
  padding:10px;
}

#map{
  width:100%;
  aspect-ratio:1;
  background:#293329;
  border-radius:10px;
}

#closeMap{
  width:100%;
  margin-top:8px;
}

#message{
  position:fixed;
  z-index:40;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  color:white;
  background:#000b;
  padding:9px 15px;
  border-radius:10px;
  display:none;
  text-align:center;
}

#placeName{
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="hud">
  <div>❤️ Vida: <span id="hp">100</span></div>
  <div>🍖 Hambre: <span id="food">100</span></div>
  <div>💧 Agua: <span id="water">100</span></div>
  <div>🏃 Energía: <span id="stamina">100</span></div>
  <div>📍 <span id="placeName">Base</span></div>
  <div>📏 Base: <span id="distance">0 m</span></div>
</div>

<div id="topButtons">
  <button id="cameraBtn">3ª PERSONA</button>
  <button id="mapBtn">🗺️ MAPA</button>
</div>

<div id="joy">
  <div id="stick"></div>
</div>

<div id="actions">
  <button class="action" id="runBtn">CORRER</button>
  <button class="action" id="jumpBtn">SALTAR</button>
  <button class="action" id="flagBtn">🚩 BANDERA</button>
  <button class="action" id="discoverBtn">EXPLORAR</button>
</div>

<div id="message"></div>

<div id="mapBox">
  <canvas id="map" width="800" height="800"></canvas>
  <button id="closeMap">CERRAR MAPA</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================================================
   SUPERVIVENCIA 3D V12.1
   ========================================================= */

const WORLD = 10000;
const HALF = WORLD / 2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8db3c7);
scene.fog = new THREE.Fog(0x8db3c7, 500, 6500);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  9000
);

const renderer = new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
document.body.appendChild(renderer.domElement);

/* =========================================================
   LUCES
   ========================================================= */

scene.add(new THREE.HemisphereLight(0xbddcff,0x4d573d,1.8));

const sun = new THREE.DirectionalLight(0xffffff,1.4);
sun.position.set(500,1000,300);
scene.add(sun);

/* =========================================================
   MATERIALES
   ========================================================= */

const matGround = new THREE.MeshLambertMaterial({
  color:0x597448
});

const matGrass = new THREE.MeshLambertMaterial({
  color:0x47743c
});

const matDarkGrass = new THREE.MeshLambertMaterial({
  color:0x31552e
});

const matTrunk = new THREE.MeshLambertMaterial({
  color:0x68452d
});

const matLeaves = new THREE.MeshLambertMaterial({
  color:0x285a2e
});

const matLeavesDark = new THREE.MeshLambertMaterial({
  color:0x173d22
});

const matRock = new THREE.MeshLambertMaterial({
  color:0x77736a
});

const matRockDark = new THREE.MeshLambertMaterial({
  color:0x55534e
});

const matRoad = new THREE.MeshLambertMaterial({
  color:0x4a4a46
});

const matRoadLine = new THREE.MeshLambertMaterial({
  color:0xc6b75a
});

const matHouse = new THREE.MeshLambertMaterial({
  color:0x9a7757
});

const matHouseDark = new THREE.MeshLambertMaterial({
  color:0x604937
});

const matRoof = new THREE.MeshLambertMaterial({
  color:0x4a3027
});

const matWindow = new THREE.MeshLambertMaterial({
  color:0x8bb6c7
});

const matMetal = new THREE.MeshLambertMaterial({
  color:0x555a5d
});

const matWater = new THREE.MeshLambertMaterial({
  color:0x3e8ca3,
  transparent:true,
  opacity:.82
});

const matSand = new THREE.MeshLambertMaterial({
  color:0xb4a16b
});

const matFlag = new THREE.MeshLambertMaterial({
  color:0xb32020
});

/* =========================================================
   TERRENO
   ========================================================= */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD,WORLD),
  matGround
);

ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* =========================================================
   UTILIDADES
   ========================================================= */

function box(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}

function cylinder(r,h,mat,x,y,z,segments=8){
  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(r,r,h,segments),
    mat
  );
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}

function dist(x1,z1,x2,z2){
  return Math.sqrt(
    (x1-x2)**2+
    (z1-z2)**2
  );
}

function random(min,max){
  return Math.random()*(max-min)+min;
}

/* =========================================================
   HIERBA
   ========================================================= */

function grassPatch(cx,cz,count=180,radius=120){

  const geo=new THREE.BufferGeometry();

  const positions=[];

  for(let i=0;i<count;i++){

    const x=cx+random(-radius,radius);
    const z=cz+random(-radius,radius);

    const h=random(.25,.65);
    const w=.06;

    positions.push(
      x-w,0,z,
      x+w,0,z,
      x,h,z
    );
  }

  geo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions,3)
  );

  const mesh=new THREE.Mesh(
    geo,
    matGrass
  );

  scene.add(mesh);
}

/* =========================================================
   ÁRBOLES
   ========================================================= */

function tree(x,z,scale=1){

  const g=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .32*scale,
      .48*scale,
      3.2*scale,
      7
    ),
    matTrunk
  );

  trunk.position.y=1.6*scale;
  g.add(trunk);

  const crown1=new THREE.Mesh(
    new THREE.ConeGeometry(
      2.1*scale,
      3.3*scale,
      8
    ),
    Math.random()>.5?matLeaves:matLeavesDark
  );

  crown1.position.y=4.1*scale;
  g.add(crown1);

  const crown2=new THREE.Mesh(
    new THREE.SphereGeometry(
      1.7*scale,
      7,
      6
    ),
    matLeaves
  );

  crown2.position.y=4.9*scale;
  g.add(crown2);

  g.position.set(x,0,z);
  scene.add(g);
}

function forest(cx,cz,radius,count){

  for(let i=0;i<count;i++){

    const a=Math.random()*Math.PI*2;
    const r=Math.sqrt(Math.random())*radius;

    const x=cx+Math.cos(a)*r;
    const z=cz+Math.sin(a)*r;

    tree(x,z,random(.75,1.3));
  }

  grassPatch(cx,cz,count*2,radius);
}

/* =========================================================
   ROCAS
   ========================================================= */

function rock(x,z,s=1){

  const r=new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      random(.7,1.6)*s,
      0
    ),
    Math.random()>.5?matRock:matRockDark
  );

  r.position.set(
    x,
    random(.4,.8)*s,
    z
  );

  r.rotation.set(
    random(0,1),
    random(0,3),
    random(0,1)
  );

  scene.add(r);
}

/* =========================================================
   CAMINOS
   ========================================================= */

function road(x1,z1,x2,z2,width=16){

  const dx=x2-x1;
  const dz=z2-z1;
  const length=Math.sqrt(dx*dx+dz*dz);

  const r=box(
    width,
    .08,
    length,
    matRoad,
    (x1+x2)/2,
    .04,
    (z1+z2)/2
  );

  r.rotation.y=Math.atan2(dx,dz);

  /* línea central */
  const line=box(
    .35,
    .09,
    length*.94,
    matRoadLine,
    (x1+x2)/2,
    .1,
    (z1+z2)/2
  );

  line.rotation.y=Math.atan2(dx,dz);
}

/* =========================================================
   CASAS
   ========================================================= */

function house(x,z,w=18,d=14){

  box(w,4,d,matHouse,x,2,z);

  /* techo */
  const roof=box(
    w+2,
    2,
    d+2,
    matRoof,
    x,
    5,
    z
  );

  roof.rotation.y=Math.PI/4;

  /* puerta */
  box(
    2.4,
    3,
    .18,
    matHouseDark,
    x,
    1.5,
    z+d/2+.1
  );

  /* ventanas */
  box(
    3,
    2,
    .18,
    matWindow,
    x-w/3,
    2.3,
    z+d/2+.11
  );

  box(
    3,
    2,
    .18,
    matWindow,
    x+w/3,
    2.3,
    z+d/2+.11
  );

  /* chimenea */
  box(
    1.5,
    3,
    1.5,
    matHouseDark,
    x+w*.25,
    6,
    z
  );
}

/* =========================================================
   FÁBRICA
   ========================================================= */

function factory(x,z){

  box(55,12,35,matMetal,x,6,z);

  for(let i=-2;i<=2;i++){

    cylinder(
      3,
      25,
      matMetal,
      x+i*9,
      12,
      z-25,
      10
    );
  }

  box(
    10,
    7,
    .3,
    matHouseDark,
    x,
    3.5,
    z+17.7
  );
}

/* =========================================================
   GASOLINERA
   ========================================================= */

function gasStation(x,z){

  box(30,1,22,matRoad,x,.5,z);

  box(
    24,
    7,
    3,
    matHouse,
    x,
    7,
    z
  );

  for(let i=-1;i<=1;i++){

    cylinder(
      .35,
      7,
      matMetal,
      x+i*9,
      3.5,
      z
    );
  }

  box(
    24,
    1,
    22,
    matRoof,
    x,
    10.5,
    z
  );

  for(let i=-1;i<=1;i++){

    box(
      2,
      3,
      2,
      matMetal,
      x+i*8,
      1.5,
      z+8
    );
  }
}

/* =========================================================
   LAGOS
   ========================================================= */

function lake(x,z,rx,rz){

  const water=new THREE.Mesh(
    new THREE.CylinderGeometry(
      1,
      1,
      .08,
      48
    ),
    matWater
  );

  water.scale.set(rx,1,rz);
  water.position.set(x,.025,z);

  scene.add(water);

  /* orilla */
  const shore=new THREE.Mesh(
    new THREE.RingGeometry(
      1,
      1.08,
      48
    ),
    matSand
  );

  shore.scale.set(rx,1,rz);
  shore.rotation.x=-Math.PI/2;
  shore.position.set(x,.012,z);

  scene.add(shore);
}

/* =========================================================
   RÍO
   ========================================================= */

function river(points){

  for(let i=0;i<points.length-1;i++){

    const a=points[i];
    const b=points[i+1];

    const dx=b.x-a.x;
    const dz=b.z-a.z;

    const len=Math.sqrt(dx*dx+dz*dz);

    const r=box(
      24,
      .07,
      len,
      matWater,
      (a.x+b.x)/2,
      .025,
      (a.z+b.z)/2
    );

    r.rotation.y=Math.atan2(dx,dz);
  }
}

/* =========================================================
   PUENTES
   ========================================================= */

function bridge(x,z,rot=0){

  const b=box(
    42,
    1.2,
    14,
    matHouseDark,
    x,
    .7,
    z
  );

  b.rotation.y=rot;

  for(let i=-1;i<=1;i++){

    box(
      2,
      5,
      2,
      matMetal,
      x+i*15,
      -1.5,
      z
    );
  }
}

/* =========================================================
   LUGARES
   ========================================================= */

const places=[
  {name:"Base",x:0,z:0},
  {name:"Casa Abandonada",x:450,z:-250},
  {name:"Granja Verde",x:-700,z:700},
  {name:"Bosque del Norte",x:700,z:-2100},
  {name:"Lago Perdido",x:-1800,z:1000},
  {name:"Ruinas Antiguas",x:-2200,z:-900},
  {name:"Ciudad Vieja",x:2600,z:-2200},
  {name:"Mina Vieja",x:2200,z:1900},
  {name:"Bosque Negro",x:-3000,z:2500},
  {name:"Lago Escondido",x:3000,z:1200},
  {name:"Pueblo Abandonado",x:3600,z:-500},
  {name:"Fábrica",x:-3000,z:-2300},
  {name:"Gasolinera Abandonada",x:-1400,z:-2600},
  {name:"Autopista Destruida",x:0,z:-3000},
  {name:"Puente Viejo",x:-700,z:-1600},
  {name:"Campamento Abandonado",x:1400,z:3000},
  {name:"Cantera",x:3300,z:2800},
  {name:"Campo de Cultivo",x:-2500,z:2200},
  {name:"Fuerte Abandonado",x:-3800,z:500},
  {name:"Hospital Abandonado",x:3000,z:-3000},
  {name:"Zona Industrial",x:3800,z:-2200},
  {name:"Estación de Tren",x:-3600,z:-1800},
  {name:"Cementerio",x:1200,z:-3600},
  {name:"Reserva Forestal",x:2500,z:3500},
  {name:"Montañas",x:-3300,z:3000},
  {name:"Cueva Profunda",x:-3400,z:3300}
];

/* =========================================================
   BASE
   ========================================================= */

house(0,0,22,18);

box(
  .3,
  8,
  .3,
  matHouseDark,
  0,
  4,
  -13
);

box(
  5,
  2.5,
  .12,
  matFlag,
  2.3,
  7,
  -13
);

/* =========================================================
   CASA ABANDONADA
   ========================================================= */

house(450,-250,22,17);

for(let i=0;i<7;i++){
  rock(
    450+random(-30,30),
    -250+random(-25,25),
    random(.7,1.3)
  );
}

/* =========================================================
   GRANJA
   ========================================================= */

house(-700,700,25,18);

for(let i=0;i<8;i++){

  box(
    120,
    .08,
    1,
    matGrass,
    -760+i*18,
    .08,
    750
  );
}

/* =========================================================
   BOSQUE NORTE
   ========================================================= */

forest(700,-2100,500,120);

/* =========================================================
   LAGO PERDIDO
   ========================================================= */

lake(-1800,1000,220,150);
forest(-1800,1000,430,65);

/* =========================================================
   RUINAS
   ========================================================= */

for(let i=0;i<14;i++){

  box(
    random(3,8),
    random(2,7),
    random(3,8),
    matHouseDark,
    -2200+random(-180,180),
    random(1,4),
    -900+random(-150,150)
  );
}

/* =========================================================
   CIUDAD VIEJA
   ========================================================= */

for(let x=-1;x<=1;x++){
  for(let z=-1;z<=1;z++){

    house(
      2600+x*100,
      -2200+z*100,
      30,
      22
    );
  }
}

road(2400,-2200,2800,-2200,20);
road(2600,-2400,2600,-2000,20);

/* =========================================================
   MINA
   ========================================================= */

for(let i=0;i<30;i++){

  rock(
    2200+random(-220,220),
    1900+random(-180,180),
    random(1,2.3)
  );
}

box(
  30,
  15,
  18,
  matRockDark,
  2200,
  7,
  1900
);

/* =========================================================
   BOSQUE NEGRO
   ========================================================= */

forest(-3000,2500,600,150);

/* =========================================================
   LAGO ESCONDIDO
   ========================================================= */

lake(3000,1200,180,120);
forest(3000,1200,360,60);

/* =========================================================
   PUEBLO
   ========================================================= */

for(let i=0;i<7;i++){

  house(
    3600+random(-250,250),
    -500+random(-200,200),
    20,
    16
  );
}

/* =========================================================
   FÁBRICA
   ========================================================= */

factory(-3000,-2300);

/* =========================================================
   GASOLINERA
   ========================================================= */

gasStation(-1400,-2600);

/* =========================================================
   AUTOPISTA
   ========================================================= */

road(
  -4000,
  -3000,
  4000,
  -3000,
  30
);

/* =========================================================
   PUENTE
   ========================================================= */

bridge(-700,-1600,Math.PI/2);

/* =========================================================
   CAMPAMENTO
   ========================================================= */

for(let i=0;i<5;i++){

  house(
    1400+random(-120,120),
    3000+random(-120,120),
    15,
    12
  );
}

cylinder(
  2,
  .7,
  matHouseDark,
  1400,
  .35,
  3000,
  12
);

/* =========================================================
   CANTERA
   ========================================================= */

for(let i=0;i<50;i++){

  rock(
    3300+random(-350,350),
    2800+random(-300,300),
    random(.8,2.2)
  );
}

/* =========================================================
   CAMPO DE CULTIVO
   ========================================================= */

for(let i=0;i<15;i++){

  box(
    180,
    .05,
    2,
    matHouseDark,
    -2500+random(-300,300),
    .06,
    2200+random(-250,250)
  );
}

/* =========================================================
   FUERTE
   ========================================================= */

for(let i=0;i<8;i++){

  box(
    18,
    10,
    5,
    matRockDark,
    -3800+random(-100,100),
    5,
    500+random(-100,100)
  );
}

/* =========================================================
   HOSPITAL
   ========================================================= */

box(
  60,
  20,
  40,
  matHouse,
  3000,
  10,
  -3000
);

for(let y=5;y<=15;y+=5){

  for(let x=-20;x<=20;x+=10){

    box(
      5,
      3,
      .2,
      matWindow,
      3000+x,
      y,
      -3020
    );
  }
}

/* =========================================================
   ZONA INDUSTRIAL
   ========================================================= */

for(let i=0;i<6;i++){

  box(
    55,
    10,
    35,
    matMetal,
    3800+random(-180,180),
    5,
    -2200+random(-180,180)
  );
}

/* =========================================================
   ESTACIÓN DE TREN
   ========================================================= */

box(
  65,
  9,
  20,
  matHouse,
  -3600,
  4.5,
  -1800
);

road(
  -3900,
  -1830,
  -3300,
  -1830,
  12
);

/* =========================================================
   CEMENTERIO
   ========================================================= */

for(let i=0;i<30;i++){

  box(
    1,
    2,
    .35,
    matRockDark,
    1200+random(-180,180),
    1,
    -3600+random(-150,150)
  );
}

/* =========================================================
   RESERVA FORESTAL
   ========================================================= */

forest(2500,3500,650,170);

/* =========================================================
   MONTAÑAS
   ========================================================= */

for(let i=0;i<25;i++){

  const x=-3300+random(-500,500);
  const z=3000+random(-400,400);

  const m=new THREE.Mesh(
    new THREE.ConeGeometry(
      random(20,60),
      random(40,120),
      7
    ),
    matRockDark
  );

  m.position.set(x,m.geometry.parameters.height/2,z);

  scene.add(m);
}

/* =========================================================
   CUEVA
   ========================================================= */

box(
  35,
  20,
  18,
  matRockDark,
  -3400,
  10,
  3300
);

box(
  20,
  14,
  20,
  new THREE.MeshLambertMaterial({color:0x111111}),
  -3400,
  7,
  3288
);

/* =========================================================
   RÍO SEPARADO DE LAS ZONAS
   ========================================================= */

river([
  {x:-4500,z:800},
  {x:-3800,z:700},
  {x:-3000,z:600},
  {x:-2200,z:400},
  {x:-1400,z:250},
  {x:-700,z:100},
  {x:0,z:-100}
]);

/* =========================================================

/* =========================================================
   JOYSTICK
   ========================================================= */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyActive=false;

function joystickMove(clientX,clientY){

  const r=joy.getBoundingClientRect();

  let dx=clientX-(r.left+r.width/2);
  let dy=clientY-(r.top+r.height/2);

  const max=55;

  const length=Math.sqrt(dx*dx+dy*dy);

  if(length>max){

    dx=dx/length*max;
    dy=dy/length*max;
  }

  stick.style.left=(41+dx)+"px";
  stick.style.top=(41+dy)+"px";

  joyX=dx/max;
  joyY=dy/max;
}

joy.addEventListener("pointerdown",e=>{
  joyActive=true;
  joy.setPointerCapture(e.pointerId);
  joystickMove(e.clientX,e.clientY);
});

joy.addEventListener("pointermove",e=>{
  if(joyActive){
    joystickMove(e.clientX,e.clientY);
  }
});

joy.addEventListener("pointerup",()=>{
  joyActive=false;
  joyX=0;
  joyY=0;
  stick.style.left="41px";
  stick.style.top="41px";
});

joy.addEventListener("pointercancel",()=>{
  joyActive=false;
  joyX=0;
  joyY=0;
  stick.style.left="41px";
  stick.style.top="41px";
});

/* =========================================================
   CÁMARA
   ========================================================= */

let dragging=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener("pointermove",e=>{

  if(!dragging)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  player.yaw-=dx*.006;
  player.pitch-=dy*.004;

  player.pitch=Math.max(
    -1.2,
    Math.min(.7,player.pitch)
  );
});

renderer.domElement.addEventListener("pointerup",()=>{
  dragging=false;
});

renderer.domElement.addEventListener("pointercancel",()=>{
  dragging=false;
});

/* =========================================================
   MOVIMIENTO
   ========================================================= */

function updateMovement(dt){

  /*
    CORRECCIÓN V12.1:

    joystick arriba = joyY negativo
    forward positivo = adelante

    Con yaw=0:
    arriba -> Z disminuye
    abajo -> Z aumenta
    derecha -> X aumenta
    izquierda -> X disminuye
  */

  const forward=-joyY;
  const strafe=joyX;

  const moveX=
    Math.sin(player.yaw)*forward+
    Math.cos(player.yaw)*strafe;

  const moveZ=
    -Math.cos(player.yaw)*forward+
    Math.sin(player.yaw)*strafe;

  const moving=
    Math.abs(moveX)>.03 ||
    Math.abs(moveZ)>.03;

  let speed=player.speed;

  if(player.running && moving && player.stamina>0){

    speed=7.5;

    player.stamina-=28*dt;

  }else{

    player.stamina+=18*dt;
  }

  player.stamina=Math.max(
    0,
    Math.min(100,player.stamina)
  );

  if(moving){

    player.x+=moveX*speed*dt;
    player.z+=moveZ*speed*dt;

    character.rotation.y=
      Math.atan2(moveX,moveZ);
  }

  /* límites del mapa */

  player.x=Math.max(
    -HALF+30,
    Math.min(HALF-30,player.x)
  );

  player.z=Math.max(
    -HALF+30,
    Math.min(HALF-30,player.z)
  );

  /* gravedad */

  player.vertical-=20*dt;

  player.y+=player.vertical*dt;

  if(player.y<0){

    player.y=0;
    player.vertical=0;
  }
}

/* =========================================================
   MAPA
   ========================================================= */

const mapBox=document.getElementById("mapBox");
const mapCanvas=document.getElementById("map");
const ctx=mapCanvas.getContext("2d");

const MAP_SCALE=12.5;
const MAP_CENTER=400;

function mapX(x){
  return MAP_CENTER+x/MAP_SCALE;
}

function mapY(z){
  return MAP_CENTER+z/MAP_SCALE;
}

function drawMap(){

  ctx.clearRect(
    0,
    0,
    800,
    800
  );

  ctx.fillStyle="#314431";
  ctx.fillRect(0,0,800,800);

  /* cuadrícula */

  ctx.strokeStyle="#ffffff10";
  ctx.lineWidth=1;

  for(let i=0;i<=800;i+=50){

    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,800);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(800,i);
    ctx.stroke();
  }

  /* lugares */

  for(const p of places){

    const x=mapX(p.x);
    const y=mapY(p.z);

    if(x<0||x>800||y<0||y>800)continue;

    const d=dist(
      player.x,
      player.z,
      p.x,
      p.z
    );

    const discovered=
      p.name==="Base" ||
      d<90;

    ctx.fillStyle=
      discovered ? "#d8bd54" : "#777";

    ctx.beginPath();
    ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fill();

    if(discovered){

      ctx.fillStyle="#fff";
      ctx.font="12px Arial";
      ctx.fillText(
        p.name,
        x+10,
        y+4
      );
    }else{

      ctx.fillStyle="#aaa";
      ctx.font="12px Arial";
      ctx.fillText(
        "???",
        x+10,
        y+4
      );
    }
  }

  /* jugador */

  const px=mapX(player.x);
  const py=mapY(player.z);

  ctx.fillStyle="#ff3333";

  ctx.beginPath();
  ctx.arc(px,py,9,0,Math.PI*2);
  ctx.fill();

  /* dirección */

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(px,py);

  ctx.lineTo(
    px+Math.sin(player.yaw)*25,
    py-Math.cos(player.yaw)*25
  );

  ctx.stroke();

  /* base */

  ctx.fillStyle="#ff2020";
  ctx.fillRect(
    MAP_CENTER-6,
    MAP_CENTER-6,
    12,
    12
  );
}

document.getElementById("mapBtn").addEventListener("click",()=>{

  mapBox.style.display="block";
  drawMap();
});

document.getElementById("closeMap").addEventListener("click",()=>{

  mapBox.style.display="none";
});

/* =========================================================
   DESCUBRIMIENTO
   ========================================================= */

const discovered={};

function checkPlaces(){

  let nearest=places[0];
  let nearestD=Infinity;

  for(const p of places){

    const d=dist(
      player.x,
      player.z,
      p.x,
      p.z
    );

    if(d<nearestD){

      nearestD=d;
      nearest=p;
    }

    if(d<90 && !discovered[p.name]){

      discovered[p.name]=true;

      showMessage(
        "📍 DESCUBRISTE: "+p.name
      );
    }
  }

  document.getElementById("placeName").textContent=
    nearestD<120 ? nearest.name : "Zona desconocida";

  document.getElementById("distance").textContent=
    formatDistance(
      dist(
        player.x,
        player.z,
        0,
        0
      )
    );
}

function formatDistance(d){

  if(d<1000){

    return Math.round(d)+" m";
  }

  return (d/1000).toFixed(1)+" km";
}

/* =========================================================
   SUPERVIVENCIA
   ========================================================= */

let hp=100;
let food=100;
let water=100;

let survivalTimer=0;

function survival(dt){

  survivalTimer+=dt;

  if(survivalTimer>10){

    survivalTimer=0;

    food=Math.max(
      0,
      food-.5
    );

    water=Math.max(
      0,
      water-.8
    );

    if(food<=0 || water<=0){

      hp=Math.max(
        0,
        hp-1
      );
    }
  }

  document.getElementById("hp").textContent=
    Math.round(hp);

  document.getElementById("food").textContent=
    Math.round(food);

  document.getElementById("water").textContent=
    Math.round(water);

  document.getElementById("stamina").textContent=
    Math.round(player.stamina);
}

/* =========================================================
   ANIMACIÓN PERSONA
   ========================================================= */

let walkTime=0;

function animateCharacter(dt){

  const moving=
    Math.abs(joyX)>.05 ||
    Math.abs(joyY)>.05;

  if(moving){

    walkTime+=dt*9;

    legL.rotation.x=
      Math.sin(walkTime)*.45;

    legR.rotation.x=
      -Math.sin(walkTime)*.45;

    armL.rotation.x=
      -Math.sin(walkTime)*.35;

    armR.rotation.x=
      Math.sin(walkTime)*.35;

  }else{

    legL.rotation.x*=.8;
    legR.rotation.x*=.8;
    armL.rotation.x*=.8;
    armR.rotation.x*=.8;
  }
}

/* =========================================================
   CÁMARA
   ========================================================= */

function updateCamera(){

  if(firstPerson){

    camera.position.set(
      player.x,
      player.y+1.65,
      player.z
    );

    camera.rotation.order="YXZ";

    camera.rotation.y=player.yaw;
    camera.rotation.x=player.pitch;

  }else{

    const distanceBack=7;

    const cx=
      player.x-
      Math.sin(player.yaw)*distanceBack;

    const cz=
      player.z+
      Math.cos(player.yaw)*distanceBack;

    camera.position.set(
      cx,
      player.y+3.8,
      cz
    );

    camera.lookAt(
      player.x,
      player.y+1.3,
      player.z
    );
  }

  character.position.set(
    player.x,
    player.y,
    player.z
  );
}

/* =========================================================
   CICLO DÍA/NOCHE SIMPLE
   ========================================================= */

let time=0;

function dayNight(dt){

  time+=dt*.015;

  const sunHeight=
    Math.sin(time);

  const light=
    .45+
    Math.max(0,sunHeight)*1.2;

  sun.intensity=light;

  const sky=
    new THREE.Color();

  if(sunHeight<0){

    sky.set(0x162235);

  }else{

    sky.set(0x8db3c7);
  }

  scene.background=sky;
  scene.fog.color.copy(sky);
}

/* =========================================================
   LOOP
   ========================================================= */

let last=performance.now();

function loop(now){

  requestAnimationFrame(loop);

  const dt=Math.min(
    .05,
    (now-last)/1000
  );

  last=now;

  updateMovement(dt);
  animateCharacter(dt);
  updateCamera();
  survival(dt);
  dayNight(dt);
  checkPlaces();

  renderer.render(
    scene,
    camera
  );
}

requestAnimationFrame(loop);

/* =========================================================
   RESIZE
   ========================================================= */

addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});

/* =========================================================
   INICIO
   ========================================================= */

character.visible=false;

showMessage(

);
