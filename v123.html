/* =========================================================
   SUELO
========================================================= */

/* =========================================================
   COLLIDERS
========================================================= */

const colliders=[];

function addCollider(x,z,w,d){
  colliders.push({
    minX:x-w/2,
    maxX:x+w/2,
    minZ:z-d/2,
    maxZ:z+d/2
  });
}

function collision(x,z,r=.65){

  for(const c of colliders){

    if(
      x+r>c.minX &&
      x-r<c.maxX &&
      z+r>c.minZ &&
      z-r<c.maxZ
    ){
      return true;
    }
  }

  return false;
}


/* =========================================================
   CUBOS
========================================================= */

function box(w,h,d,material,x,y,z){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  m.position.set(x,y,z);
  scene.add(m);

  return m;
}


/* =========================================================
   ÁRBOLES
========================================================= */

function tree(x,z,s=1){

  box(
    0.8*s,
    5*s,
    0.8*s,
    matTrunk,
    x,
    2.5*s,
    z
  );

  const crown=new THREE.Mesh(
    new THREE.ConeGeometry(
      3.1*s,
      6*s,
      7
    ),
    matTree
  );

  crown.position.set(
    x,
    7*s,
    z
  );

  scene.add(crown);
}


/* =========================================================
   CASA
   - paredes reales
   - puerta sólida
   - ventanas sin vidrio
   - marco de madera
========================================================= */

function makeWindowWallX(
  x,
  z,
  width,
  height,
  windowCenter,
  windowWidth=4,
  bottom=1.15
){

  const top=bottom+2.0;

  // parte inferior
  box(
    width,
    bottom,
    .5,
    matWall,
    x,
    bottom/2,
    z
  );

  addCollider(x,z,width,.5);

  // parte superior
  box(
    width,
    height-top,
    .5,
    matWall,
    x,
    top+(height-top)/2,
    z
  );

  addCollider(
    x,
    z,
    width,
    .5
  );

  // lado izquierdo del hueco
  const leftWidth=
    windowCenter-windowWidth/2 + width/2;

  if(leftWidth>0){

    const lx=
      x-width/2+leftWidth/2;

    box(
      leftWidth,
      top-bottom,
      .5,
      matWall,
      lx,
      bottom+(top-bottom)/2,
      z
    );

    addCollider(
      lx,
      z,
      leftWidth,
      .5
    );
  }

  // lado derecho del hueco
  const rightWidth=
    width-(windowCenter-windowWidth/2+width/2)-windowWidth;

  if(rightWidth>0){

    const rx=
      x+width/2-rightWidth/2;

    box(
      rightWidth,
      top-bottom,
      .5,
      matWall,
      rx,
      bottom+(top-bottom)/2,
      z
    );

    addCollider(
      rx,
      z,
      rightWidth,
      .5
    );
  }

  // marco horizontal inferior
  box(
    windowWidth+.35,
    .18,
    .72,
    matWindowFrame,
    x+windowCenter,
    bottom,
    z
  );

  // marco horizontal superior
  box(
    windowWidth+.35,
    .18,
    .72,
    matWindowFrame,
    x+windowCenter,
    top,
    z
  );

  // marco vertical izquierdo
  box(
    .18,
    top-bottom,
    .72,
    matWindowFrame,
    x+windowCenter-windowWidth/2,
    bottom+(top-bottom)/2,
    z
  );

  // marco vertical derecho
  box(
    .18,
    top-bottom,
    .72,
    matWindowFrame,
    x+windowCenter+windowWidth/2,
    bottom+(top-bottom)/2,
    z
  );

  // cruz de madera
  box(
    windowWidth,
    .16,
    .65,
    matWindowFrame,
    x+windowCenter,
    bottom+(top-bottom)/2,
    z
  );

  box(
    .16,
    top-bottom,
    .65,
    matWindowFrame,
    x+windowCenter,
    bottom+(top-bottom)/2,
    z
  );
}


/* =========================================================
   PARED CON VENTANA EN Z
========================================================= */

function makeWindowWallZ(
  x,
  z,
  width,
  height,
  windowCenter,
  windowWidth=4,
  bottom=1.15
){

  const top=bottom+2;

  // inferior
  box(
    .5,
    bottom,
    width,
    matWall,
    x,
    bottom/2,
    z
  );

  addCollider(x,z,.5,width);

  // superior
  box(
    .5,
    height-top,
    width,
    matWall,
    x,
    top+(height-top)/2,
    z
  );

  addCollider(x,z,.5,width);

  const leftWidth=
    windowCenter-windowWidth/2+width/2;

  if(leftWidth>0){

    const lz=
      z-width/2+leftWidth/2;

    box(
      .5,
      top-bottom,
      leftWidth,
      matWall,
      x,
      bottom+(top-bottom)/2,
      lz
    );

    addCollider(x,lz,.5,leftWidth);
  }

  const rightWidth=
    width-(windowCenter-windowWidth/2+width/2)-windowWidth;

  if(rightWidth>0){

    const rz=
      z+width/2-rightWidth/2;

    box(
      .5,
      top-bottom,
      rightWidth,
      matWall,
      x,
      bottom+(top-bottom)/2,
      rz
    );

    addCollider(x,rz,.5,rightWidth);
  }

  // marco
  box(
    .72,
    .18,
    windowWidth+.35,
    matWindowFrame,
    x,
    bottom,
    z+windowCenter
  );

  box(
    .72,
    .18,
    windowWidth+.35,
    matWindowFrame,
    x,
    top,
    z+windowCenter
  );

  box(
    .72,
    top-bottom,
    .18,
    matWindowFrame,
    x,
    bottom+(top-bottom)/2,
    z+windowCenter-windowWidth/2
  );

  box(
    .72,
    top-bottom,
    .18,
    matWindowFrame,
    x,
    bottom+(top-bottom)/2,
    z+windowCenter+windowWidth/2
  );

  // cruz
  box(
    .65,
    .16,
    windowWidth,
    matWindowFrame,
    x,
    bottom+(top-bottom)/2,
    z+windowCenter
  );

  box(
    .65,
    top-bottom,
    .16,
    matWindowFrame,
    x,
    bottom+(top-bottom)/2,
    z+windowCenter
  );
}


/* =========================================================
   CASA
========================================================= */

function house(x,z){

  const W=24;
  const D=18;
  const H=4;

  // piso
  box(
    W,
    .25,
    D,
    matWoodDark,
    x,
    .12,
    z
  );

  // -------------------------------------------------------
  // FRENTE
  // puerta centrada y SOLIDA
  // -------------------------------------------------------

  const doorW=3.2;

  // izquierda de puerta
  box(
    (W-doorW)/2,
    H,
    .5,
    matWall,
    x-W/4-doorW/4,
    H/2,
    z-D/2
  );

  addCollider(
    x-W/4-doorW/4,
    z-D/2,
    (W-doorW)/2,
    .5
  );

  // derecha de puerta
  box(
    (W-doorW)/2,
    H,
    .5,
    matWall,
    x+W/4+doorW/4,
    H/2,
    z-D/2
  );

  addCollider(
    x+W/4+doorW/4,
    z-D/2,
    (W-doorW)/2,
    .5
  );

  // puerta sólida
  box(
    doorW,
    3.8,
    .65,
    matWood,
    x,
    1.9,
    z-D/2
  );

  addCollider(
    x,
    z-D/2,
    doorW,
    .65
  );

  // marco de puerta
  box(
    .25,
    4.1,
    .75,
    matWoodDark,
    x-doorW/2,
    2.05,
    z-D/2
  );

  box(
    .25,
    4.1,
    .75,
    matWoodDark,
    x+doorW/2,
    2.05,
    z-D/2
  );

  box(
    doorW+.5,
    .25,
    .75,
    matWoodDark,
    x,
    4,
    z-D/2
  );

  // -------------------------------------------------------
  // PARTE TRASERA CON VENTANA
  // -------------------------------------------------------

  makeWindowWallX(
    x,
    z+D/2,
    W,
    H,
    0,
    4
  );

  // -------------------------------------------------------
  // LADO IZQUIERDO
  // -------------------------------------------------------

  makeWindowWallZ(
    x-W/2,
    z,
    D,
    H,
    0,
    4
  );

  // -------------------------------------------------------
  // LADO DERECHO
  // -------------------------------------------------------

  makeWindowWallZ(
    x+W/2,
    z,
    D,
    H,
    0,
    4
  );

  // -------------------------------------------------------
  // TECHO
  // -------------------------------------------------------

  const roof=box(
    W+2,
    .45,
    D+2,
    matRoof,
    x,
    H+.25,
    z
  );

  // pequeño techo frontal
  box(
    W+2.5,
    .35,
    2.5,
    matRoof,
    x,
    H+.15,
    z-D/2-1
  );

}

/* =========================================================
   POZOS / RUINAS
========================================================= */

function ruins(x,z){

  for(let i=0;i<6;i++){

    const a=i*Math.PI/3;
    const r=13;

    const px=x+Math.cos(a)*r;
    const pz=z+Math.sin(a)*r;

    box(
      5,
      3+Math.random()*3,
      4,
      matStone,
      px,
      2,
      pz
    );

    addCollider(
      px,
      pz,
      5,
      4
    );
  }
}

ruins(-2200,-900);

========================================================= */

/* =========================================================
   CARRETERAS
========================================================= */

function road(x,z,w,d){

  box(
    w,
    .08,
    d,
    matRoad,
    x,
    .05,
    z
  );

  // líneas centrales
  const vertical=d>w;

  const length=vertical?d:w;
  const count=Math.floor(length/30);

  for(let i=0;i<count;i++){

    const offset=
      -length/2+15+i*30;

    if(vertical){

      box(
        .7,
        .1,
        14,
        matRoadLine,
        x,
        .11,
        z+offset
      );

    }else{

      box(
        14,
        .1,
        .7,
        matRoadLine,
        x+offset,
        .11,
        z
      );
    }
  }
}

    );

    box(

      x+48,

    );
  }
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;

let joyActive=false;
let joyPointer=null;

function updateJoystick(clientX,clientY){

  const rect=joystick.getBoundingClientRect();

  let x=clientX-(rect.left+rect.width/2);
  let y=clientY-(rect.top+rect.height/2);

  const max=48;

  const len=Math.sqrt(x*x+y*y);

  if(len>max){

    x=x/len*max;
    y=y/len*max;
  }

  joyX=x/max;
  joyY=y/max;

  stick.style.transform=
    `translate(${x}px,${y}px)`;
}

function resetJoystick(){

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0px,0px)";

  joyActive=false;
  joyPointer=null;
}

joystick.addEventListener("pointerdown",e=>{

  joyActive=true;
  joyPointer=e.pointerId;

  joystick.setPointerCapture(e.pointerId);

  updateJoystick(
    e.clientX,
    e.clientY
  );
});

joystick.addEventListener("pointermove",e=>{

  if(!joyActive || e.pointerId!==joyPointer)return;

  updateJoystick(
    e.clientX,
    e.clientY
  );
});

joystick.addEventListener("pointerup",e=>{

  if(e.pointerId===joyPointer){
    resetJoystick();
  }
});

joystick.addEventListener("pointercancel",resetJoystick);


/* =========================================================
   CÁMARA TÁCTIL
   IMPORTANTE:
   tocar/mover pantalla NO cambia player.yaw
========================================================= */

let lookActive=false;
let lookPointer=null;

let lastLookX=0;
let lastLookY=0;

renderer.domElement.addEventListener("pointerdown",e=>{

  // si toca el joystick, no mirar
  const jrect=joystick.getBoundingClientRect();

  if(
    e.clientX>=jrect.left &&
    e.clientX<=jrect.right &&
    e.clientY>=jrect.top &&
    e.clientY<=jrect.bottom
  ){
    return;
  }

  lookActive=true;
  lookPointer=e.pointerId;

  lastLookX=e.clientX;
  lastLookY=e.clientY;

  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove",e=>{

  if(!lookActive || e.pointerId!==lookPointer)return;

  const dx=e.clientX-lastLookX;
  const dy=e.clientY-lastLookY;

  lastLookX=e.clientX;
  lastLookY=e.clientY;

  cameraYaw-=dx*.006;
  cameraPitch-=dy*.005;

  cameraPitch=
    Math.max(
      -1.25,
      Math.min(1.15,cameraPitch)
    );
});

renderer.domElement.addEventListener("pointerup",e=>{

  if(e.pointerId===lookPointer){

    lookActive=false;
    lookPointer=null;
  }
});

renderer.domElement.addEventListener("pointercancel",e=>{

  if(e.pointerId===lookPointer){

    lookActive=false;
    lookPointer=null;
  }
});


/* =========================================================
   MOVIMIENTO
   RELATIVO A CÁMARA
========================================================= */

function updateMovement(dt){

  const inputX=joyX;
  const inputY=joyY;

  const magnitude=Math.sqrt(
    inputX*inputX+
    inputY*inputY
  );

  if(magnitude<.08){

    player.speed=0;
    player.moving=false;
    return;
  }

  // arriba del joystick = adelante
  const forward=-inputY;
  const right=inputX;

  // movimiento según cámara
  const dx=
    Math.sin(cameraYaw)*forward+
    Math.cos(cameraYaw)*right;

  const dz=
    -Math.cos(cameraYaw)*forward+
    Math.sin(cameraYaw)*right;

  const len=Math.sqrt(dx*dx+dz*dz);

  if(len===0)return;

  const nx=dx/len;
  const nz=dz/len;

  const speed=8*dt;

  const nextX=
    player.x+nx*speed;

  const nextZ=
    player.z+nz*speed;

  // collision independiente por eje
  if(!collision(nextX,player.z,.65)){
    player.x=nextX;
  }

  if(!collision(player.x,nextZ,.65)){
    player.z=nextZ;
  }

  player.speed=8;
  player.moving=true;

  // personaje gira SOLO hacia donde camina
  player.yaw=Math.atan2(nx,nz);

  playerGroup.rotation.y=player.yaw;

  playerGroup.position.x=player.x;
  playerGroup.position.z=player.z;
}


/* =========================================================
   ACTUALIZAR CÁMARA
========================================================= */

function updateCamera(){

  if(!thirdPerson){

    camera.position.set(
      player.x,
      firstHeight,
      player.z
    );

    const targetX=
      camera.position.x+
      Math.sin(cameraYaw)*Math.cos(cameraPitch);

    const targetY=
      camera.position.y+
      Math.sin(cameraPitch);

    const targetZ=
      camera.position.z-
      Math.cos(cameraYaw)*Math.cos(cameraPitch);

    camera.lookAt(
      targetX,
      targetY,
      targetZ
    );

  }else{

    // cámara orbital independiente
    const horizontal=
      Math.cos(cameraPitch)*thirdDistance;

    const cx=
      player.x-
      Math.sin(cameraYaw)*horizontal;

    const cz=
      player.z+
      Math.cos(cameraYaw)*horizontal;

    const cy=
      thirdHeight+
      Math.sin(cameraPitch)*thirdDistance;

    camera.position.set(
      cx,
      cy,
      cz
    );

    camera.lookAt(
      player.x,
      1.7,
      player.z
    );
  }
}


/* =========================================================
   BOTÓN CÁMARA
========================================================= */

const cameraBtn=
  document.getElementById("cameraBtn");

cameraBtn.onclick=()=>{

  thirdPerson=!thirdPerson;

  cameraBtn.textContent=
    thirdPerson
      ?"1ª PERSONA"
      :"3ª PERSONA";
};


/* =========================================================
   DÍA / NOCHE
========================================================= */

let night=false;

const timeBtn=
  document.getElementById("timeBtn");

timeBtn.onclick=()=>{

  night=!night;

  if(night){

    scene.background.set(0x101827);
    scene.fog.color.set(0x101827);

    hemi.intensity=.45;
    sun.intensity=.25;

    timeBtn.textContent="DÍA";

  }else{

    scene.background.set(0x91b4cf);
    scene.fog.color.set(0x91b4cf);

    hemi.intensity=1.8;
    sun.intensity=1.5;

    timeBtn.textContent="NOCHE";
  }
};


/* =========================================================
   MAPA
========================================================= */

const map=document.getElementById("map");
const mapBtn=document.getElementById("mapBtn");
const mapCanvas=document.getElementById("mapCanvas");

mapBtn.onclick=()=>{

  if(map.style.display==="block"){

    map.style.display="none";

  }else{

    map.style.display="block";
    drawMap();
  }
};

function drawMap(){

  const ctx=mapCanvas.getContext("2d");

  const w=mapCanvas.width=
    mapCanvas.clientWidth*devicePixelRatio;

  const h=mapCanvas.height=
    mapCanvas.clientHeight*devicePixelRatio;

  ctx.clearRect(0,0,w,h);

  ctx.fillStyle="#263226";
  ctx.fillRect(0,0,w,h);

  const scale=w/9000;

  function pos(x,z){

    return {
      x:w/2+x*scale,
      y:h/2+z*scale
    };
  }

  const places=[
    [0,0,"Base"],
    [450,-250,"Casa"],
    [-700,700,"Granja"],
    [700,-2100,"Bosque"],
    [-1800,1000,"Lago"],
    [-2200,-900,"Ruinas"],
    [2600,-2200,"Ciudad"],
    [2200,1900,"Mina"],
    [-3000,2500,"Bosque"],
    [3000,1200,"Lago"],
    [3600,-500,"Pueblo"],
    [-3000,-2300,"Fábrica"],
    [-1400,-2600,"Gasolinera"],
    [0,-3000,"Autopista"],
    [-700,-1600,"Puente"],
    [1400,3000,"Campamento"],
    [3300,2800,"Cantera"],
    [-2500,2200,"Cultivo"],
    [-3800,500,"Fuerte"],
    [3000,-3000,"Hospital"],
    [3800,-2200,"Industrial"],
    [-3600,-1800,"Tren"],
    [1200,-3600,"Cementerio"],
    [2500,3500,"Reserva"],
    [-3300,3000,"Montañas"]
  ];

  ctx.font="11px Arial";

  for(const p of places){

    const a=pos(p[0],p[1]);

    ctx.fillStyle=
      p[2]==="Base"
      ?"white"
      :"#d5d5d5";

    ctx.beginPath();
    ctx.arc(
      a.x,
      a.y,
      p[2]==="Base"?6:3,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillText(
      p[2],
      a.x+7,
      a.y+4
    );
  }

  const me=pos(
    player.x,
    player.z
  );

  ctx.fillStyle="#ff3333";

  ctx.beginPath();
  ctx.arc(
    me.x,
    me.y,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   HUD
========================================================= */

const info=document.getElementById("info");

function updateHUD(){

  const dist=Math.sqrt(
    player.x*player.x+
    player.z*player.z
  );

  const time=
    night
    ?"Noche"
    :"Día";

  info.textContent=
    `${time} · Posición ${Math.round(player.x)}, ${Math.round(player.z)} · Distancia base ${Math.round(dist)}m`;
}


/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});


/* =========================================================
   LOOP
========================================================= */

let last=performance.now();

function animate(now){

  requestAnimationFrame(animate);

  const dt=
    Math.min(
      (now-last)/1000,
      .05
    );

  last=now;

  updateMovement(dt);
  updateCamera();
  updateHUD();

  renderer.render(
    scene,
    camera
  );
}

animate(performance.now());


/* =========================================================
   EVITAR ZOOM / SCROLL
========================================================= */

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

</script>
