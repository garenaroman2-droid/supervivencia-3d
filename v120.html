<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D V12.0</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#89aeb8;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud{
  position:fixed;
  left:10px;
  top:10px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.55);
  padding:9px 12px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}

#version{
  color:#aaff9a;
  font-weight:bold;
}

button{
  border:0;
  color:white;
  background:rgba(0,0,0,.65);
  font-weight:bold;
}

#cameraBtn{
  position:fixed;
  right:12px;
  top:12px;
  z-index:30;
  padding:12px;
  border-radius:12px;
}

#mapBtn{
  position:fixed;
  right:12px;
  top:60px;
  z-index:30;
  padding:12px;
  border-radius:12px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:10;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.75);
}

#crosshair:before{
  width:18px;
  height:2px;
  top:8px;
}

#crosshair:after{
  width:2px;
  height:18px;
  left:8px;
}

#joystick{
  position:fixed;
  left:22px;
  bottom:28px;
  width:135px;
  height:135px;
  border-radius:50%;
  z-index:30;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.28);
}

#stick{
  position:absolute;
  left:37px;
  top:37px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.45);
}

#jump{
  position:fixed;
  right:22px;
  bottom:105px;

  height:72px;

}

#run{

#map{

#mapCanvas{
  position:absolute;

  height:min(92vw,500px);
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  border:2px solid #aaa;
}

#closeMap{
  position:absolute;
  right:15px;
  top:15px;
  z-index:5;
  padding:12px 16px;
  border-radius:10px;

</style>

let firstPerson=true;

let yaw=0;
let pitch=-.10;

let joyX=0;
let joyY=0;

let hp=100;
let food=100;

/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(){

  if(firstPerson){

    player.visible=false;

    camera.position.set(
      player.position.x,
      player.position.y+1.63,
      player.position.z
    );

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;

  }else{

    player.visible=true;

    const distance=5.2;

    const target =
      new THREE.Vector3(
        player.position.x-
        Math.sin(yaw)*distance,
        player.position.y+2.6,
        player.position.z-
        Math.cos(yaw)*distance
      );

    camera.position.lerp(
      target,
      .18
    );

    camera.lookAt(
      player.position.x,
      player.position.y+1,
      player.position.z
    );
  }
}


/* =========================================================
   JOYSTICK
   AHORA ES RELATIVO A LA CÁMARA
========================================================= */

const joystick=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");

let joyActive=false;

joystick.addEventListener(
  "pointerdown",
  e=>{

    joyActive=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(joyActive){

      updateJoystick(e);
    }
  }
);

joystick.addEventListener(
  "pointerup",
  ()=>{
    joyActive=false;

    joyX=0;
    joyY=0;

    stick.style.left="37px";
    stick.style.top="37px";
  }
);

function updateJoystick(e){

  const r=
    joystick.getBoundingClientRect();

  let dx=
    e.clientX-
    (r.left+r.width/2);

  let dy=
    e.clientY-
    (r.top+r.height/2);

  const max=43;

  const distance=
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(distance>max){

    dx=
      dx/distance*max;

    dy=
      dy/distance*max;
  }

  joyX=
    dx/max;

  joyY=
    dy/max;

  stick.style.left=
    (37+dx)+"px";

  stick.style.top=
    (37+dy)+"px";
}

    if(grounded){

      velocityY=5.5;
      grounded=false;
    }
  }
);


/* =========================================================
   GIRAR CÁMARA
========================================================= */

let dragging=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.clientX<180 &&
      e.clientY>innerHeight-190
    ){
      return;
    }

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!dragging) return;

    const dx=
      e.clientX-lastX;

    const dy=
      e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    yaw-=dx*.006;

    pitch-=dy*.004;

    pitch=
      Math.max(
        -1.2,
        Math.min(
          .8,
          pitch
        )
      );
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
    dragging=false;
  }
);


/* =========================================================
   CAMBIO DE CÁMARA
========================================================= */

document
.getElementById("cameraBtn")
.addEventListener(
  "click",
  ()=>{

    firstPerson=!firstPerson;

    document

);


/* =========================================================
   LUGARES
========================================================= */

const places=[
  {
    name:"Base",
    x:0,
    z:15,
    radius:40
  },
  {
    name:"Casa Abandonada",
    x:430,
    z:-250,
    radius:70
  },
  {
    name:"Granja Verde",
    x:-650,
    z:700,
    radius:100
  },
  {
    name:"Bosque del Norte",
    x:500,
    z:-1900,
    radius:500
  },
  {
    name:"Lago Perdido",
    x:-1500,
    z:900,
    radius:230
  },
  {
    name:"Ruinas Antiguas",
    x:-1800,
    z:-700,
    radius:150
  },
  {
    name:"Ciudad Vieja",
    x:2200,
    z:-1900,
    radius:500
  },
  {
    name:"Mina Vieja",
    x:1700,
    z:1500,
    radius:180
  }
];


/* =========================================================
   LUGAR MÁS CERCANO
========================================================= */

function updatePlace(){

  let nearest=null;
  let nearestDistance=Infinity;

  for(const p of places){

    const dx=
      player.position.x-p.x;

    const dz=
      player.position.z-p.z;

    const d=
      Math.sqrt(
        dx*dx+
        dz*dz
      );

    if(d<nearestDistance){

      nearestDistance=d;
      nearest=p;
    }
  }


  let text="Explorando";

  if(
    nearest &&
    nearestDistance<=nearest.radius
  ){

    text=
      nearest.name+
      " · "+
      Math.round(nearestDistance)+
      " m";

  }else{

    const baseDistance=
      Math.sqrt(
        player.position.x*
        player.position.x+
        player.position.z*
        player.position.z
      );

    if(baseDistance>=1000){

      text=
        "Explorando · "+
        (baseDistance/1000).toFixed(1)+
        " km de la base";

    }else{

      text=
        "Explorando · "+
        Math.round(baseDistance)+
        " m de la base";
    }
  }

  document
    .getElementById("place")
    .textContent=text;
}


/* =========================================================
   MAPA
========================================================= */

const map=
  document.getElementById("map");

const canvas=
  document.getElementById("mapCanvas");

const ctx=
  canvas.getContext("2d");

document
.getElementById("mapBtn")
.addEventListener(
  "click",
  ()=>{
    map.style.display="block";
    drawMap();
  }
);

document
.getElementById("closeMap")
.addEventListener(
  "click",
  ()=>{
    map.style.display="none";
  }
);


/* coordenadas mundo → mapa */

function mapX(x){
  return 350+x/10;
}

function mapZ(z){
  return 350+z/10;
}


function drawMap(){

  ctx.clearRect(
    0,
    0,
    700,
    700
  );


  /* fondo */

  ctx.fillStyle="#3c663e";

  ctx.fillRect(
    0,
    0,
    700,
    700
  );


  /* agua */

  ctx.fillStyle="#4c8fa4";

  ctx.beginPath();

  ctx.ellipse(
    mapX(-1500),
    mapZ(900),
    23,
    15,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    mapX(500),
    mapZ(-2800),
    30,
    19,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* caminos */

  ctx.strokeStyle="#8c806c";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    mapX(0),
    mapZ(0)
  );

  ctx.lineTo(
    mapX(2200),
    mapZ(-1900)
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    mapX(0),
    mapZ(0)
  );

  ctx.lineTo(
    mapX(-650),
    mapZ(700)
  );

  ctx.stroke();


  /* lugares */

  for(const p of places){

    let color="#777";

    if(p.name==="Base"){
      color="#e33";
    }

    if(
      p.name!=="Base"
    ){

      const dx=
        player.position.x-p.x;

      const dz=
        player.position.z-p.z;

      const d=
        Math.sqrt(
          dx*dx+
          dz*dz
        );

      color=
        d<p.radius
        ?"white"
        :"#222";
    }

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
      mapX(p.x),
      mapZ(p.z),
      7,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* nombre solo descubierto */

    const dx=
      player.position.x-p.x;

    const dz=
      player.position.z-p.z;

    const d=
      Math.sqrt(
        dx*dx+
        dz*dz
      );

    if(
      p.name==="Base" ||
      d<p.radius
    ){

      ctx.fillStyle="white";

      ctx.font="12px Arial";

      ctx.fillText(
        p.name,
        mapX(p.x)+10,
        mapZ(p.z)+4
      );

    }else{

      ctx.fillStyle="#bbb";

      ctx.font="12px Arial";

      ctx.fillText(
        "???",
        mapX(p.x)+10,
        mapZ(p.z)+4
      );
    }
  }


  /* jugador */

  ctx.fillStyle="#00ff55";

  ctx.beginPath();

  ctx.arc(
    mapX(player.position.x),
    mapZ(player.position.z),
    8,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* dirección */

  ctx.strokeStyle="#00ff55";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    mapX(player.position.x),
    mapZ(player.position.z)
  );

  ctx.lineTo(
    mapX(player.position.x)+
    Math.sin(yaw)*25,

    mapZ(player.position.z)+
    Math.cos(yaw)*25
  );

  ctx.stroke();
}


/* =========================================================
   MOVIMIENTO
   JOYSTICK TOTALMENTE RELATIVO A CÁMARA
========================================================= */

const clock=
  new THREE.Clock();

function update(){

  const dt=
    Math.min(
      clock.getDelta(),
      .035
    );


  let speed=
    running
    ?7.8
    :4.5;


  /*
    joyY:
    arriba = -1

    forward = -joyY

    Vector forward de la cámara:
    X = sin(yaw)
    Z = cos(yaw)

    Así el joystick SIEMPRE
    sigue la dirección de la cámara.
  */

  const forward=
    -joyY;

  const strafe=
    joyX;


  let moveX=
    Math.sin(yaw)*forward+
    Math.cos(yaw)*strafe;

  let moveZ=
    Math.cos(yaw)*forward-
    Math.sin(yaw)*strafe;


  const length=
    Math.sqrt(
      moveX*moveX+
      moveZ*moveZ
    );


  if(length>1){

    moveX/=length;
    moveZ/=length;
  }


  if(length>.05){

    player.position.x+=
      moveX*speed*dt;

    player.position.z+=
      moveZ*speed*dt;


    if(!firstPerson){

      player.rotation.y=
        Math.atan2(
          moveX,
          moveZ
        );
    }


    const t=
      performance.now()*.012*
      (running?1.5:1);

    legL.rotation.x=
      Math.sin(t)*.5;

    legR.rotation.x=
      -Math.sin(t)*.5;

    armL.rotation.x=
      -Math.sin(t)*.35;

    armR.rotation.x=
      Math.sin(t)*.35;

  }else{

    legL.rotation.x*=.82;
    legR.rotation.x*=.82;

    armL.rotation.x*=.82;
    armR.rotation.x*=.82;
  }


  /* gravedad */

  velocityY-=15*dt;

  player.position.y+=
    velocityY*dt;

  if(player.position.y<=0){

    player.position.y=0;

    velocityY=0;

    grounded=true;
  }


  /* límites del mundo */

  const limit=
    WORLD/2-30;

  player.position.x=
    Math.max(
      -limit,
      Math.min(
        limit,
        player.position.x
      )
    );

  player.position.z=
    Math.max(
      -limit,
      Math.min(
        limit,
        player.position.z
      )
    );


  /* supervivencia */

  food-=dt*.018;
  water-=dt*.028;

  if(food<0) food=0;
  if(water<0) water=0;

  if(food===0 || water===0){

    hp-=dt*.5;

    if(hp<0) hp=0;
  }


  document
    .getElementById("hp")
    .textContent=
    Math.round(hp);

  document
    .getElementById("food")
    .textContent=
    Math.round(food);

  document
    .getElementById("water")
    .textContent=
    Math.round(water);


  updatePlace();

  updateCamera();
}


/* =========================================================
   DÍA / NOCHE LIVIANO
========================================================= */

let day=0;

function dayNight(){

  day+=.00045;

  const value=
    Math.sin(day)*.5+.5;

  const sky=
    new THREE.Color();

  sky.setHSL(
    .55,
    .23,
    .34+value*.22
  );

  scene.background=sky;
  scene.fog.color=sky;

  hemi.intensity=
    .7+value*.6;

  sun.intensity=
    .5+value*.7;
}


/* =========================================================
   LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  update();

  dayNight();

  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   INICIO
========================================================= */

updateCamera();

animate();

</script>
