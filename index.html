<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D V6</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#juego{
  position:fixed;
  inset:0;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

#info,
#inventario{
  position:fixed;
  top:8px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.65);
  padding:10px;
  border-radius:10px;
  font-size:13px;
  line-height:1.5;
}

#info{
  left:8px;
}

#inventario{
  right:8px;
  min-width:145px;
}

#vidaBox{
  position:fixed;
  top:110px;
  left:8px;
  width:155px;
  z-index:10;
  color:white;
  font-size:12px;
}

.barra{
  width:100%;
  height:12px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
  margin:3px 0 5px;
}

#vida{
  height:100%;
  width:100%;
  background:#e53935;
}

#stamina{
  height:100%;
  width:100%;
  background:#f0c42b;
}

#joystick{
  position:fixed;
  left:22px;
  bottom:22px;
  width:135px;
  height:135px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.25);
  z-index:20;
}

#stick{
  position:absolute;
  width:62px;
  height:62px;
  left:34px;
  top:34px;
  border-radius:50%;
  background:rgba(255,255,255,.38);
}

#botones{
  position:fixed;
  right:16px;
  bottom:18px;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:9px;
}

button{
  border:1px solid rgba(255,255,255,.25);
  border-radius:12px;
  background:rgba(15,15,15,.82);
  color:white;
  padding:14px 17px;
  font-size:14px;
  font-weight:bold;
}

button:active{
  transform:scale(.94);
}

#mensaje{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:185px;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.75);
  padding:10px 15px;
  border-radius:10px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
}

#craft{
  display:none;
  position:fixed;
  z-index:50;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:310px;
  max-width:90%;
  background:rgba(10,10,10,.96);
  color:white;
  border-radius:15px;
  padding:18px;
}

#craft h2{
  margin:0 0 10px;
}

#craft button{
  width:100%;
  margin-top:7px;
}

#cerrar{
  background:#8b2222;
}
</style>
</head>

<body>

<div id="juego"></div>

<div id="info">
<b>SUPERVIVENCIA 3D — V6.0</b><br>
Explorá, recolectá y construí.
</div>

<div id="inventario">
Madera: <span id="madera">0</span><br>
Piedra: <span id="piedra">0</span><br>
Hierro: <span id="hierro">0</span><br>
Herramienta: <span id="herramienta">Mano</span><br>
Durabilidad: <span id="durabilidad">∞</span>
</div>

<div id="vidaBox">
Vida
<div class="barra">
<div id="vida"></div>
</div>

Energía
<div class="barra">
<div id="stamina"></div>
</div>
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<div id="botones">
<button id="golpear">GOLPEAR</button>
<button id="correr">CORRER</button>
<button id="crear">CREAR</button>
</div>

<div id="mensaje"></div>

<div id="craft">

<h2>CREAR HERRAMIENTA</h2>

<button id="crearHachaPiedra">
Hacha de piedra<br>
3 madera + 3 piedra
</button>

<button id="crearPicoPiedra">
Pico de piedra<br>
3 madera + 4 piedra
</button>

<button id="crearHachaHierro">
Hacha de hierro<br>
5 madera + 5 hierro
</button>

<button id="crearPicoHierro">
Pico de hierro<br>
5 madera + 5 hierro
</button>

<button id="cerrar">
CERRAR
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ==========================
ESCENA
========================== */

const escena=new THREE.Scene();

escena.background=
new THREE.Color(0x87b9df);

escena.fog=
new THREE.Fog(
0x87b9df,
35,
130
);

const camara=
new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
.05,
300
);

const renderer=
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document
.getElementById("juego")
.appendChild(renderer.domElement);


/* ==========================
LUZ
========================== */

escena.add(
new THREE.HemisphereLight(
0xffffff,
0x405d35,
1.5
)
);

const sol=
new THREE.DirectionalLight(
0xffffff,
1.7
);

sol.position.set(
30,
60,
20
);

sol.castShadow=true;

escena.add(sol);


/* ==========================
SUELO
========================== */

const suelo=
new THREE.Mesh(
new THREE.PlaneGeometry(
220,
220
),
new THREE.MeshStandardMaterial({
color:0x4f7d3b
})
);

suelo.rotation.x=-Math.PI/2;
suelo.receiveShadow=true;

escena.add(suelo);


/* ==========================
JUGADOR
========================== */

const jugador=
new THREE.Group();

jugador.position.set(
0,
1,
8
);

escena.add(jugador);

jugador.add(camara);

camara.position.set(
0,
1.65,
0
);


/* ==========================
MANO FPS
========================== */

const mano=
new THREE.Group();

mano.position.set(
0.65,
-0.55,
-1.15
);

mano.scale.set(
1.5,
1.5,
1.5
);

camara.add(mano);


/* BRAZO */

const brazo=
new THREE.Mesh(
new THREE.BoxGeometry(
.22,
.65,
.22
),
new THREE.MeshStandardMaterial({
color:0xc98e6a
})
);

brazo.rotation.z=-.25;
brazo.position.y=-.2;

mano.add(brazo);


/* MANO */

const manoMesh=
new THREE.Mesh(
new THREE.SphereGeometry(
.16,
16,
16
),
new THREE.MeshStandardMaterial({
color:0xd39b76
})
);

manoMesh.position.set(
0,
.12,
0
);

mano.add(manoMesh);


/* ==========================
HERRAMIENTA
========================== */

let modeloHerramienta=null;

let herramienta={
nombre:"Mano",
tipo:"mano",
nivel:0,
durabilidad:Infinity,
maxima:Infinity
};


function crearHacha(hierro){

const g=
new THREE.Group();


const mango=
new THREE.Mesh(
new THREE.CylinderGeometry(
.055,
.065,
.85,
10
),
new THREE.MeshStandardMaterial({
color:0x70452a
})
);

mango.position.y=.2;

g.add(mango);


const cabeza=
new THREE.Mesh(
new THREE.BoxGeometry(
.48,
.18,
.12
),
new THREE.MeshStandardMaterial({
color:hierro?0x777777:0x999999,
metalness:hierro?.7:.1,
roughness:.35
})
);

cabeza.position.set(
.18,
.58,
0
);

g.add(cabeza);


const filo=
new THREE.Mesh(
new THREE.BoxGeometry(
.12,
.35,
.12
),
new THREE.MeshStandardMaterial({
color:hierro?0x4d4d4d:0x777777,
metalness:hierro?.8:.1
})
);

filo.position.set(
.39,
.45,
0
);

g.add(filo);


g.rotation.z=-.55;

return g;
}


function crearPico(hierro){

const g=
new THREE.Group();


const mango=
new THREE.Mesh(
new THREE.CylinderGeometry(
.055,
.065,
.9,
10
),
new THREE.MeshStandardMaterial({
color:0x70452a
})
);

g.add(mango);


const cabeza=
new THREE.Mesh(
new THREE.BoxGeometry(
.65,
.14,
.13
),
new THREE.MeshStandardMaterial({
color:hierro?0x666666:0x999999,
metalness:hierro?.7:.1
})
);

cabeza.position.y=.43;

g.add(cabeza);


const punta=
new THREE.Mesh(
new THREE.ConeGeometry(
.09,
.42,
4
),
new THREE.MeshStandardMaterial({
color:hierro?0x444444:0x777777,
metalness:hierro?.8:.1
})
);

punta.rotation.z=Math.PI/2;

punta.position.set(
.45,
.43,
0
);

g.add(punta);


g.rotation.z=-.5;

return g;
}


function actualizarHerramienta(){

if(modeloHerramienta){

mano.remove(
modeloHerramienta
);

modeloHerramienta=null;
}


if(herramienta.tipo==="hacha"){

modeloHerramienta=
crearHacha(
herramienta.nivel>=2
);
}


if(herramienta.tipo==="pico"){

modeloHerramienta=
crearPico(
herramienta.nivel>=2
);
}


if(modeloHerramienta){

modeloHerramienta.position.set(
0,
-0.15,
-0.25
);

modeloHerramienta.rotation.x=-.25;
modeloHerramienta.rotation.y=.15;

modeloHerramienta.scale.set(
1.35,
1.35,
1.35
);

mano.add(
modeloHerramienta
);
}


document.getElementById(
"herramienta"
).textContent=
herramienta.nombre;

document.getElementById(
"durabilidad"
).textContent=
herramienta.durabilidad===Infinity
?"∞"
:Math.ceil(
herramienta.durabilidad
);
}

actualizarHerramienta();


/* ==========================
RECURSOS
========================== */

let recursos={
madera:0,
piedra:0,
hierro:0
};

const objetos=[];


/* ==========================
ÁRBOLES
========================== */

function crearArbol(
x,
z,
dureza
){

const g=
new THREE.Group();

const tronco=
new THREE.Mesh(
new THREE.CylinderGeometry(
.32+.08*dureza,
.45+.1*dureza,
3+.4*dureza,
8
),
new THREE.MeshStandardMaterial({
color:0x684328
})
);

tronco.position.y=1.5;
tronco.castShadow=true;

g.add(tronco);


const copa=
new THREE.Mesh(
new THREE.ConeGeometry(
1.7+.3*dureza,
3.2+.4*dureza,
8
),
new THREE.MeshStandardMaterial({
color:
dureza===1
?0x3f8135
:dureza===2
?0x28682d
:0x174d22
})
);

copa.position.y=3.7;
copa.castShadow=true;

g.add(copa);

g.position.set(
x,
0,
z
);

escena.add(g);

objetos.push({
mesh:g,
tipo:"arbol",
dureza:dureza,
vida:dureza===1?3:dureza===2?6:10,
madera:dureza===1?4:dureza===2?7:12
});
}


/* ==========================
ROCAS
========================== */

function crearRoca(
x,
z,
dureza,
hierro=false
){

const g=
new THREE.Group();

const roca=
new THREE.Mesh(
new THREE.DodecahedronGeometry(
.85+.25*dureza
),
new THREE.MeshStandardMaterial({
color:
hierro
?0x555555
:dureza===1
?0x999999
:dureza===2
?0x777777
:0x4e4e4e
})
);

roca.position.y=.7;
roca.scale.y=.7;
roca.castShadow=true;

g.add(roca);

g.position.set(
x,
0,
z
);

escena.add(g);

objetos.push({
mesh:g,
tipo:hierro?"hierro":"piedra",
dureza:dureza,
vida:dureza===1?3:dureza===2?6:10,
cantidad:dureza===1?3:dureza===2?6:10
});
}


/* ==========================
RAMAS
========================== */

function crearRama(x,z){

const rama=
new THREE.Mesh(
new THREE.CylinderGeometry(
.06,
.08,
1,
7
),
new THREE.MeshStandardMaterial({
color:0x70472c
})
);

rama.rotation.z=.8;

rama.position.set(
x,
.15,
z
);

escena.add(rama);

objetos.push({
mesh:rama,
tipo:"rama",
recogible:true,
cantidad:1
});
}


/* ==========================
PIEDRAS PEQUEÑAS
========================== */

function crearPiedraPequena(x,z){

const piedra=
new THREE.Mesh(
new THREE.DodecahedronGeometry(.18),
new THREE.MeshStandardMaterial({
color:0x999999
})
);

piedra.position.set(
x,
.16,
z
);

escena.add(piedra);

objetos.push({
mesh:piedra,
tipo:"piedraPequena",
recogible:true,
cantidad:1
});
}


/* ==========================
GENERAR MUNDO
========================== */

for(let i=0;i<28;i++){

let x=
(Math.random()-.5)*80;

let z=
(Math.random()-.5)*80;

if(
Math.abs(x)<7 &&
Math.abs(z)<7
){

i--;
continue;
}

let d=
Math.random()<.5
?1
:Math.random()<.75
?2
:3;

crearArbol(
x,
z,
d
);
}


for(let i=0;i<22;i++){

crearRoca(
(Math.random()-.5)*80,
(Math.random()-.5)*80,
Math.floor(
Math.random()*3
)+1
);
}


for(let i=0;i<35;i++){

crearRama(
(Math.random()-.5)*55,
(Math.random()-.5)*55
);

crearPiedraPequena(
(Math.random()-.5)*55,
(Math.random()-.5)*55
);
}


/* ==========================
MENSAJES
========================== */

function mensaje(texto){

const m=
document.getElementById(
"mensaje"
);

m.textContent=texto;
m.style.opacity=1;

clearTimeout(
window.tm
);

window.tm=
setTimeout(()=>{
m.style.opacity=0;
},1600);
}


function actualizarUI(){

document.getElementById(
"madera"
).textContent=
recursos.madera;

document.getElementById(
"piedra"
).textContent=
recursos.piedra;

document.getElementById(
"hierro"
).textContent=
recursos.hierro;

document.getElementById(
"herramienta"
).textContent=
herramienta.nombre;

document.getElementById(
"durabilidad"
).textContent=
herramienta.durabilidad===Infinity
?"∞"
:Math.ceil(
herramienta.durabilidad
);
}


/* ==========================
RECOLECTAR
========================== */

function recogerCercano(){

let objetivo=null;
let menor=2.5;

for(
const o of objetos
){

if(!o.recogible)
continue;

const d=
jugador.position.distanceTo(
o.mesh.position
);

if(d<menor){

menor=d;
objetivo=o;
}
}

if(!objetivo)
return false;


if(
objetivo.tipo==="rama"
){

recursos.madera+=1;

mensaje(
"+1 madera"
);
}


if(
objetivo.tipo==="piedraPequena"
){

recursos.piedra+=1;

mensaje(
"+1 piedra"
);
}


escena.remove(
objetivo.mesh
);

const i=
objetos.indexOf(
objetivo
);

if(i>=0)
objetos.splice(i,1);

actualizarUI();

return true;
}


/* ==========================
GOLPE
========================== */

let golpeando=false;

function golpear(){

if(golpeando)
return;

if(recogerCercano())
return;


golpeando=true;

let t=0;

const anim=()=>{

t+=.18;

mano.rotation.z=
Math.sin(
t*Math.PI
)*-.75;

mano.rotation.x=
Math.sin(
t*Math.PI
)*-.8;

if(t<1){

requestAnimationFrame(anim);

}else{

mano.rotation.z=0;
mano.rotation.x=0;

golpeando=false;
}
};

anim();


let objetivo=null;
let menor=3.3;

for(
const o of objetos
){

if(o.recogible)
continue;

const d=
jugador.position.distanceTo(
o.mesh.position
);

if(d<menor){

menor=d;
objetivo=o;
}
}


if(!objetivo){

mensaje(
"No hay nada cerca"
);

return;
}


/* ÁRBOL */

if(
objetivo.tipo==="arbol"
){

if(
herramienta.tipo!=="hacha"
){

mensaje(
"Necesitas un hacha"
);

return;
}

if(
herramienta.nivel<
objetivo.dureza
){

mensaje(
"Hacha insuficiente"
);

return;
}

objetivo.vida-=

herramienta.nivel>
objetivo.dureza
?2
:1;

herramienta.durabilidad--;

recursos.madera++;

mensaje(
"+1 madera"
);

if(
objetivo.vida<=0
){

recursos.madera+=
objetivo.madera;

escena.remove(
objetivo.mesh
);

objetos.splice(
objetos.indexOf(
objetivo
),
1
);

mensaje(
"Árbol talado"
);
}
}


/* PIEDRA */

if(
objetivo.tipo==="piedra"
){

if(
herramienta.tipo!=="pico"
){

mensaje(
"Necesitas un pico"
);

return;
}

if(
herramienta.nivel<
objetivo.dureza
){

mensaje(
"Pico insuficiente"
);

return;
}

objetivo.vida-=

herramienta.nivel>
objetivo.dureza
?2
:1;

herramienta.durabilidad--;

recursos.piedra++;

mensaje(
"+1 piedra"
);

if(
objetivo.vida<=0
){

recursos.piedra+=
objetivo.cantidad;

escena.remove(
objetivo.mesh
);

objetos.splice(
objetos.indexOf(
objetivo
),
1
);

mensaje(
"Roca destruida"
);
}
}


/* HIERRO */

if(
objetivo.tipo==="hierro"
){

if(
herramienta.tipo!=="pico"
){

mensaje(
"Necesitas un pico"
);

return;
}

if(
herramienta.nivel<
objetivo.dureza
){

mensaje(
"Pico insuficiente"
);

return;
}

objetivo.vida-=

herramienta.nivel>
objetivo.dureza
?2
:1;

herramienta.durabilidad--;

recursos.hierro++;

mensaje(
"+1 hierro"
);

if(
objetivo.vida<=0
){

recursos.hierro+=
objetivo.cantidad;

escena.remove(
objetivo.mesh
);

objetos.splice(
objetos.indexOf(
objetivo
),
1
);

mensaje(
"Hierro conseguido"
);
}
}


if(
herramienta.durabilidad<=0
){

mensaje(
"¡Herramienta rota!"
);

herramienta={
nombre:"Mano",
tipo:"mano",
nivel:0,
durabilidad:Infinity,
maxima:Infinity
};

actualizarHerramienta();
}

actualizarUI();
}


/* ==========================
CRAFT
========================== */

function hachaPiedra(){

if(
recursos.madera<3 ||
recursos.piedra<3
){

mensaje(
"Faltan materiales"
);

return;
}

recursos.madera-=3;
recursos.piedra-=3;

herramienta={
nombre:"Hacha de piedra",
tipo:"hacha",
nivel:1,
durabilidad:60,
maxima:60
};

actualizarHerramienta();
actualizarUI();

mensaje(
"Hacha creada"
);
}


function picoPiedra(){

if(
recursos.madera<3 ||
recursos.piedra<4
){

mensaje(
"Faltan materiales"
);

return;
}

recursos.madera-=3;
recursos.piedra-=4;

herramienta={
nombre:"Pico de piedra",
tipo:"pico",
nivel:1,
durabilidad:60,
maxima:60
};

actualizarHerramienta();
actualizarUI();

mensaje(
"Pico creado"
);
}


function hachaHierro(){

if(
recursos.madera<5 ||
recursos.hierro<5
){

mensaje(
"Faltan materiales"
);

return;
}

recursos.madera-=5;
recursos.hierro-=5;

herramienta={
nombre:"Hacha de hierro",
tipo:"hacha",
nivel:2,
durabilidad:120,
maxima:120
};

actualizarHerramienta();
actualizarUI();

mensaje(
"Hacha de hierro creada"
);
}


function picoHierro(){

if(
recursos.madera<5 ||
recursos.hierro<5
){

mensaje(
"Faltan materiales"
);

return;
}

recursos.madera-=5;
recursos.hierro-=5;

herramienta={
nombre:"Pico de hierro",
tipo:"pico",
nivel:2,
durabilidad:120,
maxima:120
};

actualizarHerramienta();
actualizarUI();

mensaje(
"Pico de hierro creado"
);
}


/* ==========================
BOTONES
========================== */

document
.getElementById("golpear")
.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
golpear();
}
);

document
.getElementById("crear")
.addEventListener(
"pointerdown",

/* ==========================
JOYSTICK
========================== */

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let movX=0;
let movY=0;
let activo=false;

function moverJoystick(e){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=e.clientX-cx;
let dy=e.clientY-cy;

const max=45;

const dist=
Math.sqrt(
dx*dx+dy*dy
);

if(dist>max){

dx=
dx/dist*max;

dy=
dy/dist*max;
}

movX=dx/max;
movY=dy/max;

stick.style.transform=
`translate(${dx}px,${dy}px)`;
}

joystick.addEventListener(
"pointerdown",
e=>{

activo=true;

joystick.setPointerCapture(
e.pointerId
);

moverJoystick(e);
}
);

joystick.addEventListener(
"pointermove",
e=>{

if(activo)
moverJoystick(e);
}
);

function soltarJoystick(){

activo=false;

movX=0;
movY=0;

stick.style.transform=
"translate(0,0)";
}

joystick.addEventListener(
"pointerup",
soltarJoystick
);

joystick.addEventListener(
"pointercancel",
soltarJoystick
);


/* ==========================
CORRER
========================== */

let stamina=100;

const botonCorrer=
document.getElementById(
"correr"
);

botonCorrer.addEventListener(

e.preventDefault();
corriendo=true;
}
);

}

botonCorrer.addEventListener(

);

"pointercancel",

);

botonCorrer.addEventListener(
"pointerleave",

);


/* ==========================
CÁMARA
========================== */

let camaraTocada=false;

let ultimoX=0;
let ultimoY=0;

let yaw=0;
let pitch=0;

renderer.domElement.addEventListener(
"pointerdown",
e=>{

camaraTocada=true;

ultimoX=e.clientX;
ultimoY=e.clientY;

renderer.domElement.setPointerCapture(
e.pointerId
);
}
);

renderer.domElement.addEventListener(
"pointermove",
e=>{

if(!camaraTocada)
return;

const dx=
e.clientX-ultimoX;

const dy=
e.clientY-ultimoY;

ultimoX=e.clientX;
ultimoY=e.clientY;

yaw-=dx*.006;

pitch-=dy*.006;

pitch=
Math.max(
-.9,
Math.min(.9,pitch)
);

jugador.rotation.y=yaw;
camara.rotation.x=pitch;
}
);

renderer.domElement.addEventListener(
"pointerup",
()=>{
camaraTocada=false;
}
);


/* ==========================
MOVIMIENTO
========================== */

function actualizarMovimiento(){

let velocidad=.09;

if(
corriendo &&
stamina>0
){

velocidad=.19;

stamina-=.6;

}else{

stamina+=.35;
}

stamina=
Math.max(
0,
Math.min(
100,
stamina
)
);

if(stamina<=0)
corriendo=false;


if(
Math.abs(movX)>.05 ||
Math.abs(movY)>.05
){

const frente=
new THREE.Vector3(
0,
0,
-1
);

const derecha=
new THREE.Vector3(
1,
0,
0
);

frente.applyQuaternion(
jugador.quaternion
);

derecha.applyQuaternion(
jugador.quaternion
);

jugador.position.addScaledVector(
frente,
-movY*velocidad
);

jugador.position.addScaledVector(
derecha,
movX*velocidad
);
}

document.getElementById(
"stamina"
).style.width=
stamina+"%";
}


/* ==========================
LOOP
========================== */

function loop(){

requestAnimationFrame(
loop
);

actualizarMovimiento();

renderer.render(
escena,
camara
);
}

loop();


/* ==========================
RESIZE
========================== */

window.addEventListener(

innerWidth/innerHeight;

renderer.setSize(

);
}
);
