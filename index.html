<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Supervivencia 3D</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:12px;
  z-index:5;
  font-size:15px;
}

#info{
  position:fixed;
  top:12px;
  right:12px;
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px;
  border-radius:12px;
  z-index:5;
  font-size:13px;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.35);
  z-index:10;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:32px;
  top:32px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
}

#build{
  position:fixed;
  right:20px;
  bottom:35px;
  width:90px;
  height:55px;
  border:0;
  border-radius:15px;
  background:#e6a23c;
  color:white;
  font-weight:bold;
  z-index:10;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:25px;
  z-index:4;
}
</style>
</head>

<body>

<div id="hud">
  🪵 Madera: <span id="wood">0</span><br>
  🪨 Piedra: <span id="stone">0</span>
</div>

<div id="info">
  Exploración 3D<br>
  Recolectá materiales
</div>

<div id="crosshair">+</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="build">🔥 FOGATA</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;

let player;
let trees=[];
let rocks=[];
let campfires=[];

let wood=0;
let stone=0;

let moveX=0;
let moveZ=0;

let joystick=document.getElementById("joystick");
let stick=document.getElementById("stick");

let dragging=false;

init();
animate();

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x87ceeb);

  scene.fog=new THREE.Fog(0x87ceeb,25,150);

  camera=new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    500
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(innerWidth,innerHeight);

  renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  document.body.appendChild(renderer.domElement);

  // LUZ

  const hemi=new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    2
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xffffff,
    2
  );

  sun.position.set(30,60,20);

  scene.add(sun);

  // SUELO

  const groundGeo=new THREE.PlaneGeometry(300,300);

  const groundMat=new THREE.MeshStandardMaterial({
    color:0x4d8a45
  });

  const ground=new THREE.Mesh(
    groundGeo,
    groundMat
  );

  ground.rotation.x=-Math.PI/2;

  scene.add(ground);

  // PLAYER

  player=new THREE.Object3D();

  player.position.set(0,1.7,8);

  scene.add(player);

  camera.position.set(0,2.5,6);

  player.add(camera);

  // CREAR MUNDO

  for(let i=0;i<45;i++){

    let x=(Math.random()-0.5)*140;
    let z=(Math.random()-0.5)*140;

    if(Math.abs(x)<8 && Math.abs(z)<8) continue;

    createTree(x,z);
  }

  for(let i=0;i<35;i++){

    let x=(Math.random()-0.5)*140;
    let z=(Math.random()-0.5)*140;

    if(Math.abs(x)<8 && Math.abs(z)<8) continue;

    createRock(x,z);
  }

  setupJoystick();

  window.addEventListener("resize",resize);

  document.getElementById("build")
    .addEventListener("click",buildCampfire);

}

function createTree(x,z){

  const tree=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.35,.45,4),
    new THREE.MeshStandardMaterial({
      color:0x6b3e1e
    })
  );

  trunk.position.y=2;

  tree.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.SphereGeometry(2.2,10,10),
    new THREE.MeshStandardMaterial({
      color:0x176b2c
    })
  );

  leaves.position.y=4.5;

  tree.add(leaves);

  tree.position.set(x,0,z);

  scene.add(tree);

  trees.push(tree);
}

function createRock(x,z){

  const rock=new THREE.Mesh(
    new THREE.DodecahedronGeometry(1),
    new THREE.MeshStandardMaterial({
      color:0x777777
    })
  );

  rock.position.set(x,0.7,z);

  rock.scale.set(
    1.2,
    .8,
    1
  );

  scene.add(rock);

  rocks.push(rock);
}

function setupJoystick(){

  joystick.addEventListener("touchstart",e=>{
    dragging=true;
  });

  joystick.addEventListener("touchmove",e=>{

    if(!dragging)return;

    const t=e.touches[0];

    const r=joystick.getBoundingClientRect();

    let x=t.clientX-(r.left+r.width/2);
    let y=t.clientY-(r.top+r.height/2);

    const max=45;

    const len=Math.sqrt(x*x+y*y);

    if(len>max){

      x=x/len*max;
      y=y/len*max;

    }

    stick.style.left=(32+x)+"px";
    stick.style.top=(32+y)+"px";

    moveX=x/max;
    moveZ=y/max;

  });

  joystick.addEventListener("touchend",()=>{

    dragging=false;

    moveX=0;
    moveZ=0;

    stick.style.left="32px";
    stick.style.top="32px";

  });

}

function collect(){

  for(let i=trees.length-1;i>=0;i--){

    const d=player.position.distanceTo(
      trees[i].position
    );

    if(d<3){

      wood+=2;

      document.getElementById("wood").textContent=wood;

      scene.remove(trees[i]);

      trees.splice(i,1);

      return;
    }
  }

  for(let i=rocks.length-1;i>=0;i--){

    const d=player.position.distanceTo(
      rocks[i].position
    );

    if(d<3){

      stone+=2;

      document.getElementById("stone").textContent=stone;

      scene.remove(rocks[i]);

      rocks.splice(i,1);

      return;
    }
  }

}

function buildCampfire(){

  if(wood<3 || stone<2){

    alert("Necesitás 3 madera y 2 piedra");

    return;
  }

  wood-=3;
  stone-=2;

  document.getElementById("wood").textContent=wood;
  document.getElementById("stone").textContent=stone;

  const fire=new THREE.Group();

  const base=new THREE.Mesh(
    new THREE.CylinderGeometry(.7,.8,.3,10),
    new THREE.MeshStandardMaterial({
      color:0x555555
    })
  );

  fire.add(base);

  const flame=new THREE.Mesh(
    new THREE.ConeGeometry(.45,1.5,8),
    new THREE.MeshBasicMaterial({
      color:0xff6a00
    })
  );

  flame.position.y=.9;

  fire.add(flame);

  fire.position.copy(player.position);

  fire.position.y=0;

  scene.add(fire);

  campfires.push(fire);

}

function update(){

  const speed=.12;

  player.position.x+=moveX*speed;
  player.position.z+=moveZ*speed;

  // recolectar automáticamente al acercarse

  collect();

  // cámara siguiendo al jugador

  camera.lookAt(
    player.position.x,
    player.position.y,
    player.position.z-10
  );

}

function animate(){

  requestAnimationFrame(animate);

  update();

  renderer.render(
    scene,
    camera
  );

}

function resize(){

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

</script>

</body>
</html>
