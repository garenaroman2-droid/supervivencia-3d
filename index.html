<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D V8.0</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.62);
  padding:10px;
  border-radius:12px;
  font-size:13px;
  line-height:1.45;
}

#version{
  font-weight:bold;
  color:#8cff8c;
}

#compass{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  color:white;
  background:rgba(0,0,0,.65);
  padding:7px 18px;
  border-radius:20px;
  font-weight:bold;
}

#mapBtn,#invBtn{
  position:fixed;
  right:12px;
  z-index:30;
  border:0;
  border-radius:12px;
  color:white;
  background:#222;
  padding:12px 15px;
  font-weight:bold;
}

#mapBtn{top:10px}
#invBtn{top:62px}

#map{
  display:none;
  position:fixed;
  inset:5%;
  z-index:100;
  background:#182318;
  border:3px solid #777;
  border-radius:18px;
  overflow:hidden;
}

#mapCanvas{
  width:100%;
  height:100%;
}

#closeMap{
  position:absolute;
  top:10px;
  right:10px;
  z-index:5;
  background:#222;
  color:white;
  border:0;
  border-radius:10px;
  padding:10px 14px;
}

#mapInfo{
  position:absolute;
  left:10px;
  top:10px;
  background:rgba(0,0,0,.72);
  color:white;
  padding:8px;
  border-radius:10px;
  font-size:12px;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.25);
  z-index:20;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,.45);
  left:33px;
  top:33px;
}

#run{
  position:fixed;
  right:25px;
  bottom:40px;
  width:100px;
  height:55px;
  border:0;
  border-radius:15px;
  background:#444;
  color:white;
  font-weight:bold;
  z-index:20;
}

#hit{
  position:fixed;
  right:25px;
  bottom:110px;
  width:100px;
  height:65px;
  border:0;
  border-radius:15px;
  background:#7b241c;
  color:white;
  font-weight:bold;
  z-index:20;
}

#flagBtn{
  position:fixed;
  right:25px;
  bottom:185px;
  width:100px;
  height:55px;
  border:0;
  border-radius:15px;
  background:#285a35;
  color:white;
  font-weight:bold;
  z-index:20;
}

#message{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.8);
  color:white;
  padding:10px 16px;
  border-radius:12px;
  z-index:50;
  display:none;
  max-width:85%;
  text-align:center;
}

#discover{
  position:fixed;
  left:50%;
  top:25%;
  transform:translateX(-50%);
  z-index:60;
  background:rgba(0,0,0,.88);
  color:white;
  padding:22px 30px;
  border:2px solid #d9b44a;
  border-radius:18px;
  text-align:center;
  display:none;
}

#discover small{
  color:#bbb;
}

#inventory{
  display:none;
  position:fixed;
  inset:10%;
  z-index:90;
  background:rgba(10,10,10,.95);
  color:white;
  border:2px solid #777;
  border-radius:18px;
  padding:20px;
}

#inventory h2{
  margin-top:0;
}

#closeInv{
  float:right;
  background:#333;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:8px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="version">SUPERVIVENCIA 3D — V8.0</div>
  ❤️ Vida: <span id="hp">100</span><br>
  🪵 Madera: <span id="wood">0</span><br>
  🪨 Piedra: <span id="stone">0</span><br>
  🔩 Hierro: <span id="iron">0</span><br>
  🚩 Banderas: <span id="flags">3</span><br>
  📍 <span id="coords">0 m / 0 m</span>
</div>

<div id="compass">N</div>

<button id="mapBtn">🗺️ MAPA</button>
<button id="invBtn">🎒 INVENTARIO</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="flagBtn">🚩 BANDERA</button>
<button id="hit">⛏️ GOLPEAR</button>
<button id="run">CORRER</button>

<div id="message"></div>

<div id="discover">
  <div style="font-size:22px;font-weight:bold">¡LUGAR DESCUBIERTO!</div>
  <br>
  <div id="discoverName"></div>
  <br>
  <small id="discoverDistance"></small>
</div>

<div id="map">
  <button id="closeMap">CERRAR</button>
  <div id="mapInfo">
    🟢 Tú<br>
    🚩 Banderas<br>
    🏠 Lugares descubiertos<br>
    ⭐ Base
  </div>
  <canvas id="mapCanvas"></canvas>
</div>

<div id="inventory">
  <button id="closeInv">CERRAR</button>
  <h2>🎒 Inventario</h2>
  <div id="invText"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;

let player={
  x:0,
  z:8,
  y:1.7,
  hp:100
};

const BASE={x:0,z:8};

let wood=0;
let stone=0;
let iron=0;
let flags=3;

let discovered=[];
let placedFlags=[];

let objects=[];

let yaw=0;
let pitch=-0.12;

let joyX=0;
let joyY=0;
let running=false;

let lastTime=performance.now();

const SAVE_KEY="survival_v8_save";

function saveGame(){

  localStorage.setItem(SAVE_KEY,JSON.stringify({
    player,
    wood,
    stone,
    iron,
    flags,
    discovered,
    placedFlags
  }));

}

function loadGame(){

  try{

    const data=JSON.parse(localStorage.getItem(SAVE_KEY));

    if(!data)return;

    if(data.player){
      player.x=data.player.x||0;
      player.z=data.player.z||8;
    }

    wood=data.wood||0;
    stone=data.stone||0;
    iron=data.iron||0;
    flags=data.flags===undefined?3:data.flags;

    discovered=data.discovered||[];
    placedFlags=data.placedFlags||[];

  }catch(e){}

}

loadGame();

scene=new THREE.Scene();

scene.background=new THREE.Color(0x91c7e8);

scene.fog=new THREE.Fog(
  0x91c7e8,
  80,
  700
);

camera=new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .1,
  2000
);

renderer=new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.6)
);

renderer.shadowMap.enabled=true;

document.getElementById("game").appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(
  0xbfe8ff,
  0x304020,
  1.6
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
  0xffffff,
  1.5
);

sun.position.set(80,130,60);
sun.castShadow=true;

scene.add(sun);

/* TERRENO */

const groundMat=new THREE.MeshStandardMaterial({
  color:0x496b3b
});

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(6000,6000),
  groundMat
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* CAMINOS */

function road(x,z,w,d){

  const mat=new THREE.MeshStandardMaterial({
    color:0x696254
  });

  const r=new THREE.Mesh(
    new THREE.BoxGeometry(w,.04,d),
    mat
  );

  r.position.set(x,.02,z);

  scene.add(r);

}

road(500,-400,30,900);
road(500,50,900,30);
road(-500,400,30,800);

/* ÁRBOLES */

function createTree(x,z,level=1){

  const g=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35+.12*level,
      .55+.15*level,
      4+level,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x60402c
    })
  );

  trunk.position.y=2;

  g.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.ConeGeometry(
      2.4+level*.8,
      5+level,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:level===1?0x315d32:
            level===2?0x214a27:
            0x173b20
    })
  );

  leaves.position.y=5.3;

  g.add(leaves);

  g.position.set(x,0,z);

  g.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true;
      o.receiveShadow=true;
    }
  });

  scene.add(g);

  objects.push({
    type:"tree",
    mesh:g,
    x,z,
    hardness:level
  });

}

/* ROCAS */

function createRock(x,z,level=1){

  const r=new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      1+level*.35,
      1
    ),
    new THREE.MeshStandardMaterial({
      color:
        level===1?0x777777:
        level===2?0x55585b:
        0x393b3d
    })
  );

  r.position.set(x,1,z);

  r.scale.y=.7;

  r.castShadow=true;

  scene.add(r);

  objects.push({
    type:"rock",
    mesh:r,
    x,z,
    hardness:level
  });

}

/* VEGETACIÓN */

function createBush(x,z){

  const b=new THREE.Mesh(
    new THREE.SphereGeometry(
      .7+Math.random()*.6,
      8,8
    ),
    new THREE.MeshStandardMaterial({
      color:0x35652f
    })
  );

  b.position.set(x,.6,z);

  scene.add(b);

}

function createGrass(x,z){

  for(let i=0;i<4;i++){

    const blade=new THREE.Mesh(
      new THREE.BoxGeometry(.035,.6,.035),
      new THREE.MeshStandardMaterial({
        color:0x5f863e
      })
    );

    blade.position.set(
      x+(Math.random()-.5),
      .3,
      z+(Math.random()-.5)
    );

    blade.rotation.z=(Math.random()-.5)*.5;

    scene.add(blade);

  }

}

/* CASA */

function createHouse(x,z,w=12,d=10){

  const g=new THREE.Group();

  const wallMat=new THREE.MeshStandardMaterial({
    color:0xaaa08d
  });

  const roofMat=new THREE.MeshStandardMaterial({
    color:0x4c3d35
  });

  function wall(px,pz,pw,pd){

    const m=new THREE.Mesh(
      new THREE.BoxGeometry(pw,4,pd),
      wallMat
    );

    m.position.set(px,2,pz);

    m.castShadow=true;

    g.add(m);

  }

  wall(0,-d/2,w,.5);
  wall(0,d/2,w,.5);
  wall(-w/2,0,.5,d);
  wall(w/2,0,.5,d);

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(w+1,1,d+1),
    roofMat
  );

  roof.position.y=4.5;

  roof.rotation.z=.04;

  roof.castShadow=true;

  g.add(roof);

  const door=new THREE.Mesh(
    new THREE.BoxGeometry(1.8,2.8,.2),
    new THREE.MeshStandardMaterial({
      color:0x55351e
    })
  );

  door.position.set(0,1.4,d/2+.15);

  g.add(door);

  const windowMat=new THREE.MeshStandardMaterial({
    color:0x8fd5e8,
    metalness:.2,
    roughness:.2
  });

  [-w/3,w/3].forEach(px=>{

    const win=new THREE.Mesh(
      new THREE.BoxGeometry(1.8,1.4,.15),
      windowMat
    );

    win.position.set(px,2,d/2+.2);

    g.add(win);

  });

  g.position.set(x,0,z);

  scene.add(g);

  return g;

}

/* CIUDAD GRANDE */

function createCity(){

  const cx=900;
  const cz=-700;

  for(let i=0;i<14;i++){

    const angle=(i/14)*Math.PI*2;

    const radius=100+Math.random()*170;

    const x=cx+Math.cos(angle)*radius;
    const z=cz+Math.sin(angle)*radius;

    createHouse(
      x,
      z,
      12+Math.random()*8,
      10+Math.random()*8
    );

  }

  road(cx,cz,500,25);
  road(cx,cz,25,500);

  createPlace(
    "Ciudad Vieja",
    cx,
    cz,
    "city"
  );

}

/* GRANJAS */

function createFarm(){

  const x=-700;
  const z=500;

  createHouse(x,z,16,12);

  for(let i=0;i<8;i++){

    const fx=x-30+i*8;

    for(let j=0;j<5;j++){

      const plant=new THREE.Mesh(
        new THREE.CylinderGeometry(.12,.2,.8,6),
        new THREE.MeshStandardMaterial({
          color:0x477a32
        })
      );

      plant.position.set(
        fx,
        .4,
        z+30+j*4
      );

      scene.add(plant);

    }

  }

  createPlace(
    "Granja Verde",
    x,
    z,
    "farm"
  );

}

/* LUGARES */

function createPlace(name,x,z,type){

  const found=discovered.some(
    p=>p.name===name
  );

  const marker=new THREE.Group();

  const pillar=new THREE.Mesh(
    new THREE.CylinderGeometry(.15,.15,5,8),
    new THREE.MeshStandardMaterial({
      color:0x777777
    })
  );

  pillar.position.y=2.5;

  marker.add(pillar);

  const top=new THREE.Mesh(
    new THREE.BoxGeometry(1.4,.9,.1),
    new THREE.MeshStandardMaterial({
      color:0x7777ff
    })
  );

  top.position.y=4.5;

  marker.add(top);

  marker.position.set(x,0,z);

  marker.visible=false;

  scene.add(marker);

  const place={
    name,
    x,
    z,
    type,
    marker
  };

  window.places=window.places||[];

  window.places.push(place);

}

/* BASE */

function createBase(){

  createHouse(
    BASE.x,
    BASE.z-10,
    14,
    12
  );

  createFlag(
    BASE.x,
    BASE.z,
    "BASE",
    true
  );

}

function createFlag(x,z,name,isBase=false){

  const g=new THREE.Group();

  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(.08,.08,4,8),
    new THREE.MeshStandardMaterial({
      color:0x333333
    })
  );

  pole.position.y=2;

  g.add(pole);

  const flag=new THREE.Mesh(
    new THREE.PlaneGeometry(2,1.2),
    new THREE.MeshStandardMaterial({
      color:isBase?0xd62828:0xe6c229,
      side:THREE.DoubleSide
    })
  );

  flag.position.set(1,3.3,0);

  g.add(flag);

  g.position.set(x,0,z);

  scene.add(g);

  return g;

}

/* GENERACIÓN */

createBase();

createCity();

createFarm();

for(let i=0;i<160;i++){

  const x=(Math.random()-.5)*5000;
  const z=(Math.random()-.5)*5000;

  if(Math.hypot(x-BASE.x,z-BASE.z)<80)continue;

  createTree(
    x,
    z,
    1+Math.floor(Math.random()*3)
  );

}

for(let i=0;i<100;i++){

  const x=(Math.random()-.5)*5000;
  const z=(Math.random()-.5)*5000;

  createRock(
    x,
    z,
    1+Math.floor(Math.random()*3)
  );

}

for(let i=0;i<900;i++){

  const x=(Math.random()-.5)*5000;
  const z=(Math.random()-.5)*5000;

  createGrass(x,z);

}

for(let i=0;i<250;i++){

  const x=(Math.random()-.5)*5000;
  const z=(Math.random()-.5)*5000;

  createBush(x,z);

}

/* LUGARES ADICIONALES */

createPlace(
  "Bosque del Norte",
  -900,
  -1100,
  "forest"
);

createPlace(
  "Lago Perdido",
  1200,
  850,
  "lake"
);

createPlace(
  "Casa Abandonada",
  -1300,
  900,
  "house"
);

createPlace(
  "Mina Vieja",
  1500,
  -1200,
  "mine"
);

/* BANDERAS GUARDADAS */

for(const f of placedFlags){

  const flag=createFlag(
    f.x,
    f.z,
    f.name
  );

}

/* CÁMARA */

function updateCamera(){

  camera.position.set(
    player.x,
    player.y,
    player.z
  );

  const dir=new THREE.Vector3(
    Math.sin(yaw),
    Math.sin(pitch),
    Math.cos(yaw)
  );

  camera.lookAt(
    camera.position.clone().add(dir)
  );

}

updateCamera();

/* MOVIMIENTO */

function movePlayer(dt){

  let speed=running?7:3.5;

  const forward=-joyY;
  const side=joyX;

  const sin=Math.sin(yaw);
  const cos=Math.cos(yaw);

  player.x += (
    side*cos +
    forward*sin
  )*speed*dt;

  player.z += (
    side*-sin +
    forward*cos
  )*speed*dt;

  player.x=Math.max(-2900,Math.min(2900,player.x));
  player.z=Math.max(-2900,Math.min(2900,player.z));

}

/* JOYSTICK */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyActive=false;

joystick.addEventListener("pointerdown",e=>{

  joyActive=true;
  joystick.setPointerCapture(e.pointerId);
  updateJoy(e);

});

joystick.addEventListener("pointermove",e=>{

  if(joyActive)updateJoy(e);

});

joystick.addEventListener("pointerup",()=>{
  joyActive=false;
  joyX=0;
  joyY=0;
  stick.style.left="33px";
  stick.style.top="33px";
});

function updateJoy(e){

  const r=joystick.getBoundingClientRect();

  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);

  const max=42;

  const len=Math.hypot(x,y);

  if(len>max){

    x=x/len*max;
    y=y/len*max;

  }

  joyX=x/max;
  joyY=y/max;

  stick.style.left=(33+x)+"px";
  stick.style.top=(33+y)+"px";

}

/* CÁMARA TÁCTIL */

let camActive=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    if(e.clientX<170)return;

    camActive=true;

    lastX=e.clientX;
    lastY=e.clientY;

  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!camActive)return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    yaw-=dx*.008;
    pitch-=dy*.006;

    pitch=Math.max(-.9,Math.min(.55,pitch));

    lastX=e.clientX;
    lastY=e.clientY;

  }
);

renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
    camActive=false;
  }
);

/* CORRER */

const run=document.getElementById("run");

run.addEventListener("pointerdown",()=>{
  running=true;
});

run.addEventListener("pointerup",()=>{
  running=false;
});

run.addEventListener("pointercancel",()=>{
  running=false;
});

/* BANDERA */

document.getElementById("flagBtn")
.addEventListener("click",()=>{

  if(flags<=0){

    showMessage("No tenés más banderas.");

    return;

  }

  const name=
    prompt(
      "Nombre de esta bandera/lugar:",
      "Lugar descubierto"
    );

  if(!name)return;

  const f={
    name,
    x:Math.round(player.x),
    z:Math.round(player.z)
  };

  placedFlags.push(f);

  createFlag(
    f.x,
    f.z,
    f.name
  );

  flags--;

  saveGame();

  showMessage(
    "🚩 Bandera colocada: "+name+
    " — "+distanceFromBase(f.x,f.z)
  );

  updateHUD();

});

/* DISTANCIA */

function distanceFromBase(x,z){

  const meters=Math.hypot(
    x-BASE.x,
    z-BASE.z
  );

  if(meters>=1000){

    return(
      (meters/1000).toFixed(2)+
      " km desde la base"
    );

  }

  return(
    Math.round(meters)+
    " m desde la base"
  );

}

/* DESCUBRIMIENTO */

function checkDiscoveries(){

  if(!window.places)return;

  for(const p of window.places){

    const d=Math.hypot(
      player.x-p.x,
      player.z-p.z
    );

    if(d<70){

      const already=discovered.some(
        x=>x.name===p.name
      );

      if(!already){

        discovered.push({
          name:p.name,
          x:p.x,
          z:p.z,
          type:p.type
        });

        p.marker.visible=true;

        showDiscovery(
          p.name,
          distanceFromBase(p.x,p.z)
        );

        saveGame();

      }

    }

  }

}

/* RECUPERAR MARCADORES */

function restoreDiscoveries(){

  if(!window.places)return;

  for(const p of window.places){

    if(
      discovered.some(
        d=>d.name===p.name
      )
    ){

      p.marker.visible=true;

    }

  }

}

/* MENSAJES */

function showMessage(text){

  const el=document.getElementById("message");

  el.innerText=text;

  el.style.display="block";

  clearTimeout(window.msgTimer);

  window.msgTimer=setTimeout(()=>{
    el.style.display="none";
  },3000);

}

function showDiscovery(name,distance){

  const box=document.getElementById("discover");

  document.getElementById("discoverName")
  .innerText=name;

  document.getElementById("discoverDistance")
  .innerText=distance;

  box.style.display="block";

  clearTimeout(window.discoveryTimer);

  window.discoveryTimer=setTimeout(()=>{
    box.style.display="none";
  },4500);

}

/* HUD */

function updateHUD(){

  document.getElementById("hp")
  .innerText=Math.round(player.hp);

  document.getElementById("wood")
  .innerText=wood;

  document.getElementById("stone")
  .innerText=stone;

  document.getElementById("iron")
  .innerText=iron;

  document.getElementById("flags")
  .innerText=flags;

  const dx=Math.round(player.x);
  const dz=Math.round(player.z);

  document.getElementById("coords")
  .innerText=
    dx+" m / "+dz+" m";

}

/* BRÚJULA */

function updateCompass(){

  let deg=
    (yaw*180/Math.PI)%360;

  if(deg<0)deg+=360;

  let dir="N";

  if(deg>=22.5&&deg<67.5)dir="NE";
  else if(deg>=67.5&&deg<112.5)dir="E";
  else if(deg>=112.5&&deg<157.5)dir="SE";
  else if(deg>=157.5&&deg<202.5)dir="S";
  else if(deg>=202.5&&deg<247.5)dir="SO";
  else if(deg>=247.5&&deg<292.5)dir="O";
  else if(deg>=292.5&&deg<337.5)dir="NO";

  document.getElementById("compass")
  .innerText=dir;

}

/* MAPA */

const map=document.getElementById("map");
const mapCanvas=document.getElementById("mapCanvas");
const ctx=mapCanvas.getContext("2d");

document.getElementById("mapBtn")
.addEventListener("click",()=>{

  map.style.display="block";

  drawMap();

});

document.getElementById("closeMap")
.addEventListener("click",()=>{

  map.style.display="none";

});

function drawMap(){

  mapCanvas.width=mapCanvas.clientWidth;
  mapCanvas.height=mapCanvas.clientHeight;

  const w=mapCanvas.width;
  const h=mapCanvas.height;

  ctx.fillStyle="#263b25";
  ctx.fillRect(0,0,w,h);

  const scale=.055;

  function worldToMap(x,z){

    return {
      x:w/2+x*scale,
      y:h/2+z*scale
    };

  }

  /* CUADRÍCULA */

  ctx.strokeStyle="rgba(255,255,255,.08)";
  ctx.lineWidth=1;

  for(let x=0;x<w;x+=50){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,h);
    ctx.stroke();

  }

  for(let y=0;y<h;y+=50){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();

  }

  /* BASE */

  const b=worldToMap(
    BASE.x,
    BASE.z
  );

  ctx.fillStyle="#ff3030";

  ctx.beginPath();
  ctx.arc(b.x,b.y,8,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="12px Arial";
  ctx.fillText(
    "BASE",
    b.x+10,
    b.y
  );

  /* BANDERAS */

  for(const f of placedFlags){

    const p=worldToMap(f.x,f.z);

    ctx.fillStyle="#ffd83d";

    ctx.beginPath();
    ctx.arc(p.x,p.y,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillText(
      f.name,
      p.x+8,
      p.y
    );

  }

  /* LUGARES */

  for(const d of discovered){

    const p=worldToMap(d.x,d.z);

    ctx.fillStyle="#73a7ff";

    ctx.fillRect(
      p.x-5,
      p.y-5,
      10,
      10
    );

    ctx.fillStyle="white";

    ctx.fillText(
      d.name,
      p.x+8,
      p.y
    );

  }

  /* JUGADOR */

  const me=worldToMap(
    player.x,
    player.z
  );

  ctx.fillStyle="#00ff66";

  ctx.beginPath();

  ctx.arc(
    me.x,
    me.y,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* DISTANCIA A BASE */

  const distance=Math.hypot(
    player.x-BASE.x,
    player.z-BASE.z
  );

  ctx.fillStyle="white";
  ctx.font="bold 14px Arial";

  ctx.fillText(
    "Distancia a base: "+
    (
      distance>=1000
      ?(distance/1000).toFixed(2)+" km"
      :Math.round(distance)+" m"
    ),
    15,
    h-20
  );

}

/* INVENTARIO */

document.getElementById("invBtn")
.addEventListener("click",()=>{

  document.getElementById("inventory")
  .style.display="block";

  document.getElementById("invText")
  .innerHTML=`

    🪵 Madera: ${wood}<br><br>

    🪨 Piedra: ${stone}<br><br>

    🔩 Hierro: ${iron}<br><br>

    🚩 Banderas: ${flags}<br><br>

    🗺️ Lugares descubiertos:
    ${discovered.length}

  `;

});

document.getElementById("closeInv")
.addEventListener("click",()=>{

  document.getElementById("inventory")
  .style.display="none";

});

/* GOLPEAR */

document.getElementById("hit")
.addEventListener("click",()=>{

  const nearest=objects
    .map(o=>({
      o,
      d:Math.hypot(
        o.x-player.x,
        o.z-player.z
      )
    }))
    .sort((a,b)=>a.d-b.d)[0];

  if(!nearest||nearest.d>5){

    showMessage("No hay ningún recurso cerca.");

    return;

  }

  const o=nearest.o;

  if(o.type==="tree"){

    wood+=o.hardness;

    showMessage(
      "🪵 Conseguís "+o.hardness+
      " madera."
    );

  }

  if(o.type==="rock"){

    stone+=o.hardness;

    showMessage(
      "🪨 Conseguís "+o.hardness+
      " piedra."
    );

  }

  o.mesh.visible=false;

  objects.splice(
    objects.indexOf(o),
    1
  );

  saveGame();

  updateHUD();

});

/* LOOP */

function animate(){

  requestAnimationFrame(animate);

  const now=performance.now();

  const dt=Math.min(
    (now-lastTime)/1000,
    .05
  );

  lastTime=now;

  movePlayer(dt);

  updateCamera();

  updateCompass();

  updateHUD();

  checkDiscoveries();

  renderer.render(
    scene,
    camera
  );

}

restoreDiscoveries();

animate();

addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

</script>
