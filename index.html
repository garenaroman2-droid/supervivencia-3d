<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#juego{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#info{
  position:fixed;
  top:8px;
  left:8px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.58);
  padding:10px;
  border-radius:10px;
  font-size:13px;
  line-height:1.45;
}

#inventario{
  position:fixed;
  top:8px;
  right:8px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.58);
  padding:10px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
  min-width:130px;
}

#vidaBox{
  position:fixed;
  top:112px;
  left:8px;
  width:150px;
  z-index:10;
}

.barra{
  height:13px;
  background:#333;
  border-radius:8px;
  overflow:hidden;
  margin-top:4px;
}

#vida{
  width:100%;
  height:100%;
  background:#e53935;
}

#stamina{
  width:100%;
  height:100%;
  background:#f2c94c;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.22);
  z-index:20;
}

#stick{
  position:absolute;
  left:35px;
  top:35px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}

#botones{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:flex-end;
}

button{
  border:0;
  color:white;
  background:rgba(20,20,20,.78);
  border:1px solid rgba(255,255,255,.25);
  border-radius:12px;
  padding:14px 18px;
  font-size:15px;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
  background:rgba(70,70,70,.9);
}

#mensaje{
  position:fixed;
  left:50%;
  bottom:180px;
  transform:translateX(-50%);
  z-index:30;
  color:white;
  background:rgba(0,0,0,.72);
  padding:10px 15px;
  border-radius:10px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  text-align:center;
}

#craft{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:50;
  width:300px;
  max-width:90%;
  background:rgba(10,10,10,.95);
  color:white;
  padding:18px;
  border-radius:15px;
  display:none;
}

#craft h2{
  margin:0 0 12px;
}

#craft button{
  width:100%;
  margin-top:7px;
}

#cerrar{
  background:#8b2222;
}
</style>
</head>

<body>

<div id="juego"></div>

<div id="info">
  <b>SUPERVIVENCIA 3D — V5.0</b><br>
  Acercate a ramas y piedras pequeñas.<br>
  GOLPEAR para recoger o usar herramienta.
</div>

<div id="inventario">
  Madera: <span id="madera">0</span><br>
  Piedra: <span id="piedra">0</span><br>
  Hierro: <span id="hierro">0</span><br>
  Herramienta: <span id="herramienta">Mano</span><br>
  Durabilidad: <span id="durabilidad">∞</span>
</div>

<div id="vidaBox">
  Vida
  <div class="barra"><div id="vida"></div></div>
  Energía
  <div class="barra"><div id="stamina"></div></div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="botones">
  <button id="golpear">GOLPEAR</button>
  <button id="correr">CORRER</button>
  <button id="abrirCraft">CREAR</button>
</div>

<div id="mensaje"></div>

<div id="craft">
  <h2>CREAR</h2>

  <button id="hachaPiedra">
    Hacha de piedra — 3 madera + 3 piedra
  </button>

  <button id="picoPiedra">
    Pico de piedra — 3 madera + 4 piedra
  </button>

  <button id="hachaHierro">
    Hacha de hierro — 5 madera + 5 hierro
  </button>

  <button id="picoHierro">
    Pico de hierro — 5 madera + 5 hierro
  </button>

  <button id="cerrar">CERRAR</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   ESCENA
========================= */

const escena = new THREE.Scene();

escena.background = new THREE.Color(0x87b9df);

escena.fog = new THREE.Fog(
  0x87b9df,
  35,
  130
);

const camara = new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .05,
  300
);

const render = new THREE.WebGLRenderer({
  antialias:true
});

render.setSize(innerWidth,innerHeight);
render.setPixelRatio(Math.min(devicePixelRatio,2));
render.shadowMap.enabled=true;

document.getElementById("juego").appendChild(render.domElement);


/* =========================
   LUZ
========================= */

const luz = new THREE.HemisphereLight(
  0xffffff,
  0x49643a,
  1.5
);

escena.add(luz);

const sol = new THREE.DirectionalLight(
  0xffffff,
  1.7
);

sol.position.set(30,60,20);
sol.castShadow=true;

escena.add(sol);


/* =========================
   TERRENO
========================= */

const suelo = new THREE.Mesh(
  new THREE.PlaneGeometry(220,220),
  new THREE.MeshStandardMaterial({
    color:0x4b7838
  })
);

suelo.rotation.x=-Math.PI/2;
suelo.receiveShadow=true;

escena.add(suelo);


/* =========================
   JUGADOR
========================= */

const jugador = new THREE.Group();

jugador.position.set(0,1,8);

escena.add(jugador);

jugador.add(camara);

camara.position.set(0,1.6,0);


/* =========================
   BRAZO Y MANO
========================= */

const mano = new THREE.Group();

mano.position.set(
  .5,
  -.48,
  -.75
);

camara.add(mano);

const brazo = new THREE.Mesh(
  new THREE.BoxGeometry(.18,.55,.18),
  new THREE.MeshStandardMaterial({
    color:0xc68c68
  })
);

brazo.rotation.z=-.2;
brazo.position.set(0,-.2,.05);

mano.add(brazo);

const puño = new THREE.Mesh(
  new THREE.SphereGeometry(.13,12,12),
  new THREE.MeshStandardMaterial({
    color:0xd09a76
  })
);

puño.position.set(0,.08,0);

mano.add(puño);


/* =========================
   INVENTARIO
========================= */

let recursos={
  madera:0,
  piedra:0,
  hierro:0
};

let herramienta={
  nombre:"Mano",
  tipo:"mano",
  nivel:0,
  durabilidad:Infinity,
  maxima:Infinity
};


/* =========================
   MODELOS DE HERRAMIENTAS
========================= */

let modeloHerramienta=null;

function crearHacha(esHierro){

  const grupo=new THREE.Group();

  const palo=new THREE.Mesh(
    new THREE.BoxGeometry(.08,.7,.08),
    new THREE.MeshStandardMaterial({
      color:0x70452a
    })
  );

  palo.position.y=.1;

  grupo.add(palo);

  const metal=new THREE.Mesh(
    new THREE.BoxGeometry(.42,.16,.08),
    new THREE.MeshStandardMaterial({
      color:esHierro?0x777777:0x999999
    })
  );

  metal.position.set(.16,.42,0);

  grupo.add(metal);

  const filo=new THREE.Mesh(
    new THREE.BoxGeometry(.12,.30,.08),
    new THREE.MeshStandardMaterial({
      color:esHierro?0x555555:0x777777
    })
  );

  filo.position.set(.34,.30,0);

  grupo.add(filo);

  grupo.rotation.z=-.5;

  return grupo;
}


function crearPico(esHierro){

  const grupo=new THREE.Group();

  const palo=new THREE.Mesh(
    new THREE.BoxGeometry(.08,.7,.08),
    new THREE.MeshStandardMaterial({
      color:0x70452a
    })
  );

  grupo.add(palo);

  const cabeza=new THREE.Mesh(
    new THREE.BoxGeometry(.55,.12,.10),
    new THREE.MeshStandardMaterial({
      color:esHierro?0x666666:0x999999
    })
  );

  cabeza.position.y=.38;

  grupo.add(cabeza);

  const punta=new THREE.Mesh(
    new THREE.ConeGeometry(.08,.35,4),
    new THREE.MeshStandardMaterial({
      color:esHierro?0x444444:0x777777
    })
  );

  punta.rotation.z=Math.PI/2;
  punta.position.x=.32;
  punta.position.y=.38;

  grupo.add(punta);

  grupo.rotation.z=-.55;

  return grupo;
}


function actualizarHerramienta(){

  if(modeloHerramienta){
    mano.remove(modeloHerramienta);
    modeloHerramienta=null;
  }

  if(herramienta.tipo==="hacha"){
    modeloHerramienta=
      crearHacha(herramienta.nivel>=2);
  }

  if(herramienta.tipo==="pico"){
    modeloHerramienta=
      crearPico(herramienta.nivel>=2);
  }

  if(modeloHerramienta){

    modeloHerramienta.position.set(
      0,
      -.1,
      -.15
    );

    modeloHerramienta.scale.set(
      .75,.75,.75
    );

    mano.add(modeloHerramienta);
  }

  document.getElementById("herramienta").textContent=
    herramienta.nombre;

  document.getElementById("durabilidad").textContent=
    herramienta.durabilidad===Infinity
    ? "∞"
    : Math.ceil(herramienta.durabilidad);
}

actualizarHerramienta();


/* =========================
   OBJETOS DEL MUNDO
========================= */

const objetos=[];


function material(color){
  return new THREE.MeshStandardMaterial({
    color
  });
}


/* ÁRBOL */

function crearArbol(x,z,dureza){

  const grupo=new THREE.Group();

  const tronco=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .3+.08*dureza,
      .42+.1*dureza,
      2.8+.35*dureza,
      8
    ),
    material(0x684328)
  );

  tronco.position.y=1.4;
  tronco.castShadow=true;

  grupo.add(tronco);


  const hojas=new THREE.Mesh(
    new THREE.ConeGeometry(
      1.8+.3*dureza,
      3.2+.5*dureza,
      8
    ),
    material(
      dureza===1
      ?0x3d7c35
      :dureza===2
      ?0x28652c
      :0x174d22
    )
  );

  hojas.position.y=3.4;

  hojas.castShadow=true;

  grupo.add(hojas);


  grupo.position.set(x,0,z);

  escena.add(grupo);

  objetos.push({
    mesh:grupo,
    tipo:"arbol",
    dureza,
    vida:dureza===1?3:dureza===2?6:10,
    madera:dureza===1?4:dureza===2?7:12
  });
}


/* PIEDRA */

function crearRoca(x,z,dureza,hierro=false){

  const grupo=new THREE.Group();

  const roca=new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      .8+.25*dureza
    ),
    material(
      hierro
      ?0x555555
      :dureza===1
      ?0x999999
      :dureza===2
      ?0x777777
      :0x4e4e4e
    )
  );

  roca.position.y=.7;

  roca.scale.y=.7;

  roca.castShadow=true;

  grupo.add(roca);

  grupo.position.set(x,0,z);

  escena.add(grupo);

  objetos.push({
    mesh:grupo,
    tipo:hierro?"hierro":"piedra",
    dureza,
    vida:dureza===1?3:dureza===2?6:10,
    cantidad:dureza===1?3:dureza===2?6:10
  });
}


/* RAMA */

function crearRama(x,z){

  const rama=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .06,.08,1,7
    ),
    material(0x70472c)
  );

  rama.rotation.z=.8;
  rama.position.set(x,.15,z);

  escena.add(rama);

  objetos.push({
    mesh:rama,
    tipo:"rama",
    recogible:true,
    cantidad:1
  });
}


/* PIEDRA PEQUEÑA */

function crearPiedraPequena(x,z){

  const p=new THREE.Mesh(
    new THREE.DodecahedronGeometry(.18),
    material(0x999999)
  );

  p.position.set(x,.16,z);

  escena.add(p);

  objetos.push({
    mesh:p,
    tipo:"piedraPequena",
    recogible:true,
    cantidad:1
  });
}


/* =========================
   GENERAR MUNDO
========================= */

for(let i=0;i<28;i++){

  let x=(Math.random()-.5)*80;
  let z=(Math.random()-.5)*80;

  if(Math.abs(x)<7 && Math.abs(z)<7){
    i--;
    continue;
  }

  let dureza=
    Math.random()<.5
    ?1
    :Math.random()<.75
    ?2
    :3;

  crearArbol(x,z,dureza);
}


for(let i=0;i<22;i++){

  let x=(Math.random()-.5)*80;
  let z=(Math.random()-.5)*80;

  crearRoca(
    x,z,
    Math.floor(Math.random()*3)+1
  );
}


for(let i=0;i<35;i++){

  let x=(Math.random()-.5)*55;
  let z=(Math.random()-.5)*55;

  crearRama(x,z);
}


for(let i=0;i<35;i++){

  let x=(Math.random()-.5)*55;
  let z=(Math.random()-.5)*55;

  crearPiedraPequena(x,z);
}


/* =========================
   FUNCIONES
========================= */

function mensaje(texto){

  const m=document.getElementById("mensaje");

  m.textContent=texto;
  m.style.opacity=1;

  clearTimeout(window.timerMensaje);

  window.timerMensaje=setTimeout(()=>{
    m.style.opacity=0;
  },1600);
}


function actualizarUI(){

  document.getElementById("madera").textContent=
    recursos.madera;

  document.getElementById("piedra").textContent=
    recursos.piedra;

  document.getElementById("hierro").textContent=
    recursos.hierro;

  document.getElementById("herramienta").textContent=
    herramienta.nombre;

  document.getElementById("durabilidad").textContent=
    herramienta.durabilidad===Infinity
    ?"∞"
    :Math.ceil(herramienta.durabilidad);
}


/* =========================
   RECOGER RAMAS / PIEDRAS
========================= */

function recogerCercano(){

  let mejor=null;
  let distanciaMin=2.5;

  for(const o of objetos){

    if(!o.recogible) continue;

    const d=jugador.position.distanceTo(
      o.mesh.position
    );

    if(d<distanciaMin){

      mejor=o;
      distanciaMin=d;
    }
  }

  if(!mejor) return false;

  if(mejor.tipo==="rama"){
    recursos.madera+=mejor.cantidad;
    mensaje("+1 madera");
  }

  if(mejor.tipo==="piedraPequena"){
    recursos.piedra+=mejor.cantidad;
    mensaje("+1 piedra");
  }

  escena.remove(mejor.mesh);

  const index=objetos.indexOf(mejor);

  if(index>=0)
    objetos.splice(index,1);

  actualizarUI();

  return true;
}


/* =========================
   GOLPEAR
========================= */

let golpeando=false;

function golpear(){

  if(golpeando) return;

  if(recogerCercano()) return;

  golpeando=true;

  const inicioRot=mano.rotation.x;

  let progreso=0;

  function animar(){

    progreso+=.18;

    mano.rotation.x=
      Math.sin(progreso*Math.PI)*-1.0;

    if(progreso<1){

      requestAnimationFrame(animar);

    }else{

      mano.rotation.x=inicioRot;

      golpeando=false;
    }
  }

  animar();


  let objetivo=null;
  let distanciaMin=3.2;

  for(const o of objetos){

    if(o.recogible) continue;

    const d=jugador.position.distanceTo(
      o.mesh.position
    );

    if(d<distanciaMin){

      objetivo=o;
      distanciaMin=d;
    }
  }

  if(!objetivo){

    mensaje("No hay nada cerca");

    return;
  }


  /* ÁRBOLES */

  if(objetivo.tipo==="arbol"){

    if(herramienta.tipo!=="hacha"){

      mensaje("Necesitas un hacha");

      return;
    }

    if(herramienta.nivel<objetivo.dureza){

      mensaje(
        "El árbol necesita un hacha nivel "+
        objetivo.dureza
      );

      return;
    }

    objetivo.vida-=
      herramienta.nivel>objetivo.dureza
      ?2
      :1;

    herramienta.durabilidad--;

    recursos.madera+=1;

    mensaje("+1 madera");

    if(objetivo.vida<=0){

      recursos.madera+=objetivo.madera;

      escena.remove(objetivo.mesh);

      const index=objetos.indexOf(objetivo);

      if(index>=0)
        objetos.splice(index,1);

      mensaje(
        "Árbol talado +"+
        objetivo.madera+
        " madera"
      );
    }
  }


  /* PIEDRA */

  if(objetivo.tipo==="piedra"){

    if(herramienta.tipo!=="pico"){

      mensaje("Necesitas un pico");

      return;
    }

    if(herramienta.nivel<objetivo.dureza){

      mensaje(
        "Necesitas pico nivel "+
        objetivo.dureza
      );

      return;
    }

    objetivo.vida-=
      herramienta.nivel>objetivo.dureza
      ?2
      :1;

    herramienta.durabilidad--;

    recursos.piedra++;

    mensaje("+1 piedra");

    if(objetivo.vida<=0){

      recursos.piedra+=objetivo.cantidad;

      escena.remove(objetivo.mesh);

      const index=objetos.indexOf(objetivo);

      if(index>=0)
        objetos.splice(index,1);

      mensaje(
        "Roca destruida +"+
        objetivo.cantidad+
        " piedra"
      );
    }
  }


  /* HIERRO */

  if(objetivo.tipo==="hierro"){

    if(herramienta.tipo!=="pico"){

      mensaje("Necesitas un pico");

      return;
    }

    if(herramienta.nivel<objetivo.dureza){

      mensaje(
        "Necesitas pico nivel "+
        objetivo.dureza
      );

      return;
    }

    objetivo.vida-=
      herramienta.nivel>objetivo.dureza
      ?2
      :1;

    herramienta.durabilidad--;

    recursos.hierro++;

    mensaje("+1 hierro");

    if(objetivo.vida<=0){

      recursos.hierro+=objetivo.cantidad;

      escena.remove(objetivo.mesh);

      const index=objetos.indexOf(objetivo);

      if(index>=0)
        objetos.splice(index,1);

      mensaje(
        "Hierro conseguido +"+
        objetivo.cantidad
      );
    }
  }


  if(
    herramienta.durabilidad<=0
  ){

    mensaje(
      herramienta.nombre+
      " se rompió"
    );

    herramienta={
      nombre:"Mano",
      tipo:"mano",
      nivel:0,
      durabilidad:Infinity,
      maxima:Infinity
    };

    actualizarHerramienta();
  }

  actualizarUI();
}


/* =========================
   CRAFTING
========================= */

function crearHachaPiedra(){

  if(
    recursos.madera<3 ||
    recursos.piedra<3
  ){

    mensaje("Faltan materiales");
    return;
  }

  recursos.madera-=3;
  recursos.piedra-=3;

  herramienta={
    nombre:"Hacha de piedra",
    tipo:"hacha",
    nivel:1,
    durabilidad:60,
    maxima:60
  };

  actualizarHerramienta();
  actualizarUI();

  mensaje("Hacha de piedra creada");
}


function crearPicoPiedra(){

  if(
    recursos.madera<3 ||
    recursos.piedra<4
  ){

    mensaje("Faltan materiales");
    return;
  }

  recursos.madera-=3;
  recursos.piedra-=4;

  herramienta={
    nombre:"Pico de piedra",
    tipo:"pico",
    nivel:1,
    durabilidad:60,
    maxima:60
  };

  actualizarHerramienta();
  actualizarUI();

  mensaje("Pico de piedra creado");
}


function crearHachaHierro(){

  if(
    recursos.madera<5 ||
    recursos.hierro<5
  ){

    mensaje("Faltan materiales");
    return;
  }

  recursos.madera-=5;
  recursos.hierro-=5;

  herramienta={
    nombre:"Hacha de hierro",
    tipo:"hacha",
    nivel:2,
    durabilidad:120,
    maxima:120
  };

  actualizarHerramienta();
  actualizarUI();

  mensaje("Hacha de hierro creada");
}


function crearPicoHierro(){

  if(
    recursos.madera<5 ||
    recursos.hierro<5
  ){

    mensaje("Faltan materiales");
    return;
  }

  recursos.madera-=5;
  recursos.hierro-=5;

  herramienta={
    nombre:"Pico de hierro",
    tipo:"pico",
    nivel:2,
    durabilidad:120,
    maxima:120
  };

  actualizarHerramienta();
  actualizarUI();

  mensaje("Pico de hierro creado");
}


/* =========================
   BOTONES
========================= */

document
.getElementById("golpear")
.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    golpear();
  }
);

document
.getElementById("abrirCraft")

/* =========================
   JOYSTICK
========================= */

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let movX=0;
let movY=0;
let joystickActivo=false;

function moverJoystick(e){

  const rect=
    joystick.getBoundingClientRect();

  const centroX=
    rect.left+rect.width/2;

  const centroY=
    rect.top+rect.height/2;

  let dx=e.clientX-centroX;
  let dy=e.clientY-centroY;

  const max=45;

  const distancia=
    Math.sqrt(dx*dx+dy*dy);

  if(distancia>max){

    dx=dx/distancia*max;
    dy=dy/distancia*max;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  movX=dx/max;
  movY=dy/max;
}


joystick.addEventListener(
  "pointerdown",
  e=>{

    joystickActivo=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    moverJoystick(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(!joystickActivo) return;

    moverJoystick(e);
  }
);

joystick.addEventListener(
  "pointerup",
  e=>{

    joystickActivo=false;

    movX=0;
    movY=0;

    stick.style.transform=
      "translate(0,0)";
  }
);

joystick.addEventListener(
  "pointercancel",
  e=>{

    joystickActivo=false;

    movX=0;
    movY=0;

    stick.style.transform=
      "translate(0,0)";
  }
);


/* =========================
   CORRER
========================= */

let corriendo=false;
let stamina=100;

const correr=
document.getElementById("correr");

correr.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    corriendo=true;
  }
);

function pararCorrer(){
  corriendo=false;
}

correr.addEventListener(

);

correr.addEventListener(
  "pointercancel",
  pararCorrer
);

correr.addEventListener(
  "pointerleave",

);


/* =========================
   CÁMARA TÁCTIL
========================= */

let tocandoCamara=false;
let ultimoX=0;
let ultimoY=0;

let yaw=0;
let pitch=0;

render.domElement.addEventListener(
  "pointerdown",
  e=>{

    tocandoCamara=true;

    ultimoX=e.clientX;
    ultimoY=e.clientY;

    render.domElement.setPointerCapture(
      e.pointerId
    );
  }
);

render.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!tocandoCamara) return;

    const dx=
      e.clientX-ultimoX;

    const dy=
      e.clientY-ultimoY;

    ultimoX=e.clientX;
    ultimoY=e.clientY;

    yaw-=dx*.006;
    pitch-=dy*.006;

    pitch=Math.max(
      -.9,
      Math.min(.9,pitch)
    );

    jugador.rotation.y=yaw;

    camara.rotation.x=pitch;
  }
);

render.domElement.addEventListener(
  "pointerup",
  ()=>{
    tocandoCamara=false;
  }
);

render.domElement.addEventListener(
  "pointercancel",
  ()=>{
    tocandoCamara=false;
  }
);


/* =========================
   MOVIMIENTO
========================= */

function actualizarMovimiento(){

  let velocidad=.09;

  if(corriendo && stamina>0){

    velocidad=.19;

    stamina-=.6;

  }else{

    stamina+=.35;
  }

  stamina=
    Math.max(
      0,
      Math.min(100,stamina)
    );

  if(stamina<=0)
    corriendo=false;


  if(Math.abs(movX)>.05 ||
     Math.abs(movY)>.05){

    const frente=
      new THREE.Vector3(
        0,
        0,
        -1
      );

    const derecha=
      new THREE.Vector3(
        1,
        0,
        0
      );

    frente.applyQuaternion(
      jugador.quaternion
    );

    derecha.applyQuaternion(
      jugador.quaternion
    );

    jugador.position.addScaledVector(
      frente,
      -movY*velocidad
    );

    jugador.position.addScaledVector(
      derecha,
      movX*velocidad
    );
  }

  document.getElementById(
    "stamina"
  ).style.width=
    stamina+"%";
}


/* =========================
   ANIMACIÓN
========================= */

function animar(){

  requestAnimationFrame(animar);

  actualizarMovimiento();

  render.render(
    escena,
    camara
  );
}

animar();
