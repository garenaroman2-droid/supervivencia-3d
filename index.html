<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Prueba táctil</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    touch-action: none;
}

#pantalla {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: Arial;
    font-size: 25px;
    text-align: center;
}
</style>
</head>

<body>

<div id="pantalla">
    TOCÁ Y ARRASTRÁ<br>
    AQUÍ
</div>

<script>

const pantalla = document.getElementById("pantalla");

let ultimoX = 0;
let ultimoY = 0;

pantalla.addEventListener("pointerdown", function(e) {

    ultimoX = e.clientX;
    ultimoY = e.clientY;

    pantalla.innerHTML =
        "TOQUE DETECTADO<br><br>" +
        "AHORA ARRASTRÁ";

});

pantalla.addEventListener("pointermove", function(e) {

    const dx = Math.abs(e.clientX - ultimoX);
    const dy = Math.abs(e.clientY - ultimoY);

    if (dx > 5 || dy > 5) {

        pantalla.innerHTML =
            "FUNCIONA<br><br>" +
            "EL CELULAR DETECTA EL ARRASTRE";

    }

    ultimoX = e.clientX;
    ultimoY = e.clientY;

});

</script>

</body>
</html>
