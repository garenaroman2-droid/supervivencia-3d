<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D V8.1</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;

html,body{
 margin:0;

}

#game{

button{

#hud{

#version{

}

#compass{

.btn{

}

#mapBtn{top:10px}
#invBtn{top:62px}

#joystick{
 position:fixed;
 left:22px;
 bottom:22px;

}

#stick{

}

.action{
 position:fixed;
 right:22px;
 z-index:30;

 height:55px;
 border:0;
 border-radius:14px;
 color:white;
 font-weight:bold;
}

#run{
 bottom:25px;
 background:#3b3b3b;
}

#hit{
 bottom:92px;
 background:#79251d;
}

#flagBtn{
 bottom:159px;
 background:#28633a;
}

#message{
 display:none;
 position:fixed;
 left:50%;
 bottom:20px;
 transform:translateX(-50%);
 z-index:70;
 background:rgba(0,0,0,.85);
 color:white;
 padding:11px 17px;
 border-radius:12px;
 text-align:center;
 max-width:85%;
}

#discover{
 display:none;
 position:fixed;
 left:50%;
 top:25%;
 transform:translateX(-50%);
 z-index:80;

 max-width:350px;
 background:rgba(0,0,0,.9);
 color:white;
 border:2px solid #e0bd45;
 border-radius:18px;
 padding:22px;
 text-align:center;
}

#discoverTitle{
 color:#ffd95a;
 font-size:22px;
 font-weight:bold;
}

#discoverName{
 font-size:20px;
 margin-top:10px;
}

#discoverDistance{
 color:#bbb;
 margin-top:8px;
}

.panel{
 display:none;
 position:fixed;
 inset:5%;
 z-index:100;
 background:rgba(12,18,12,.97);
 border:2px solid #777;
 border-radius:18px;
 overflow:hidden;
}

.close{
 position:absolute;
 top:10px;
 right:10px;
 z-index:5;
 border:0;
 border-radius:9px;
 padding:9px 12px;
 background:#333;
 color:white;
 font-weight:bold;
}

#mapCanvas{
 width:100%;
 height:100%;
 display:block;
}

#mapLegend{
 position:absolute;
 top:10px;
 left:10px;
 z-index:5;
 color:white;
 background:rgba(0,0,0,.72);
 padding:9px;
 border-radius:10px;
 font-size:12px;
 line-height:1.6;
}

#mapDistance{
 position:absolute;
 bottom:10px;
 left:10px;
 z-index:5;
 color:white;
 background:rgba(0,0,0,.72);
 padding:9px;
 border-radius:10px;
}

#inventory{
 color:white;
 padding:20px;
 font-size:16px;
}

#inventory h2{
 margin-top:0;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
 <div id="version">SUPERVIVENCIA 3D — V8.1</div>
 ❤️ Vida: <span id="hp">100</span><br>
 🪵 Madera: <span id="wood">0</span><br>
 🪨 Piedra: <span id="stone">0</span><br>
 🔩 Hierro: <span id="iron">0</span><br>
 🚩 Banderas: <span id="flags">5</span><br>
 📍 <span id="distanceBase">Base: 0 m</span>
</div>

<div id="compass">N</div>

<button class="btn" id="mapBtn">🗺️ MAPA</button>
<button class="btn" id="invBtn">🎒 INVENTARIO</button>

<div id="joystick">
 <div id="stick"></div>
</div>

<button class="action" id="flagBtn">🚩 BANDERA</button>
<button class="action" id="hit">⛏️ GOLPEAR</button>
<button class="action" id="run">CORRER</button>

<div id="message"></div>

<div id="discover">
 <div id="discoverTitle">¡LUGAR DESCUBIERTO!</div>
 <div id="discoverName"></div>
 <div id="discoverDistance"></div>
</div>

<div class="panel" id="mapPanel">

 <button class="close" id="closeMap">CERRAR</button>

 <div id="mapLegend">
  🟢 Jugador<br>
  🔴 Base<br>
  🚩 Bandera<br>
  🔵 Lugar descubierto
 </div>

 <canvas id="mapCanvas"></canvas>

 <div id="mapDistance"></div>

</div>

<div class="panel" id="inventoryPanel">

 <button class="close" id="closeInv">CERRAR</button>

 <div id="inventory">

  <h2>🎒 INVENTARIO</h2>

  🪵 Madera: <span id="iWood">0</span><br><br>
  🪨 Piedra: <span id="iStone">0</span><br><br>
  🔩 Hierro: <span id="iIron">0</span><br><br>
  🚩 Banderas: <span id="iFlags">0</span><br><br>

  🗺️ Lugares descubiertos:
  <span id="iPlaces">0</span>

 </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   SUPERVIVENCIA 3D V8.1
   EXPLORACIÓN / BANDERAS / MAPA / DESCUBRIMIENTO
===================================================== */

const SAVE_KEY="SURVIVAL_V81";

let scene;
let camera;
let renderer;

let player={
 x:0,
 z:0,
 y:1.7,
 hp:100
};

const BASE={
 x:0,
 z:0
};

let wood=0;
let stone=0;
let iron=0;
let flags=5;

let discovered=[];
let customFlags=[];

let resources=[];

let places=[];

let yaw=0;
let pitch=-0.15;

let joyX=0;
let joyY=0;

let running=false;

let cameraDragging=false;
let lastPointerX=0;
let lastPointerY=0;

let lastTime=performance.now();

/* =====================================================
   GUARDADO
===================================================== */

function saveGame(){

 localStorage.setItem(
  SAVE_KEY,
  JSON.stringify({
   player:{
    x:player.x,
    z:player.z,
    hp:player.hp
   },
   wood,
   stone,
   iron,
   flags,
   discovered,
   customFlags
  })
 );

}

function loadGame(){

 const raw=localStorage.getItem(SAVE_KEY);

 if(!raw)return;

 try{

  const data=JSON.parse(raw);

  if(data.player){

   player.x=data.player.x||0;
   player.z=data.player.z||0;
   player.hp=data.player.hp||100;

  }

  wood=data.wood||0;
  stone=data.stone||0;
  iron=data.iron||0;
  flags=data.flags===undefined?5:data.flags;

  discovered=data.discovered||[];
  customFlags=data.customFlags||[];

 }catch(e){

  console.log("No se pudo cargar partida");

 }

}

loadGame();

/* =====================================================
   THREE
===================================================== */

scene=new THREE.Scene();

scene.background=new THREE.Color(0x8ec6e8);

scene.fog=new THREE.Fog(
 0x8ec6e8,
 80,
 650
);

camera=new THREE.PerspectiveCamera(
 70,
 innerWidth/innerHeight,
 .1,
 2000
);

renderer=new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;

document
 .getElementById("game")
 .appendChild(renderer.domElement);

/* LUZ */

const hemi=new THREE.HemisphereLight(
 0xcfeeff,
 0x35442b,
 1.6
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
 0xffffff,
 1.4
);

sun.position.set(
 100,
 150,
 70
);

sun.castShadow=true;

scene.add(sun);

/* =====================================================
   TERRENO 5 KM
===================================================== */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(
  5000,
  5000
 ),
 new THREE.MeshStandardMaterial({
  color:0x4b6d3b
 })
);

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);

/* =====================================================
   CAMINOS
===================================================== */

function createRoad(x,z,w,d){

 const road=new THREE.Mesh(
  new THREE.BoxGeometry(
   w,
   .05,
   d
  ),
  new THREE.MeshStandardMaterial({
   color:0x625a4e
  })
 );

 road.position.set(
  x,
  .025,
  z
 );

 scene.add(road);

}

/* caminos grandes */

createRoad(
 500,
 0,
 30,
 1500
);

createRoad(
 0,
 500,
 1500,
 30
);

createRoad(
 -900,
 -800,
 25,
 800
);

/* =====================================================
   ÁRBOLES
===================================================== */

function createTree(x,z,level){

 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .35+level*.12,
   .55+level*.16,
   4+level,
   8
  ),
  new THREE.MeshStandardMaterial({
   color:0x60412b
  })
 );

 trunk.position.y=2;

 group.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(
   2.3+level*.8,
   5+level,
   8
  ),
  new THREE.MeshStandardMaterial({
   color:
    level===1?0x376c35:
    level===2?0x28562c:
    0x183e20
  })
 );

 crown.position.y=5.2;

 group.add(crown);

 group.position.set(
  x,
  0,
  z
 );

 group.traverse(o=>{

  if(o.isMesh){

   o.castShadow=true;
   o.receiveShadow=true;

  }

 });

 scene.add(group);

 resources.push({
  type:"tree",
  x,
  z,
  level,
  mesh:group
 });

}

/* =====================================================
   ROCAS
===================================================== */

function createRock(x,z,level){

 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(
   1+level*.35,
   1
  ),
  new THREE.MeshStandardMaterial({
   color:
    level===1?0x777777:
    level===2?0x56595b:
    0x36383a
  })
 );

 rock.position.set(
  x,
  1,
  z
 );

 rock.scale.y=.7;

 rock.castShadow=true;

 scene.add(rock);

 resources.push({
  type:"rock",
  x,
  z,
  level,
  mesh:rock
 });

}

/* =====================================================
   VEGETACIÓN
===================================================== */

function createGrass(x,z){

 const grass=new THREE.Mesh(
  new THREE.ConeGeometry(
   .12,
   .8,
   4
  ),
  new THREE.MeshStandardMaterial({
   color:0x5d8139
  })
 );

 grass.position.set(
  x,
  .4,
  z
 );

 scene.add(grass);

}

function createBush(x,z){

 const bush=new THREE.Mesh(
  new THREE.SphereGeometry(
   .7+Math.random()*.5,
   8,
   8
  ),
  new THREE.MeshStandardMaterial({
   color:0x315d30
  })
 );

 bush.position.set(
  x,
  .7,
  z
 );

 scene.add(bush);

}

/* =====================================================
   CASA DETALLADA
===================================================== */

function createHouse(x,z,w,d){

 const group=new THREE.Group();

 const wallMat=
  new THREE.MeshStandardMaterial({
   color:0xaaa08d
  });

 const roofMat=
  new THREE.MeshStandardMaterial({
   color:0x4b3c34
  });

 function wall(px,pz,pw,pd){

  const wall=new THREE.Mesh(
   new THREE.BoxGeometry(
    pw,
    4,
    pd
   ),
   wallMat
  );

  wall.position.set(
   px,
   2,
   pz
  );

  wall.castShadow=true;

  group.add(wall);

 }

 wall(
  0,
  -d/2,
  w,
  .5
 );

 wall(
  0,
  d/2,
  w,
  .5
 );

 wall(
  -w/2,
  0,
  .5,
  d
 );

 wall(
  w/2,
  0,
  .5,
  d
 );

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(
   w+1,
   1,
   d+1
  ),
  roofMat
 );

 roof.position.y=4.5;

 roof.castShadow=true;

 group.add(roof);

 /* puerta */

 const door=new THREE.Mesh(
  new THREE.BoxGeometry(
   1.8,
   2.8,
   .2
  ),
  new THREE.MeshStandardMaterial({
   color:0x54351f
  })
 );

 door.position.set(
  0,
  1.4,
  d/2+.25
 );

 group.add(door);

 /* ventanas */

 const glass=
  new THREE.MeshStandardMaterial({
   color:0x8bd4e5,
   roughness:.2,
   metalness:.1
  });

 [-w*.3,w*.3].forEach(px=>{

  const win=new THREE.Mesh(
   new THREE.BoxGeometry(
    1.7,
    1.3,
    .15
   ),
   glass
  );

  win.position.set(
   px,
   2.2,
   d/2+.25
  );

  group.add(win);

 });

 group.position.set(
  x,
  0,
  z
 );

 scene.add(group);

}

/* =====================================================
   LUGARES
===================================================== */

function registerPlace(
 name,
 x,
 z,
 type
){

 places.push({
  name,
  x,
  z,
  type
 });

}

/* =====================================================
   BASE
===================================================== */

createHouse(
 0,
 -12,
 15,
 12
);

registerPlace(
 "BASE",
 BASE.x,
 BASE.z,
 "base"
);

/* =====================================================
   GRANJA LEJANA
===================================================== */

const farmX=-650;
const farmZ=550;

createHouse(
 farmX,
 farmZ,
 16,
 12
);

for(let i=0;i<8;i++){

 for(let j=0;j<5;j++){

  createGrass(
   farmX-28+i*8,
   farmZ+25+j*4
  );

 }

}

registerPlace(
 "Granja Verde",
 farmX,
 farmZ,
 "farm"
);

/* =====================================================
   CIUDAD
===================================================== */

const cityX=900;
const cityZ=-700;

for(let i=0;i<16;i++){

 const angle=
  Math.random()*Math.PI*2;

 const radius=
  100+Math.random()*260;

 const x=
  cityX+
  Math.cos(angle)*radius;

 const z=
  cityZ+
  Math.sin(angle)*radius;

 createHouse(
  x,
  z,
  11+Math.random()*8,
  9+Math.random()*7
 );

}

createRoad(
 cityX,
 cityZ,
 700,
 25
);

createRoad(
 cityX,
 cityZ,
 25,
 700
);

registerPlace(
 "Ciudad Vieja",
 cityX,
 cityZ,
 "city"
);

/* =====================================================
   OTROS LUGARES
===================================================== */

registerPlace(
 "Bosque del Norte",
 -1000,
 -1100,
 "forest"
);

registerPlace(
 "Lago Perdido",
 1250,
 900,
 "lake"
);

registerPlace(
 "Casa Abandonada",
 -1350,
 950,
 "house"
);

registerPlace(
 "Mina Vieja",
 1450,
 -1250,
 "mine"
);

/* =====================================================
   GENERACIÓN DEL MUNDO
===================================================== */

for(let i=0;i<180;i++){

 let x=
  (Math.random()-.5)*4800;

 let z=
  (Math.random()-.5)*4800;

 if(
  Math.hypot(x,z)<100
 )continue;

 createTree(
  x,
  z,
  1+Math.floor(
   Math.random()*3
  )
 );

}

for(let i=0;i<120;i++){

 createRock(
  (Math.random()-.5)*4800,
  (Math.random()-.5)*4800,
  1+Math.floor(
   Math.random()*3
  )
 );

}

for(let i=0;i<1000;i++){

 createGrass(
  (Math.random()-.5)*4800,
  (Math.random()-.5)*4800
 );

}

for(let i=0;i<250;i++){

 createBush(
  (Math.random()-.5)*4800,
  (Math.random()-.5)*4800
 );

}

/* =====================================================
   BANDERAS
===================================================== */

function createFlag(
 x,
 z,
 color=0xffd329
){

 const group=new THREE.Group();

 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .08,
   .08,
   4,
   8
  ),
  new THREE.MeshStandardMaterial({
   color:0x303030
  })
 );

 pole.position.y=2;

 group.add(pole);

 const cloth=new THREE.Mesh(
  new THREE.PlaneGeometry(
   2.1,
   1.2
  ),
  new THREE.MeshStandardMaterial({
   color,
   side:THREE.DoubleSide
  })
 );

 cloth.position.set(
  1,
  3.3,
  0
 );

 group.add(cloth);

 group.position.set(
  x,
  0,
  z
 );

 scene.add(group);

 return group;

}

/* bandera base */

createFlag(
 BASE.x,
 BASE.z,
 0xff3030
);

/* banderas guardadas */

for(const f of customFlags){

 createFlag(
  f.x,
  f.z,
  0xffd329
 );

}

/* =====================================================
   CÁMARA
===================================================== */

function updateCamera(){

 camera.position.set(
  player.x,
  player.y,
  player.z
 );

 const target=new THREE.Vector3(
  Math.sin(yaw),
  Math.sin(pitch),
  Math.cos(yaw)
 );

 camera.lookAt(
  camera.position.clone().add(target)
 );

}

/* =====================================================
   MOVIMIENTO
===================================================== */

function updateMovement(dt){

 const speed=
  running?8:4;

 const forward=-joyY;
 const side=joyX;

 const sin=Math.sin(yaw);
 const cos=Math.cos(yaw);

 player.x+=
  (
   side*cos+
   forward*sin
  )*
  speed*
  dt;

 player.z+=
  (
   side*-sin+
   forward*cos
  )*
  speed*
  dt;

 /* límite 2.5 km desde el centro */

 player.x=Math.max(
  -2450,
  Math.min(2450,player.x)
 );

 player.z=Math.max(
  -2450,
  Math.min(2450,player.z)
 );

}

/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
 document.getElementById(
  "joystick"
 );

const stick=
 document.getElementById(
  "stick"
 );

let joystickActive=false;

joystick.addEventListener(
 "pointerdown",
 e=>{

  joystickActive=true;

  joystick.setPointerCapture(
   e.pointerId
  );

  updateJoystick(e);

 }
);

joystick.addEventListener(
 "pointermove",
 e=>{

  if(
   joystickActive
  ){

   updateJoystick(e);

  }

 }
);

joystick.addEventListener(
 "pointerup",
 ()=>{
  joystickActive=false;
  joyX=0;
  joyY=0;

  stick.style.left="33px";
  stick.style.top="33px";
 }
);

function updateJoystick(e){

 const r=
  joystick.getBoundingClientRect();

 let x=
  e.clientX-
  (r.left+r.width/2);

 let y=
  e.clientY-
  (r.top+r.height/2);

 const max=42;

 const distance=
  Math.hypot(x,y);

 if(distance>max){

  x=x/distance*max;
  y=y/distance*max;

 }

 joyX=x/max;
 joyY=y/max;

 stick.style.left=
  (33+x)+"px";

 stick.style.top=
  (33+y)+"px";

}

/* =====================================================
   CÁMARA TÁCTIL
===================================================== */

renderer.domElement.addEventListener(
 "pointerdown",
 e=>{

  if(e.clientX<170)return;

  cameraDragging=true;

  lastPointerX=e.clientX;
  lastPointerY=e.clientY;

 }
);

renderer.domElement.addEventListener(
 "pointermove",
 e=>{

  if(!cameraDragging)return;

  const dx=
   e.clientX-lastPointerX;

  const dy=
   e.clientY-lastPointerY;

  yaw-=dx*.008;

  pitch-=dy*.006;

  pitch=Math.max(
   -.9,
   Math.min(.5,pitch)
  );

  lastPointerX=e.clientX;
  lastPointerY=e.clientY;

 }
);

renderer.domElement.addEventListener(
 "pointerup",
 ()=>{
  cameraDragging=false;
 }
);

renderer.domElement.addEventListener(
 "pointercancel",
 ()=>{
  cameraDragging=false;
 }
);

/* =====================================================
   CORRER
===================================================== */

const runBtn=
 document.getElementById(
  "run"
 );

runBtn.addEventListener(
 "pointerdown",
 ()=>{
  running=true;
 }
);

runBtn.addEventListener(
 "pointerup",
 ()=>{
  running=false;
 }
);

runBtn.addEventListener(
 "pointercancel",
 ()=>{
  running=false;
 }
);

/* =====================================================
   DISTANCIA
===================================================== */

function getBaseDistance(){

 const meters=
  Math.hypot(
   player.x-BASE.x,
   player.z-BASE.z
  );

 return meters;

}

function formatDistance(meters){

 if(meters>=1000){

  return(
   (meters/1000)
   .toFixed(2)+
   " km"
  );

 }

 return(
  Math.round(meters)+
  " m"
 );

}

/* =====================================================
   DESCUBRIR LUGARES
===================================================== */

function checkPlaces(){

 for(const place of places){

  if(place.type==="base")continue;

  const distance=
   Math.hypot(
    player.x-place.x,
    player.z-place.z
   );

  if(distance<=90){

   const found=
    discovered.some(
     d=>d.name===place.name
    );

   if(!found){

    discovered.push({
     name:place.name,
     x:place.x,
     z:place.z,
     type:place.type
    });

    showDiscovery(
     place.name,
     formatDistance(
      Math.hypot(
       place.x-BASE.x,
       place.z-BASE.z
      )
     )
    );

    saveGame();

   }

  }

 }

}

/* =====================================================

===================================================== */

function showDiscovery(

){

   "discover"
  );

 ).innerText=name;

 document.getElementById(

/* =====================================================
   BANDERA
===================================================== */

document
 .getElementById("flagBtn")
 .addEventListener(
  "click",
  ()=>{

   if(flags<=0){

    showMessage(
     "No te quedan banderas."
    );

    return;

   }

   const name=
    prompt(
     "¿Qué querés marcar acá?",
     "Mi lugar"
    );

   if(
    !name||
    !name.trim()
   )return;

   const f={
    name:name.trim(),
    x:Math.round(player.x),
    z:Math.round(player.z)
   };

   customFlags.push(f);

   createFlag(
    f.x,
    f.z
   );

   flags--;

   saveGame();

   showMessage(
    "🚩 "+f.name+
    " marcada a "+
    formatDistance(
     Math.hypot(
      f.x-BASE.x,
      f.z-BASE.z
     )
    )+
    " de la base"
   );

   updateHUD();

  }
 );

/* =====================================================
   GOLPEAR / RECURSOS
===================================================== */

document
 .getElementById("hit")
 .addEventListener(
  "click",
  ()=>{

   let nearest=null;
   let nearestDistance=9999;

   for(const r of resources){

    if(
     !r.mesh.visible
    )continue;

    const d=
     Math.hypot(
      r.x-player.x,
      r.z-player.z
     );

    if(
     d<nearestDistance
    ){

     nearest=r;
     nearestDistance=d;

    }

   }

   if(
    !nearest||
    nearestDistance>5
   ){

    showMessage(
     "No hay recursos cerca."
    );

    return;

   }

   if(
    nearest.type==="tree"
   ){

    wood+=
     nearest.level;

    showMessage(
     "🪵 +"+
     nearest.level+
     " madera"
    );

   }

   if(
    nearest.type==="rock"
   ){

    stone+=
     nearest.level;

    showMessage(
     "🪨 +"+
     nearest.level+
     " piedra"
    );

   }

   nearest.mesh.visible=false;

   saveGame();

   updateHUD();

  }
 );

/* =====================================================
   BRÚJULA
===================================================== */

function updateCompass(){

 let degrees=
  yaw*180/Math.PI;

 degrees=
  (degrees%360+360)%360;

 let direction="N";

 if(
  degrees>=22.5&&
  degrees<67.5
 )direction="NE";

 else if(
  degrees>=67.5&&
  degrees<112.5
 )direction="E";

 else if(
  degrees>=112.5&&
  degrees<157.5
 )direction="SE";

 else if(
  degrees>=157.5&&
  degrees<202.5
 )direction="S";

 else if(
  degrees>=202.5&&
  degrees<247.5
 )direction="SO";

 else if(
  degrees>=247.5&&
  degrees<292.5
 )direction="O";

 else if(
  degrees>=292.5&&
  degrees<337.5
 )direction="NO";

 document.getElementById(
  "compass"
 ).innerText=
  direction+
  " · "+
  Math.round(degrees)+"°";

}

/* =====================================================
   MAPA
===================================================== */

const mapPanel=
 document.getElementById(
  "mapPanel"
 );

const mapCanvas=
 document.getElementById(
  "mapCanvas"
 );

const mapCtx=
 mapCanvas.getContext("2d");

document
 .getElementById("mapBtn")
 .addEventListener(
  "click",
  ()=>{

   mapPanel.style.display="block";

   setTimeout(
    drawMap,
    50
   );

  }
 );

document
 .getElementById("closeMap")
 .addEventListener(
  "click",
  ()=>{
   mapPanel.style.display="none";
  }
 );

function drawMap(){

 mapCanvas.width=
  mapCanvas.clientWidth;

 mapCanvas.height=
  mapCanvas.clientHeight;

 const w=
  mapCanvas.width;

 const h=
  mapCanvas.height;

 mapCtx.fillStyle="#273b25";

 mapCtx.fillRect(
  0,
  0,
  w,
  h
 );

 /*
   5000m de mundo.
   Escala para visualizarlo.
 */

 const scale=
  Math.min(w,h)/
  5000;

 function mapPosition(
  x,
  z
 ){

  return{
   x:w/2+x*scale,
   y:h/2+z*scale
  };

 }

 /* cuadrícula */

 mapCtx.strokeStyle=
  "rgba(255,255,255,.08)";

 mapCtx.lineWidth=1;

 const gridStep=
  500*scale;

 for(
  let x=w/2%gridStep;
  x<w;
  x+=gridStep
 ){

  mapCtx.beginPath();

  mapCtx.moveTo(
   x,
   0
  );

  mapCtx.lineTo(
   x,
   h
  );

  mapCtx.stroke();

 }

 for(
  let y=h/2%gridStep;
  y<h;
  y+=gridStep
 ){

  mapCtx.beginPath();

  mapCtx.moveTo(
   0,
   y
  );

  mapCtx.lineTo(
   w,
   y
  );

  mapCtx.stroke();

 }

 /* BASE */

 const base=
  mapPosition(
   BASE.x,
   BASE.z
  );

 mapCtx.fillStyle="#ff3030";

 mapCtx.beginPath();

 mapCtx.arc(
  base.x,
  base.y,
  8,
  0,
  Math.PI*2
 );

 mapCtx.fill();

 mapCtx.fillStyle="white";

 mapCtx.font=
  "bold 12px Arial";

 mapCtx.fillText(
  "BASE",
  base.x+12,
  base.y
 );

 /* BANDERAS */

 for(
  const f of customFlags
 ){

  const p=
   mapPosition(
    f.x,
    f.z
   );

  mapCtx.fillStyle=
   "#ffd52f";

  mapCtx.beginPath();

  mapCtx.arc(
   p.x,
   p.y,
   6,
   0,
   Math.PI*2
  );

  mapCtx.fill();

  mapCtx.fillStyle=
   "white";

  mapCtx.font=
   "11px Arial";

  mapCtx.fillText(
   "🚩 "+f.name,
   p.x+9,
   p.y
  );

 }

 /* DESCUBIERTOS */

 for(
  const d of discovered
 ){

  const p=
   mapPosition(
    d.x,
    d.z
   );

  mapCtx.fillStyle=
   "#57a8ff";

  mapCtx.fillRect(
   p.x-5,
   p.y-5,
   10,
   10
  );

  mapCtx.fillStyle=
   "white";

  mapCtx.font=
   "11px Arial";

  mapCtx.fillText(
   d.name,
   p.x+9,
   p.y
  );

 }

 /* JUGADOR */

 const me=
  mapPosition(
   player.x,
   player.z
  );

 mapCtx.fillStyle=
  "#00ff62";

 mapCtx.beginPath();

 mapCtx.arc(
  me.x,
  me.y,
  8,
  0,
  Math.PI*2
 );

 mapCtx.fill();

 /* dirección */

 mapCtx.strokeStyle=
  "#00ff62";

 mapCtx.lineWidth=3;

 mapCtx.beginPath();

 mapCtx.moveTo(
  me.x,
  me.y
 );

 mapCtx.lineTo(
  me.x+
  Math.sin(yaw)*25,
  me.y+
  Math.cos(yaw)*25
 );

 mapCtx.stroke();

 const distance=
  getBaseDistance();

 document.getElementById(
  "mapDistance"
 ).innerText=
  "Distancia a base: "+
  formatDistance(distance);

}

/* =====================================================
   LOOP
===================================================== */

function animate(){

 requestAnimationFrame(
  animate
 );

 const now=
  performance.now();

 const dt=
  Math.min(
   (now-lastTime)/1000,
   .05
  );

 lastTime=now;

 updateMovement(dt);

 updateCamera();

 updateCompass();

 updateHUD();

 checkPlaces();

 renderer.render(
  scene,
  camera
 );

}

animate();

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);
