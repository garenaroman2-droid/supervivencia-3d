<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Supervivencia 3D</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}
canvas{display:block}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:10;
  color:#fff;
  background:#0009;
  padding:10px 14px;
  border-radius:12px;
  line-height:1.5;
}

#info{
  position:fixed;
  top:12px;
  right:12px;
  z-index:10;
  color:#fff;
  background:#0009;
  padding:9px;
  border-radius:12px;
  font-size:12px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#fff;
  font-size:25px;
  z-index:5;
  pointer-events:none;
}

#joystick{
  position:fixed;
  left:22px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:#ffffff25;
  border:2px solid #ffffff45;
  z-index:20;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:#ffffff90;
}

#build{
  position:fixed;
  right:20px;
  bottom:35px;
  width:105px;
  height:55px;
  border:0;
  border-radius:15px;
  background:#e39a2f;
  color:#fff;
  font-weight:bold;
  z-index:20;
}

#lookArea{
  position:fixed;
  right:0;
  top:0;
  width:65%;
  height:100%;
  z-index:2;
}
</style>
</head>

<body>

<div id="hud">
🪵 Madera: <span id="wood">0</span><br>
🪨 Piedra: <span id="stone">0</span>
</div>

<div id="info">
Arrastrá el lado derecho<br>
para mirar
</div>

<div id="crosshair">+</div>

<div id="lookArea"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="build">🔥 FOGATA</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let player;

let trees=[];
let rocks=[];
let campfires=[];

let wood=0;
let stone=0;

let moveX=0;
let moveZ=0;

let yaw=0;
let pitch=0;

let looking=false;
let lastX=0;
let lastY=0;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const lookArea=document.getElementById("lookArea");

init();
animate();

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x87ceeb);

  scene.fog=new THREE.Fog(
    0x87ceeb,
    30,
    150
  );

  camera=new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    500
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  document.body.appendChild(
    renderer.domElement
  );

  const hemi=new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    2
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xffffff,
    2
  );

  sun.position.set(
    30,
    60,
    20
  );

  scene.add(sun);

  // SUELO

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(300,300),
    new THREE.MeshStandardMaterial({
      color:0x4d8a45
    })
  );

  ground.rotation.x=-Math.PI/2;

  scene.add(ground);

  // JUGADOR

  player=new THREE.Object3D();

  player.position.set(
    0,
    1.7,
    8
  );

  scene.add(player);

  player.add(camera);

  camera.position.set(
    0,
    0,
    0
  );

  createWorld();

  setupJoystick();

  setupCameraControls();

  document
    .getElementById("build")
    .addEventListener(
      "click",
      buildCampfire
    );

  window.addEventListener(
    "resize",
    resize
  );
}

function createWorld(){

  for(let i=0;i<55;i++){

    const x=
      (Math.random()-.5)*140;

    const z=
      (Math.random()-.5)*140;

    if(
      Math.abs(x)<10 &&
      Math.abs(z)<10
    ) continue;

    createTree(x,z);
  }

  for(let i=0;i<40;i++){

    const x=
      (Math.random()-.5)*140;

    const z=
      (Math.random()-.5)*140;

    if(
      Math.abs(x)<10 &&
      Math.abs(z)<10
    ) continue;

    createRock(x,z);
  }
}

function createTree(x,z){

  const tree=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35,
      .45,
      4
    ),
    new THREE.MeshStandardMaterial({
      color:0x6b3e1e
    })
  );

  trunk.position.y=2;

  tree.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.SphereGeometry(
      2.2,
      10,
      10
    ),
    new THREE.MeshStandardMaterial({
      color:0x176b2c
    })
  );

  leaves.position.y=4.5;

  tree.add(leaves);

  tree.position.set(
    x,
    0,
    z
  );

  scene.add(tree);

  trees.push(tree);
}

function createRock(x,z){

  const rock=new THREE.Mesh(
    new THREE.DodecahedronGeometry(1),
    new THREE.MeshStandardMaterial({
      color:0x777777
    })
  );

  rock.position.set(
    x,
    .7,
    z
  );

  rock.scale.set(
    1.2,
    .8,
    1
  );

  scene.add(rock);

  rocks.push(rock);
}

function setupJoystick(){

  function updateStick(touch){

    const rect=
      joystick.getBoundingClientRect();

    let x=
      touch.clientX -
      (rect.left+rect.width/2);

    let y=
      touch.clientY -
      (rect.top+rect.height/2);

    const max=45;

    const distance=
      Math.sqrt(x*x+y*y);

    if(distance>max){

      x=x/distance*max;
      y=y/distance*max;

    }

    stick.style.left=
      (33+x)+"px";

    stick.style.top=
      (33+y)+"px";

    moveX=x/max;
    moveZ=y/max;
  }

  joystick.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      updateStick(e.touches[0]);
    },
    {passive:false}
  );

  joystick.addEventListener(
    "touchmove",
    e=>{
      e.preventDefault();
      updateStick(e.touches[0]);
    },
    {passive:false}
  );

  joystick.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();

      moveX=0;
      moveZ=0;

      stick.style.left="33px";
      stick.style.top="33px";
    },
    {passive:false}
  );
}

function setupCameraControls(){

  lookArea.addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      looking=true;

      lastX=e.touches[0].clientX;
      lastY=e.touches[0].clientY;

    },
    {passive:false}
  );

  lookArea.addEventListener(
    "touchmove",
    e=>{

      e.preventDefault();

      if(!looking)return;

      const touch=e.touches[0];

      const dx=
        touch.clientX-lastX;

      const dy=
        touch.clientY-lastY;

      lastX=touch.clientX;
      lastY=touch.clientY;

      yaw-=dx*0.006;

      pitch-=dy*0.006;

      const limit=1.35;

      pitch=Math.max(
        -limit,
        Math.min(limit,pitch)
      );

      player.rotation.y=yaw;

      camera.rotation.x=pitch;

    },
    {passive:false}
  );

  lookArea.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      looking=false;
    },
    {passive:false}
  );
}

function collect(){

  for(
    let i=trees.length-1;
    i>=0;
    i--
  ){

    if(
      player.position.distanceTo(
        trees[i].position
      )<3
    ){

      wood+=2;

      document.getElementById(
        "wood"
      ).textContent=wood;

      scene.remove(
        trees[i]
      );

      trees.splice(i,1);

      return;
    }
  }

  for(
    let i=rocks.length-1;
    i>=0;
    i--
  ){

    if(
      player.position.distanceTo(
        rocks[i].position
      )<3
    ){

      stone+=2;

      document.getElementById(
        "stone"
      ).textContent=stone;

      scene.remove(
        rocks[i]
      );

      rocks.splice(i,1);

      return;
    }
  }
}

function buildCampfire(){

  if(
    wood<3 ||
    stone<2
  ){

    alert(
      "Necesitás 3 madera y 2 piedra"
    );

    return;
  }

  wood-=3;
  stone-=2;

  document.getElementById(
    "wood"
  ).textContent=wood;

  document.getElementById(
    "stone"
  ).textContent=stone;

  const fire=new THREE.Group();

  const base=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .7,
      .8,
      .3,
      10
    ),
    new THREE.MeshStandardMaterial({
      color:0x555555
    })
  );

  fire.add(base);

  const flame=new THREE.Mesh(
    new THREE.ConeGeometry(
      .45,
      1.5,
      8
    ),
    new THREE.MeshBasicMaterial({
      color:0xff6a00
    })
  );

  flame.position.y=.9;

  fire.add(flame);

  fire.position.copy(
    player.position
  );

  fire.position.y=0;

  scene.add(fire);

  campfires.push(fire);
}

function update(){

  const speed=.13;

  // MOVIMIENTO SEGÚN LA CÁMARA

  const forwardX=
    -Math.sin(yaw);

  const forwardZ=
    -Math.cos(yaw);

  const rightX=
    Math.cos(yaw);

  const rightZ=
    -Math.sin(yaw);

  player.position.x +=
    (
      rightX*moveX +
      forwardX*(-moveZ)
    )*speed;

  player.position.z +=
    (
      rightZ*moveX +
      forwardZ*(-moveZ)
    )*speed;

  collect();
}

function animate(){

  requestAnimationFrame(
    animate
  );

  update();

  renderer.render(
    scene,
    camera
  );
}

function resize(){

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
}

</script>

</body>
</html>
