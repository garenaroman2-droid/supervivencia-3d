<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Supervivencia 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    user-select:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

/* HUD */

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:15px;
    line-height:1.5;
    text-shadow:2px 2px 4px #000;
    pointer-events:none;
}

#mensaje{
    margin-top:5px;
    font-size:12px;
}

/* CRUZ */

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font:26px Arial;
    z-index:10;
    pointer-events:none;
    text-shadow:0 0 5px #000;
}

/* JOYSTICK */

#joystick{
    position:fixed;
    left:22px;
    bottom:28px;
    width:135px;
    height:135px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.22);
    z-index:30;
    touch-action:none;
}

#stick{
    position:absolute;
    width:58px;
    height:58px;
    left:35px;
    top:35px;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    box-shadow:0 0 15px rgba(255,255,255,.25);
}

/* BOTÓN */

#boton{
    position:fixed;
    right:25px;
    bottom:35px;
    width:92px;
    height:92px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.8);
    background:rgba(170,55,15,.75);
    color:white;
    font-size:13px;
    font-weight:bold;
    z-index:30;
    touch-action:none;
}

/* AYUDA */

#ayuda{
    position:fixed;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font:11px Arial;
    text-shadow:2px 2px 4px #000;
    z-index:20;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="hud">
    MADERA: <span id="madera">0</span><br>
    PIEDRA: <span id="piedra">0</span><br>
    COMIDA: <span id="comida">0</span>
    <div id="mensaje">Explorá el bosque</div>
</div>

<div id="crosshair">+</div>

<div id="ayuda">
    IZQUIERDA: MOVER · DERECHA: MIRAR
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="boton">FOGATA</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   ESCENA
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x82b9d9);

scene.fog = new THREE.Fog(
    0x82b9d9,
    35,
    150
);


/* =====================================================
   CÁMARA
===================================================== */

const camera = new THREE.PerspectiveCamera(
    72,
    window.innerWidth / window.innerHeight,
    0.05,
    500
);

camera.position.set(0,1.65,0);


/* =====================================================
   RENDER
===================================================== */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.8)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.domElement.style.touchAction =
    "none";

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   ILUMINACIÓN
===================================================== */

const luzAmbiente =
    new THREE.HemisphereLight(
        0xbde5ff,
        0x24351e,
        1.6
    );

scene.add(luzAmbiente);


const sol =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sol.position.set(
    50,
    90,
    30
);

sol.castShadow = true;

sol.shadow.mapSize.width = 1024;
sol.shadow.mapSize.height = 1024;

sol.shadow.camera.near = 1;
sol.shadow.camera.far = 250;

sol.shadow.camera.left = -100;
sol.shadow.camera.right = 100;
sol.shadow.camera.top = 100;
sol.shadow.camera.bottom = -100;

scene.add(sol);


/* =====================================================
   JUGADOR
===================================================== */

const jugador =
    new THREE.Object3D();

jugador.position.set(
    0,
    1.65,
    0
);

scene.add(jugador);

jugador.add(camera);


/* =====================================================
   TERRENO
===================================================== */

const terrenoGeo =
    new THREE.PlaneGeometry(
        500,
        500,
        80,
        80
    );

const posiciones =
    terrenoGeo.attributes.position;

for(let i=0;i<posiciones.count;i++){

    const x =
        posiciones.getX(i);

    const y =
        posiciones.getY(i);

    const altura =
        Math.sin(x*0.04)*0.8 +
        Math.cos(y*0.035)*0.7 +
        Math.sin((x+y)*0.02)*0.5;

    posiciones.setZ(
        i,
        altura
    );
}

terrenoGeo.computeVertexNormals();

const terrenoMat =
    new THREE.MeshStandardMaterial({
        color:0x416d32,
        roughness:.95
    });

const terreno =
    new THREE.Mesh(
        terrenoGeo,
        terrenoMat
    );

terreno.rotation.x =
    -Math.PI/2;

terreno.receiveShadow = true;

scene.add(terreno);


/* =====================================================
   RECURSOS
===================================================== */

let madera = 0;
let piedra = 0;
let comida = 0;

const maderaTxt =
    document.getElementById("madera");

const piedraTxt =
    document.getElementById("piedra");

const comidaTxt =
    document.getElementById("comida");

const mensaje =
    document.getElementById("mensaje");

const objetos = [];


/* =====================================================
   ÁRBOL
===================================================== */

function crearArbol(x,z){

    const grupo =
        new THREE.Group();


    // Tronco

    const troncoGeo =
        new THREE.CylinderGeometry(
            .28,
            .38,
            3.4,
            9
        );

    const troncoMat =
        new THREE.MeshStandardMaterial({
            color:0x59351d,
            roughness:1
        });

    const tronco =
        new THREE.Mesh(
            troncoGeo,
            troncoMat
        );

    tronco.position.y =
        1.7;

    tronco.castShadow = true;
    tronco.receiveShadow = true;

    grupo.add(tronco);


    // Copa inferior

    const hojasGeo =
        new THREE.SphereGeometry(
            1.35,
            9,
            7
        );

    const hojasMat =
        new THREE.MeshStandardMaterial({
            color:0x245d28,
            roughness:1
        });

    const hojas =
        new THREE.Mesh(
            hojasGeo,
            hojasMat
        );

    hojas.position.y =
        3.45;

    hojas.scale.set(
        1.15,
        1,
        1.15
    );

    hojas.castShadow = true;

    grupo.add(hojas);


    // Copa superior

    const hojas2 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1,
                8,
                7
            ),
            hojasMat
        );

    hojas2.position.y =
        4.3;

    hojas2.scale.set(
        1.2,
        .9,
        1.2
    );

    hojas2.castShadow = true;

    grupo.add(hojas2);


    grupo.position.set(
        x,
        0,
        z
    );

    scene.add(grupo);

    objetos.push({
        objeto:grupo,
        tipo:"madera"
    });
}


/* =====================================================
   PIEDRA
===================================================== */

function crearPiedra(x,z){

    const geo =
        new THREE.DodecahedronGeometry(
            .65,
            1
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:0x777b78,
            roughness:1
        });

    const roca =
        new THREE.Mesh(
            geo,
            mat
        );

    roca.position.set(
        x,
        .55,
        z
    );

    roca.rotation.y =
        Math.random()*3;

    roca.scale.y =
        .65;

    roca.castShadow = true;

    scene.add(roca);

    objetos.push({
        objeto:roca,
        tipo:"piedra"
    });
}


/* =====================================================
   GENERAR BOSQUE
===================================================== */

for(let i=0;i<100;i++){

    const x =
        (Math.random()-.5)*220;

    const z =
        (Math.random()-.5)*220;

    if(
        Math.abs(x)<8 &&
        Math.abs(z)<8
    ){
        continue;
    }

    crearArbol(x,z);
}


for(let i=0;i<55;i++){

    const x =
        (Math.random()-.5)*220;

    const z =
        (Math.random()-.5)*220;

    crearPiedra(x,z);
}


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joyPointer = null;

let joyX = 0;
let joyY = 0;


function actualizarJoystick(e){

    const r =
        joystick.getBoundingClientRect();

    let x =
        e.clientX -
        (r.left+r.width/2);

    let y =
        e.clientY -
        (r.top+r.height/2);

    const distancia =
        Math.sqrt(
            x*x+y*y
        );

    const max = 45;

    if(distancia>max){

        x =
            x/distancia*max;

        y =
            y/distancia*max;
    }

    joyX =
        x/max;

    joyY =
        y/max;

    stick.style.transform =
        `translate(${x}px,${y}px)`;
}


function resetJoystick(){

    joyPointer=null;

    joyX=0;
    joyY=0;

    stick.style.transform =
        "translate(0,0)";
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joyPointer =
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        actualizarJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId !==
            joyPointer
        ) return;

        e.preventDefault();

        actualizarJoystick(e);
    }
);


joystick.addEventListener(
    "pointerup",
    e=>{

        if(
            e.pointerId===
            joyPointer
        ){
            resetJoystick();
        }
    }
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =====================================================
   CÁMARA TÁCTIL
===================================================== */

let lookPointer = null;

let ultimoX = 0;
let ultimoY = 0;

let yaw = 0;
let pitch = 0;

const sensibilidad =
    0.006;


renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        if(
            lookPointer !== null
        ) return;

        lookPointer =
            e.pointerId;

        ultimoX =
            e.clientX;

        ultimoY =
            e.clientY;

        renderer.domElement.setPointerCapture(
            e.pointerId
        );

        mensaje.textContent =
            "CÁMARA ACTIVA";

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId !==
            lookPointer
        ) return;

        e.preventDefault();

        const dx =
            e.clientX -
            ultimoX;

        const dy =
            e.clientY -
            ultimoY;

        ultimoX =
            e.clientX;

        ultimoY =
            e.clientY;

        yaw -=
            dx*sensibilidad;

        pitch -=
            dy*sensibilidad;

        pitch =
            Math.max(
                -1.35,
                Math.min(
                    1.35,
                    pitch
                )
            );

        jugador.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

        mensaje.textContent =
            "MIRANDO";

    },
    {passive:false}
);


function soltarCamara(e){

    if(
        e.pointerId===
        lookPointer
    ){

        lookPointer=null;

        mensaje.textContent =
            "Explorá el bosque";
    }
}


renderer.domElement.addEventListener(
    "pointerup",
    soltarCamara
);

renderer.domElement.addEventListener(
    "pointercancel",
    soltarCamara
);


/* =====================================================
   MOVIMIENTO
===================================================== */

function mover(){

    const velocidad=.11;

    const derechaX =
        Math.cos(yaw);

    const derechaZ =
        -Math.sin(yaw);

    const adelanteX =
        -Math.sin(yaw);

    const adelanteZ =
        -Math.cos(yaw);

    const mx =
        derechaX*joyX +
        adelanteX*(-joyY);

    const mz =
        derechaZ*joyX +
        adelanteZ*(-joyY);

    jugador.position.x +=
        mx*velocidad;

    jugador.position.z +=
        mz*velocidad;
}


/* =====================================================
   RECOGER
===================================================== */

function recoger(){

    for(
        let i=objetos.length-1;
        i>=0;
        i--
    ){

        const obj =
            objetos[i];

        const dx =
            jugador.position.x -
            obj.objeto.position.x;

        const dz =
            jugador.position.z -
            obj.objeto.position.z;

        const distancia =
            Math.sqrt(
                dx*dx+
                dz*dz
            );

        if(distancia<2.3){

            if(
                obj.tipo==="madera"
            ){

                madera++;

                maderaTxt.textContent =
                    madera;
            }

            if(
                obj.tipo==="piedra"
            ){

                piedra++;

                piedraTxt.textContent =
                    piedra;
            }

            scene.remove(
                obj.objeto
            );

            objetos.splice(i,1);
        }
    }
}


/* =====================================================
   FOGATA
===================================================== */

document
.getElementById("boton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        if(madera<3){

            mensaje.textContent =
                "Necesitás 3 maderas";

            return;
        }

        madera-=3;

        maderaTxt.textContent =
            madera;


        const fuego =
            new THREE.PointLight(
                0xff6500,
                8,
                12
            );

        fuego.position.set(
            jugador.position.x,
            .8,
            jugador.position.z
        );

        scene.add(fuego);


        const llama =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .45,
                    8,
                    8
                ),
                new THREE.MeshBasicMaterial({
                    color:0xff4200
                })
            );

        llama.position.copy(
            fuego.position
        );

        scene.add(llama);


        mensaje.textContent =
            "FOGATA CONSTRUIDA";
    }
);


/* =====================================================
   ANIMACIÓN
===================================================== */

const reloj =
    new THREE.Clock();

function animar(){

    requestAnimationFrame(
        animar
    );

    mover();

    recoger();

    // pequeño movimiento del fuego/ambiente
    const tiempo =
        reloj.getElapsedTime();

    sol.position.x =
        Math.sin(tiempo*.05)*80;

    renderer.render(
        scene,
        camera
    );
}

animar();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
