  })

let modeloHerramienta = null;


/* =========================================================
 CREAR HACHA 3D
========================================================= */

function crearHachaHierro(esHierro){

 const grupo =
  new THREE.Group();


 /* MANGO */

 const mango =
  new THREE.Mesh(

   new THREE.CylinderGeometry(
    0.045,
    0.055,
    0.85,
    8
   ),

   new THREE.MeshStandardMaterial({
    color:esHierro
     ?0x292929
     :0x70451f
   })
  );

 mango.rotation.z =
  Math.PI/2;

 grupo.add(mango);


 /* CABEZA */

 const cabeza =
  new THREE.Mesh(

   new THREE.BoxGeometry(
    0.18,
    0.42,
    0.12
   ),

   new THREE.MeshStandardMaterial({
    color:esHierro
     ?0x9b9b9b
     :0x777777,
    metalness:esHierro?.8:.1,
    roughness:.45
   })
  );

 cabeza.position.set(
  0.38,
  0,
  0
 );

 cabeza.rotation.z =
 0.12;

 grupo.add(cabeza);


 return grupo;
}

 CREAR PICO 3D
========================================================= */

function crearPicoHierro(esHierro){

 cabeza.rotation.z =

 cabeza.position.x =

/* =========================================================
 ACTUALIZAR MODELO EN MANO
========================================================= */

function actualizarModeloHerramienta(){

 if(modeloHerramienta){

  mano.remove(
   modeloHerramienta
  );

 }

 modeloHerramienta = null;


 if(herramienta.tipo==="hacha"){

  modeloHerramienta =
   crearHachaHierro(
    herramienta.nivel>=2
   );

 }


 if(herramienta.tipo==="pico"){

  modeloHerramienta =
   crearPicoHierro(
    herramienta.nivel>=2
   );

 }


 if(modeloHerramienta){

  modeloHerramienta.scale.set(
   1.15,
   1.15,
   1.15
  );

  modeloHerramienta.rotation.set(
   0,
   0,
   0
  );

  modeloHerramienta.position.set(
   0.08,
   0.03,
   -0.05
  );

  mano.add(
   modeloHerramienta
  );

 }

}


/* =========================================================
 INVENTARIO
========================================================= */

let madera=0;
let piedra=0;
let hierro=0;


let herramienta = {

 nombre:"Mano",
 tipo:"mano",
 nivel:0,
 durabilidad:Infinity,
 maxima:Infinity

};


/* =========================================================
 OBJETOS DEL MUNDO
========================================================= */

const objetos=[];


/* =========================================================
 ÁRBOLES
========================================================= */

function crearArbol(
 x,
 z,
 dureza
){

 const grupo =
  new THREE.Group();


 const altura =
  dureza===1
   ?3.5
   :dureza===2
   ?5
   :6.5;


 const tronco =
  new THREE.Mesh(

   new THREE.CylinderGeometry(
    .28*dureza,
    .38*dureza,
    altura,
    10
   ),

   new THREE.MeshStandardMaterial({
    color:
     dureza===1
      ?0x68401f
      :dureza===2
      ?0x4d2d18
      :0x321b0b
   })
  );


 tronco.position.y =
  altura/2;

 tronco.castShadow=true;

 grupo.add(tronco);


 const copa =
  new THREE.Mesh(

   new THREE.SphereGeometry(
    dureza===1
     ?1.4
     :dureza===2
     ?1.8
     :2.2,
    10,
    8
   ),

   new THREE.MeshStandardMaterial({
    color:
     dureza===1
      ?0x28652d
      :dureza===2
      ?0x194d21
      :0x0d3217
   })
  );


 copa.position.y =
  altura+.4;

 copa.castShadow=true;

 grupo.add(copa);


 grupo.position.set(
  x,
  0,
  z
 );

 scene.add(grupo);


 const vida =
  dureza===1
   ?3
   :dureza===2
   ?6
   :10;


 objetos.push({

  objeto:grupo,

  tipo:"arbol",

  dureza:dureza,

  vida:vida,

  vidaMax:vida,

  madera:
   dureza===1
    ?4
    :dureza===2
    ?7
    :12

 });

}


/* =========================================================
 ROCAS
========================================================= */

function crearRoca(
 x,
 z,
 dureza
){

 const roca =
  new THREE.Mesh(

   new THREE.DodecahedronGeometry(
    .7+dureza*.15,
    1
   ),

   new THREE.MeshStandardMaterial({
    color:
     dureza===1
      ?0x777777
      :dureza===2
      ?0x555b61
      :0x33383d,
    roughness:1
   })
  );


 roca.position.set(
  x,
  .55,
  z
 );

 roca.scale.y=.7;

 roca.castShadow=true;

 scene.add(roca);


 const vida =
  dureza===1
   ?3
   :dureza===2
   ?6
   :10;


 objetos.push({

  objeto:roca,

  tipo:
   dureza===3
    ?"hierro"
    :"piedra",

  dureza:dureza,

  vida:vida,

  vidaMax:vida,

  recurso:
   dureza===3
    ?"hierro"
    :"piedra"

 });

}


/* =========================================================
 GENERAR MUNDO
========================================================= */

for(let i=0;i<75;i++){

 const x=
  (Math.random()-.5)*200;

 const z=
  (Math.random()-.5)*200;

 if(
  Math.abs(x)<10 &&
  Math.abs(z)<10
 ) continue;

 const r=Math.random();

 const dureza=
  r<.55
   ?1
   :r<.85
   ?2

 crearArbol(
  x,z,dureza
 );

}


for(let i=0;i<50;i++){

 const x=
  (Math.random()-.5)*200;

 const z=
  (Math.random()-.5)*200;

 const r=Math.random();

 const dureza=
  r<.55
   ?1
   :r<.85
   ?2
   :3;

 crearRoca(
  x,z,dureza
 );

}


/* =========================================================
 HUD
========================================================= */

const maderaTxt=
 document.getElementById("madera");

const piedraTxt=
 document.getElementById("piedra");

const hierroTxt=
 document.getElementById("hierro");

const invMadera=
 document.getElementById("invMadera");

const invPiedra=
 document.getElementById("invPiedra");

const invHierro=
 document.getElementById("invHierro");

const mensaje=

const objetivoTxt=

 maderaTxt.textContent=

 piedraTxt.textContent=

 hierroTxt.textContent=

/* =========================================================
 EQUIPAR
========================================================= */

function equipar(
 nombre,
 tipo,
 nivel,
 durabilidad
){

 herramienta={

  nombre:nombre,
  tipo:tipo,
  nivel:nivel,
  durabilidad:durabilidad,
  maxima:durabilidad

 };

 actualizarInventario();

 mensaje.textContent=
  "Equipaste "+nombre;

}


/* =========================================================
 CÁMARA
========================================================= */

let lookPointer=null;

let ultimoX=0;
let ultimoY=0;

let yaw=0;
let pitch=0;

const sensibilidad=.006;


renderer.domElement.addEventListener(
 "pointerdown",
 e=>{

  if(lookPointer!==null)
   return;

  lookPointer=e.pointerId;

  ultimoX=e.clientX;
  ultimoY=e.clientY;

  renderer.domElement.setPointerCapture(
   e.pointerId
  );

 },
 {passive:false}
);


renderer.domElement.addEventListener(
 "pointermove",
 e=>{

  if(e.pointerId!==lookPointer)
   return;

  e.preventDefault();

  const dx=
   e.clientX-ultimoX;

  const dy=
   e.clientY-ultimoY;

  ultimoX=e.clientX;
  ultimoY=e.clientY;

  yaw-=dx*sensibilidad;

  pitch-=dy*sensibilidad;

  pitch=
   Math.max(
    -1.35,
    Math.min(
     1.35,
     pitch
    )
   );

  jugador.rotation.y=yaw;

  camera.rotation.x=pitch;

 },
 {passive:false}
);


renderer.domElement.addEventListener(
 "pointerup",
 e=>{

  if(e.pointerId===lookPointer)
   lookPointer=null;

 }
);


renderer.domElement.addEventListener(
 "pointercancel",
 e=>{

  if(e.pointerId===lookPointer)
   lookPointer=null;

 }
);


/* =========================================================
 BUSCAR OBJETIVO
========================================================= */

function buscarObjetivo(){

 let mejor=null;

 let mejorDist=4;


 for(
  const obj of objetos
 ){

  const dx=
   obj.objeto.position.x-
   jugador.position.x;

  const dz=
   obj.objeto.position.z-
   jugador.position.z;

  const distancia=
   Math.sqrt(
    dx*dx+
    dz*dz
   );

  const angulo=
   Math.atan2(
    dx,
    -dz
   );

  let diferencia=
   Math.abs(
    ((angulo-yaw+Math.PI)
    %(Math.PI*2))-Math.PI
   );


  if(
   distancia<mejorDist &&
   diferencia<.65
  ){

   mejor=obj;
   mejorDist=distancia;

  }

 }

 return mejor;
}


/* =========================================================
 ANIMACIÓN DEL ARMA
========================================================= */

let golpeando=false;


function animarGolpe(){

 if(
  golpeando ||
  !modeloHerramienta
 )
 return;


 golpeando=true;


 const inicioPos =
  modeloHerramienta.position.clone();

 const inicioRot =
  modeloHerramienta.rotation.clone();


 let inicio=
  performance.now();


 const duracion=260;


 function frame(){

  const ahora=
   performance.now();

  let t=
   (ahora-inicio)/duracion;


  if(t>1)
   t=1;


  /*
   movimiento:
   atrás → adelante → atrás
  */

  let fuerza;

  if(t<.45){

   fuerza=t/.45;

  }else{

   fuerza=
    1-
    (t-.45)/.55;

  }


  modeloHerramienta.position.z=
   inicioPos.z-
   .55*fuerza;


  modeloHerramienta.position.y=
   inicioPos.y+
   .18*fuerza;


  modeloHerramienta.rotation.z=
   inicioRot.z-
   .9*fuerza;


  modeloHerramienta.rotation.x=
   inicioRot.x+
   .45*fuerza;


  if(t<1){

   requestAnimationFrame(
    frame
   );

  }else{

   modeloHerramienta.position.copy(
    inicioPos
   );

   modeloHerramienta.rotation.copy(
    inicioRot
   );

   golpeando=false;

  }

 }

 requestAnimationFrame(
  frame
 );

}


/* =========================================================
 GOLPEAR
========================================================= */

document
.getElementById("golpear")
.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();


  /*
   SIEMPRE ANIMAR EL ARMA
  */

  animarGolpe();


  const objetivo=
   buscarObjetivo();


  if(!objetivo){

   mensaje.textContent=
    "No hay nada para golpear";

   return;

  }


  /*
   REQUISITO HACHA
  */

  if(
   objetivo.tipo==="arbol" &&
   herramienta.tipo!=="hacha"
  ){

   mensaje.textContent=
    "Necesitás un hacha";

   return;

  }


  /*
   REQUISITO PICO
  */

  if(
   (
    objetivo.tipo==="piedra" ||
    objetivo.tipo==="hierro"
   ) &&
   herramienta.tipo!=="pico"
  ){

   mensaje.textContent=
    "Necesitás un pico";

   return;

  }


  /*
   NIVEL
  */

  if(
   herramienta.nivel<
   objetivo.dureza
  ){

   mensaje.textContent=
    "Esta herramienta es demasiado débil";

   return;

  }


  /*
   DAÑO
  */

  let daño=1;

  if(
   herramienta.nivel>
   objetivo.dureza
  ){

   daño=2;

  }


  objetivo.vida-=daño;

  herramienta.durabilidad--;


  /*
   ANIMAR RECURSO
  */

  const rz=
   objetivo.objeto.rotation.z;

  objetivo.objeto.rotation.z=
   -.10;


  setTimeout(
   ()=>{

    objetivo.objeto.rotation.z=
     rz;

   },
   100
  );


  /*
   VIDA
  */

  objetivoTxt.style.display=
   "block";


  objetivoTxt.innerHTML=
   (
    objetivo.tipo==="arbol"
     ?"ÁRBOL"
     :objetivo.tipo==="hierro"
     ?"HIERRO"
     :"PIEDRA"
   )
   +
   "<br>"+
   Math.max(
    0,
    objetivo.vida
   )+
   "/"+
   objetivo.vidaMax;


  mensaje.textContent=
   "Golpe: -"+
   daño;


  /*
   ROMPER
  */

  if(
   objetivo.vida<=0
  ){

   if(
    objetivo.tipo==="arbol"
   ){

    madera+=
     objetivo.madera;

    mensaje.textContent=
     "ÁRBOL ROTO +"+
     objetivo.madera+
     " MADERA";

   }


   if(
    objetivo.tipo==="piedra"
   ){

    const cantidad=
     3+objetivo.dureza;

    piedra+=cantidad;

    mensaje.textContent=
     "ROCA ROTA +"+
     cantidad+
     " PIEDRA";

   }


   if(
    objetivo.tipo==="hierro"
   ){

    const cantidad=
     2+objetivo.dureza;

    hierro+=cantidad;

    mensaje.textContent=
     "MINERAL ROTO +"+
     cantidad+
     " HIERRO";

   }


   scene.remove(
    objetivo.objeto
   );


   const index=
    objetos.indexOf(
     objetivo
    );

   if(index!==-1){

    objetos.splice(
     index,
     1
    );

   }


   setTimeout(
    ()=>{

     objetivoTxt.style.display=
      "none";

    },
    700
   );

  }


  /*
   HERRAMIENTA ROTA
  */

  if(
   herramienta.durabilidad<=0
  ){

   mensaje.textContent=
    herramienta.nombre+
    " SE ROMPIÓ";

   herramienta={

    nombre:"Mano",
    tipo:"mano",
    nivel:0,
    durabilidad:Infinity,
    maxima:Infinity

   };

  }


  actualizarInventario();

 }
);


/* =========================================================
 JOYSTICK
========================================================= */

const joystick=
 document.getElementById(
  "joystick"
 );

const stick=
 document.getElementById(
  "stick"
 );

let joyPointer=null;

let joyX=0;
let joyY=0;


function actualizarJoystick(e){

 const r=
  joystick.getBoundingClientRect();

 let x=
  e.clientX-
  (r.left+r.width/2);

 let y=
  e.clientY-
  (r.top+r.height/2);

 const distancia=
  Math.sqrt(
   x*x+y*y
  );

 const max=45;


 if(distancia>max){

  x=
   x/distancia*max;

  y=
   y/distancia*max;

 }


 joyX=x/max;
 joyY=y/max;


 stick.style.transform=
  `translate(${x}px,${y}px)`;

}


function resetJoystick(){

 joyPointer=null;

 joyX=0;
 joyY=0;

 stick.style.transform=
  "translate(0,0)";

}


joystick.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();

  joyPointer=e.pointerId;

  joystick.setPointerCapture(
   e.pointerId
  );

  actualizarJoystick(e);

 }
);


joystick.addEventListener(
 "pointermove",
 e=>{

  if(
   e.pointerId!==joyPointer
  )
   return;

  actualizarJoystick(e);

 }
);


joystick.addEventListener(
 "pointerup",
 resetJoystick
);


joystick.addEventListener(
 "pointercancel",
 resetJoystick
);


/* =========================================================
 MOVIMIENTO
========================================================= */

function mover(){

 const velocidad=.10;


 const derechaX=
  Math.cos(yaw);

 const derechaZ=
  -Math.sin(yaw);


 const adelanteX=
  -Math.sin(yaw);

 const adelanteZ=
  -Math.cos(yaw);


 jugador.position.x+=
 (
  derechaX*joyX+
  adelanteX*(-joyY)
 )*velocidad;


 jugador.position.z+=
 (
  derechaZ*joyX+
  adelanteZ*(-joyY)
 )*velocidad;

}
