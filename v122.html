<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================================================
   V12.2
   ========================================================= */

const WORLD=10000;
const HALF=5000;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8eb5c8);
scene.fog=new THREE.Fog(0x8eb5c8,500,6500);

const camera=new THREE.PerspectiveCamera(

);

const renderer=new THREE.WebGLRenderer({
antialias:false,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
document.body.appendChild(renderer.domElement);

/* LUCES */

scene.add(
 new THREE.HemisphereLight(
  0xc8e4ff,
  0x44543a,
  1.7
 )
);

const sun=new THREE.DirectionalLight(0xffffff,1.25);
sun.position.set(500,1000,400);
scene.add(sun);

/* MATERIALES */

const groundMat=new THREE.MeshLambertMaterial({color:0x587348});
const grassMat=new THREE.MeshLambertMaterial({color:0x3f6d38});
const trunkMat=new THREE.MeshLambertMaterial({color:0x65452e});
const leavesMat=new THREE.MeshLambertMaterial({color:0x28572d});
const leavesDark=new THREE.MeshLambertMaterial({color:0x193e22});
const rockMat=new THREE.MeshLambertMaterial({color:0x77746d});
const darkRock=new THREE.MeshLambertMaterial({color:0x55534e});
const wallMat=new THREE.MeshLambertMaterial({color:0x8d6c4e});
const wallInside=new THREE.MeshLambertMaterial({color:0x70543d});
const woodMat=new THREE.MeshLambertMaterial({color:0x553a28});
const roofMat=new THREE.MeshLambertMaterial({color:0x463028});
const windowMat=new THREE.MeshLambertMaterial({color:0x496c70});
const roadMat=new THREE.MeshLambertMaterial({color:0x454542});
const waterMat=new THREE.MeshLambertMaterial({
 color:0x3e899e,
 transparent:true,
 opacity:.82
});
const sandMat=new THREE.MeshLambertMaterial({color:0xb4a26d});
const redMat=new THREE.MeshLambertMaterial({color:0xa82020});

/* UTILIDADES */

function box(w,h,d,mat,x,y,z){
 const o=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat
 );
 o.position.set(x,y,z);
 scene.add(o);
 return o;
}

function cyl(r,h,mat,x,y,z){
 const o=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,h,8),
  mat
 );
 o.position.set(x,y,z);
 scene.add(o);
 return o;
}

function rnd(a,b){
 return Math.random()*(b-a)+a;
}

function distance(x,z){
 return Math.hypot(x,z);
}

/* TERRENO */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(WORLD,WORLD),
 groundMat
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* =========================================================
   CASAS
   Las paredes son objetos sólidos.
   Las ventanas son huecos reales: no hay vidrio.
   ========================================================= */

const buildings=[];

function wall(x,y,z,w,h,d){
 const o=box(w,h,d,wallMat,x,y,z);
 buildings.push({
  x,z,
  w,
  d,
  h
 });
 return o;
}

function makeWindowFront(x,z){

 /* marco exterior */
 box(4,.35,.3,woodMat,x,3.0,z);
 box(4,.35,.3,woodMat,x,1.0,z);
 box(.35,2.0,.3,woodMat,x-2,2,z);
 box(.35,2.0,.3,woodMat,x+2,2,z);

 /* madera central */
 box(.25,2.0,.32,woodMat,x,2,z);
}

function makeWindowSide(x,z){

 box(.3,.35,4,woodMat,x,3,z);
 box(.3,.35,4,woodMat,x,1,z);
 box(.3,2,.35,woodMat,x,2,z-2);
 box(.3,2,.35,woodMat,x,2,z+2);

 box(.32,2,.25,woodMat,x,2,z);
}

function house(x,z,w=24,d=18){

 const h=4;

 /* cuatro paredes divididas para dejar ventanas abiertas */

 const frontZ=z+d/2;
 const backZ=z-d/2;

 /* frente */
 wall(x-w/2+2,2,frontZ,4,h,.5);
 wall(x+w/2-2,2,frontZ,4,h,.5);

 wall(x-6,2,frontZ,6,h,.5);
 wall(x+6,2,frontZ,6,h,.5);

 /* pared trasera */
 wall(x,2,backZ,w,h,.5);

 /* laterales */
 wall(x-w/2,2,z, .5,h,d);
 wall(x+w/2,2,z, .5,h,d);

 /* ventanas delanteras */
 makeWindowFront(x-7,frontZ+.03);
 makeWindowFront(x+7,frontZ+.03);

 /* ventanas laterales */
 makeWindowSide(x-w/2-.03,z-4);
 makeWindowSide(x-w/2-.03,z+4);

 /* puerta: hueco central */
 box(2.8,4,.25,woodMat,x,2,frontZ+.08);

 /* piso */
 box(w,.25,d,wallInside,x,.05,z);

 /* techo */
 const roof=box(
  w+2,1.5,d+2,
  roofMat,x,5,z
 );
 roof.rotation.y=Math.PI/4;

 /* interior simple */
 box(
  5,.1,3,
  woodMat,
  x-5,.25,z-3
 );

 box(
  3,1.2,1.2,
  woodMat,
  x+5,.7,z-3
 );

}

const places=[
 {n:"Base",x:0,z:0},

 {n:"Granja Verde",x:-700,z:700},

 {n:"Lago Perdido",x:-1800,z:1000},
 {n:"Ruinas Antiguas",x:-2200,z:-900},
 {n:"Ciudad Vieja",x:2600,z:-2200},
 {n:"Mina Vieja",x:2200,z:1900},
 {n:"Bosque Negro",x:-3000,z:2500},
 {n:"Lago Escondido",x:3000,z:1200},
 {n:"Pueblo Abandonado",x:3600,z:-500},
 {n:"Fábrica",x:-3000,z:-2300},
 {n:"Gasolinera Abandonada",x:-1400,z:-2600},
 {n:"Autopista Destruida",x:0,z:-3000},
 {n:"Puente Viejo",x:-700,z:-1600},
 {n:"Campamento Abandonado",x:1400,z:3000},
 {n:"Cantera",x:3300,z:2800},
 {n:"Campo de Cultivo",x:-2500,z:2200},
 {n:"Fuerte Abandonado",x:-3800,z:500},
 {n:"Hospital Abandonado",x:3000,z:-3000},
 {n:"Zona Industrial",x:3800,z:-2200},
 {n:"Estación de Tren",x:-3600,z:-1800},
 {n:"Cementerio",x:1200,z:-3600},

];

/* BASE */

house(0,0,24,18);

box(.3,8,.3,woodMat,0,4,-14);
box(5,2.5,.2,redMat,2.5,7,-14);

/* CASA ABANDONADA */

house(450,-250,24,18);

/* GRANJA */

house(-700,700,28,20);

for(let i=0;i<12;i++){
 box(
  130,.08,1,

}

/* CIUDAD */

for(let ix=-1;ix<=1;ix++){

}

/* PUEBLO */

for(let i=0;i<8;i++){
 house(
  3600+rnd(-230,230),
  -500+rnd(-180,180),
  22,17
 );
}

/* CAMPAMENTO */

for(let i=0;i<5;i++){
 house(
  1400+rnd(-120,120),
  3000+rnd(-120,120),
  16,12
 );
}

/* HOSPITAL */

box(65,20,42,wallMat,3000,10,-3000);

for(let x=-22;x<=22;x+=11){
 for(let y=5;y<=15;y+=5){
  box(
   5,3,.3,
   windowMat,
   3000+x,y,-3021
  );

}

/* FÁBRICA */

box(60,12,38,darkRock,-3000,6,-2300);

for(let i=-2;i<=2;i++){
 cyl(
  3,25,
  darkRock,
  -3000+i*10,
  12,
  -2325

}

/* ZONA INDUSTRIAL */

for(let i=0;i<6;i++){
 box(
  55,10,35,
  darkRock,
  3800+rnd(-170,170),

 );
}

/* ESTACIÓN */

box(70,9,22,wallMat,-3600,4.5,-1800);

/* =========================================================
   NATURALEZA
   ========================================================= */

function tree(x,z,s=1){

 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .3*s,.45*s,3.2*s,7
  ),
  trunkMat
 );

 trunk.position.y=1.6*s;
 g.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(
   2.2*s,4*s,8
  ),
  Math.random()>.5?leavesMat:leavesDark
 );

 crown.position.y=4.3*s;
 g.add(crown);

 g.position.set(x,0,z);
 scene.add(g);
}

function forest(cx,cz,r,count){

 for(let i=0;i<count;i++){

  const a=Math.random()*Math.PI*2;
  const d=Math.sqrt(Math.random())*r;

  tree(
   cx+Math.cos(a)*d,
   cz+Math.sin(a)*d,
   rnd(.75,1.3)
  );
 }
}

forest(700,-2100,500,130);
forest(-3000,2500,600,150);
forest(2500,3500,600,150);
forest(-1800,1000,400,60);
forest(3000,1200,350,55);

for(let i=0;i<170;i++){

 const x=rnd(-4800,4800);
 const z=rnd(-4800,4800);

 if(Math.abs(x)<250&&Math.abs(z)<250)continue;

 tree(x,z,rnd(.7,1.2));
}

/* ROCAS */

for(let i=0;i<180;i++){

 const r=new THREE.Mesh(
  new THREE.DodecahedronGeometry(rnd(.6,1.6),0),
  Math.random()>.5?rockMat:darkRock
 );

 r.position.set(
  rnd(-4800,4800),
  rnd(.3,.8),
  rnd(-4800,4800)
 );

 scene.add(r);
}

/* =========================================================
   AGUA
   ========================================================= */

function lake(x,z,sx,sz){

 const w=new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,.08,48),
  waterMat
 );

 w.scale.set(sx,1,sz);
 w.position.set(x,.025,z);
 scene.add(w);

 const shore=new THREE.Mesh(
  new THREE.RingGeometry(1,1.08,48),
  sandMat
 );

 shore.scale.set(sx,1,sz);
 shore.rotation.x=-Math.PI/2;
 shore.position.set(x,.01,z);
 scene.add(shore);
}

lake(-1800,1000,220,150);
lake(3000,1200,180,120);

/* =========================================================
   ROADS
   ========================================================= */

function road(x1,z1,x2,z2,width){

 const dx=x2-x1;
 const dz=z2-z1;
 const len=Math.hypot(dx,dz);

 const r=box(
  width,.08,len,
  roadMat,
  (x1+x2)/2,.04,(z1+z2)/2
 );

 r.rotation.y=Math.atan2(dx,dz);
}

road(-4000,-3000,4000,-3000,30);
road(2400,-2200,2800,-2200,20);
road(2600,-2400,2600,-2000,20);

/* =========================================================
   JUGADOR
   ========================================================= */

const player={
 x:0,
 y:0,
 z:25,
 yaw:0,
 pitch:-.1,
 speed:4.2,
 running:false,
 stamina:100,
 vy:0
};

/* PERSONA */

const character=new THREE.Group();
scene.add(character);

const body=box(1,1.1,.55,
 new THREE.MeshLambertMaterial({color:0x314f78}),
 0,0,0);

body.position.set(0,1.25,0);
body.parent.remove(body);
character.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.38,12,8),
 new THREE.MeshLambertMaterial({color:0xc38d6c})
);
head.position.y=2.05;
character.add(head);

const armL=box(.25,1,.25,
 new THREE.MeshLambertMaterial({color:0x315178}),
 -.68,1.3,0);

const armR=box(.25,1,.25,
 new THREE.MeshLambertMaterial({color:0x315178}),
 .68,1.3,0);

character.add(armL,armR);

const legL=box(.28,1.05,.3,
 new THREE.MeshLambertMaterial({color:0x222b35}),
 -.25,.52,0);

const legR=box(.28,1.05,.3,
 new THREE.MeshLambertMaterial({color:0x222b35}),
 .25,.52,0);

character.add(legL,legR);

/* =========================================================
   JOYSTICK CORREGIDO
   ========================================================= */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let active=false;

function moveJoy(x,y){

 const r=joy.getBoundingClientRect();

 let dx=x-(r.left+r.width/2);
 let dy=y-(r.top+r.height/2);

 const max=55;
 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.left=(41+dx)+"px";
 stick.style.top=(41+dy)+"px";
}

joy.addEventListener("pointerdown",e=>{
 active=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e.clientX,e.clientY);
});

joy.addEventListener("pointermove",e=>{
 if(active)moveJoy(e.clientX,e.clientY);
});

function resetJoy(){
 active=false;
 joyX=0;
 joyY=0;
 stick.style.left="41px";
 stick.style.top="41px";
}

joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

/* =========================================================
   CÁMARA
   ========================================================= */

let dragging=false;
let lx=0;
let ly=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 dragging=true;
 lx=e.clientX;
 ly=e.clientY;
});

renderer.domElement.addEventListener("pointermove",e=>{

 if(!dragging)return;

 const dx=e.clientX-lx;
 const dy=e.clientY-ly;

 lx=e.clientX;
 ly=e.clientY;

 player.yaw-=dx*.006;
 player.pitch-=dy*.004;

 player.pitch=Math.max(
  -1.15,
  Math.min(.65,player.pitch)
 );
});

renderer.domElement.addEventListener("pointerup",()=>{
 dragging=false;
});

renderer.domElement.addEventListener("pointercancel",()=>{
 dragging=false;
});

/* =========================================================
   MOVIMIENTO
   ========================================================= */

function movement(dt){

 /*
   IMPORTANTE:

   joystick arriba:
   joyY = -1
   forward = +1

   cámara mirando hacia adelante:
   X = sin(yaw)
   Z = -cos(yaw)

   derecha:
   X = +1
   Z = 0

   Por eso derecha ya NO queda invertida.
 */

 const forward=-joyY;
 const right=joyX;

 const dx=
  Math.sin(player.yaw)*forward+
  Math.cos(player.yaw)*right;

 const dz=
  -Math.cos(player.yaw)*forward+
  Math.sin(player.yaw)*right;

 const moving=
  Math.abs(dx)>.03||
  Math.abs(dz)>.03;

 let speed=player.speed;

 if(player.running&&moving&&player.stamina>0){
  speed=7.4;
  player.stamina-=30*dt;
 }else{
  player.stamina+=18*dt;
 }

 player.stamina=Math.max(
  0,
  Math.min(100,player.stamina)
 );

 if(moving){

  const nx=player.x+dx*speed*dt;
  const nz=player.z+dz*speed*dt;

  if(!blocked(nx,player.z)){
   player.x=nx;
  }

  if(!blocked(player.x,nz)){
   player.z=nz;
  }

  character.rotation.y=Math.atan2(dx,dz);
 }

 player.vy-=20*dt;
 player.y+=player.vy*dt;

 if(player.y<0){
  player.y=0;
  player.vy=0;
 }
}

/* =========================================================
   COLISIONES DE CASAS
   ========================================================= */

function blocked(x,z){

 const radius=.65;

 for(const b of buildings){

  if(
   x> b.x-b.w/2-radius &&
   x< b.x+b.w/2+radius &&
   z> b.z-b.d/2-radius &&
   z< b.z+b.d/2+radius
  ){

   /*
    Hay puertas y ventanas.
    Dejamos pequeñas aberturas en determinados sectores.
   */

   const front=z>b.z+b.d/2-.9;

   if(front){

    const door=Math.abs(x-b.x)<1.8;

    if(door){
     continue;
    }

    /* ventanas abiertas */
    const win1=Math.abs(x-(b.x-7))<2.2;
    const win2=Math.abs(x-(b.x+7))<2.2;

    if(win1||win2){
     continue;
    }
   }

   return true;
  }
 }

 return false;
}

/* =========================================================
   SALTO / CORRER
   ========================================================= */

document.getElementById("jump").addEventListener(
 "pointerdown",
 ()=>{
  if(player.y<=.01)player.vy=8;
 }
);

runBtn.addEventListener("pointerdown",()=>{

});

runBtn.addEventListener("pointerup",()=>{

});

runBtn.addEventListener("pointercancel",()=>{

/* =========================================================
   CÁMARA 1ª / 3ª
   ========================================================= */

let firstPerson=true;

document.getElementById("cam").onclick=()=>{

 firstPerson=!firstPerson;

 character.visible=!firstPerson;

 document.getElementById("cam").textContent=
  firstPerson?"3ª PERSONA":"1ª PERSONA";
};

/* =========================================================
   CÁMARA
   ========================================================= */

function updateCamera(){

 if(firstPerson){

  camera.position.set(
   player.x,
   player.y+1.65,
   player.z
  );

  camera.rotation.order="YXZ";
  camera.rotation.y=player.yaw;
  camera.rotation.x=player.pitch;

 }else{

  const back=7;

  camera.position.set(
   player.x-Math.sin(player.yaw)*back,
   player.y+3.6,
   player.z+Math.cos(player.yaw)*back
  );

  camera.lookAt(
   player.x,
   player.y+1.3,
   player.z
  );
 }

 character.position.set(
  player.x,
  player.y,
  player.z
 );
}

/* =========================================================
   MAPA
   ========================================================= */

const mapBox=document.getElementById("mapBox");
const map=document.getElementById("map");
const ctx=map.getContext("2d");

const discovered={Base:true};

function mx(x){
 return 400+x/12.5;
}

function mz(z){
 return 400+z/12.5;
}

function drawMap(){

 ctx.fillStyle="#30462f";
 ctx.fillRect(0,0,800,800);

 ctx.strokeStyle="#ffffff12";

 for(let i=0;i<=800;i+=50){

  ctx.beginPath();
  ctx.moveTo(i,0);
  ctx.lineTo(i,800);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,i);
  ctx.lineTo(800,i);
  ctx.stroke();
 }

 for(const p of places){

  const x=mx(p.x);
  const y=mz(p.z);

  if(x<0||x>800||y<0||y>800)continue;

  const d=Math.hypot(
   player.x-p.x,
   player.z-p.z
  );

  const seen=
   p.n==="Base"||
   discovered[p.n]||
   d<90;

  ctx.fillStyle=seen?"#d9bd55":"#777";

  ctx.beginPath();
  ctx.arc(x,y,7,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.font="12px Arial";
  ctx.fillText(
   seen?p.n:"???",
   x+10,y+4
  );
 }

 const px=mx(player.x);
 const py=mz(player.z);

 ctx.fillStyle="#ff2222";
 ctx.beginPath();
 ctx.arc(px,py,9,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#fff";
 ctx.lineWidth=3;

 ctx.beginPath();
 ctx.moveTo(px,py);
 ctx.lineTo(
  px+Math.sin(player.yaw)*25,
  py-Math.cos(player.yaw)*25
 );
 ctx.stroke();
}

document.getElementById("mapBtn").onclick=()=>{
 mapBox.style.display="block";
 drawMap();
};

document.getElementById("closeMap").onclick=()=>{
 mapBox.style.display="none";
};

/* =========================================================
   DESCUBRIMIENTO
   ========================================================= */

function discover(){

 let nearest=places[0];
 let nd=Infinity;

 for(const p of places){

  const d=Math.hypot(
   player.x-p.x,
   player.z-p.z
  );

  if(d<nd){
   nd=d;
   nearest=p;
  }

  if(d<90&&!discovered[p.n]){
   discovered[p.n]=true;
   message("📍 DESCUBRISTE: "+p.n);
  }
 }

 document.getElementById("place").textContent=
  nd<120?nearest.n:"Zona desconocida";

 document.getElementById("dist").textContent=
  formatDistance(distance(player.x,player.z));
}

function formatDistance(d){

 if(d<1000)return Math.round(d)+" m";

 return (d/1000).toFixed(1)+" km";
}

document.getElementById("door").onclick=()=>{
 message("🚪 Acercate a una puerta para entrar");
};

document.getElementById("flag").onclick=()=>{
 const n=prompt("Nombre de la bandera:");
 if(n)message("🚩 Bandera colocada: "+n);
};

document.getElementById("mapBox");

/* =========================================================
   MENSAJES
   ========================================================= */

let timer;

function message(t){

 const m=document.getElementById("msg");

 m.textContent=t;
 m.style.display="block";

 clearTimeout(timer);

 timer=setTimeout(()=>{
  m.style.display="none";
 },2300);
}

/* =========================================================
   SUPERVIVENCIA
   ========================================================= */

let hp=100;
let food=100;
let water=100;
let surv=0;

function survival(dt){

 surv+=dt;

 if(surv>10){

  surv=0;

  food=Math.max(0,food-.5);
  water=Math.max(0,water-.8);

  if(food<=0||water<=0){
   hp=Math.max(0,hp-1);
  }
 }

 document.getElementById("hp").textContent=Math.round(hp);
 document.getElementById("food").textContent=Math.round(food);
 document.getElementById("water").textContent=Math.round(water);
 document.getElementById("stam").textContent=Math.round(player.stamina);
}

/* =========================================================
   ANIMACIÓN
   ========================================================= */

let walk=0;

function animate(dt){

 const moving=
  Math.abs(joyX)>.05||
  Math.abs(joyY)>.05;

 if(moving){

  walk+=dt*9;

  legL.rotation.x=Math.sin(walk)*.45;
  legR.rotation.x=-Math.sin(walk)*.45;

  armL.rotation.x=-Math.sin(walk)*.35;
  armR.rotation.x=Math.sin(walk)*.35;

 }else{

  legL.rotation.x*=.8;
  legR.rotation.x*=.8;
  armL.rotation.x*=.8;
  armR.rotation.x*=.8;
 }
}

/* =========================================================
   DÍA / NOCHE
   ========================================================= */

let time=0;

function dayNight(dt){

 time+=dt*.015;

 const h=Math.sin(time);

 sun.intensity=.45+Math.max(0,h)*1.15;

 if(h<0){
  scene.background.set(0x162235);
  scene.fog.color.set(0x162235);
 }else{
  scene.background.set(0x8eb5c8);
  scene.fog.color.set(0x8eb5c8);
 }
}

/* =========================================================
   LOOP
   ========================================================= */

let last=performance.now();

function loop(now){

 requestAnimationFrame(loop);

 const dt=Math.min(
  .05,
  (now-last)/1000
 );

 last=now;

 movement(dt);
 animate(dt);
 updateCamera();
 survival(dt);
 discover();
 dayNight(dt);

 renderer.render(scene,camera);
}

character.visible=false;

message("🌎 V12.2 — explorá y entrá a las casas");

requestAnimationFrame(loop);

/* RESIZE */

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );
});
</script>
